<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini 重設計 — X/Threads 圖片（中文）16:9</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 675px;
    overflow: hidden;
    font-family: 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
    background: #0A0F1E;
    color: #F5F5F5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1200px;
    height: 675px;
    position: relative;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    top: -200px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(66,133,244,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .card::before {
    content: '';
    position: absolute;
    bottom: -150px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(234,67,53,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, #4285F4 0%, #EA4335 33%, #FBBC05 66%, #34A853 100%);
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #4285F4;
    background: rgba(66, 133, 244, 0.1);
    border: 1px solid rgba(66, 133, 244, 0.25);
    padding: 6px 14px;
    border-radius: 4px;
    width: fit-content;
    position: relative;
    z-index: 1;
  }
  .tag-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4285F4;
  }
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 28px 0;
    position: relative;
    z-index: 1;
  }
  .headline {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.2;
    color: #FFFFFF;
    max-width: 820px;
    letter-spacing: -0.01em;
  }
  .headline em {
    font-style: normal;
    color: #4285F4;
  }
  .subline {
    font-size: 19px;
    line-height: 1.5;
    color: #9CA3AF;
    max-width: 680px;
  }
  .features {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .feat {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: #D1D5DB;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .feat.highlight {
    color: #60A5FA;
    background: rgba(59,130,246,0.1);
    border-color: rgba(59,130,246,0.25);
  }
  .contrast {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    width: fit-content;
  }
  .contrast-item { font-size: 16px; font-weight: 600; }
  .contrast-item.old { color: #6B7280; text-decoration: line-through; }
  .contrast-item.new { color: #34D399; }
  .contrast-arrow { color: #4B5563; font-size: 20px; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
    z-index: 1;
  }
  .byline { font-size: 14px; color: #6B7280; }
  .byline strong { color: #9CA3AF; font-weight: 600; }
  .date-tag { font-size: 13px; color: #4B5563; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>

  <div class="tag">
    <div class="tag-dot"></div>
    AI UX · 2026年8月26日
  </div>

  <div class="main-content">
    <div class="headline">
      Google 為了 <em>UX 原因</em><br>
      重設計了 Gemini。<br>
      這才是真正的故事。
    </div>
    <div class="subline">
      沒有新模型。沒有新能力。純粹的 UX 迭代——這個訊號比任何模型升級都更值得關注。
    </div>
    <div class="features">
      <div class="feat">對話篩選器</div>
      <div class="feat highlight">自適應通知</div>
      <div class="feat">更簡潔版面</div>
      <div class="feat">多模態顯示優化</div>
    </div>
    <div class="contrast">
      <span class="contrast-item old">能力升級</span>
      <span class="contrast-arrow">→</span>
      <span class="contrast-item new">可用性升級</span>
    </div>
  </div>

  <div class="footer">
    <div class="byline">
      <strong>Senior UX 視角</strong> · Google Gemini 視覺重設計
    </div>
    <div class="date-tag">2026年8月26日</div>
  </div>
</div>
</body>
</html>
