<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050C08;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081508;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)" />

  <!-- Top visual section: Figma Specs + Code Layers diagram -->
  <rect x="60" y="60" width="960" height="520" rx="20" fill="#09150C" stroke="#132214" stroke-width="1.5"/>

  <!-- Window chrome -->
  <rect x="60" y="60" width="960" height="52" rx="20" fill="#0D1F12"/>
  <rect x="60" y="96" width="960" height="16" fill="#0D1F12"/>
  <circle cx="96" cy="86" r="8" fill="#FF5F57"/>
  <circle cx="122" cy="86" r="8" fill="#FEBC2E"/>
  <circle cx="148" cy="86" r="8" fill="#28C840"/>
  <text x="540" y="91" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#10B981" opacity="0.7" text-anchor="middle">Figma · Specs + Code Layers · Open Beta</text>

  <!-- Specs panel (left) -->
  <rect x="80" y="132" width="420" height="428" rx="10" fill="#060E08" stroke="#0F2016" stroke-width="1"/>
