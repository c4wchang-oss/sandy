  <text x="820" y="806" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6EE7B7" opacity="0.7" font-style="italic">that ended up mattering got there before</text>
  <text x="820" y="826" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6EE7B7" opacity="0.7" font-style="italic">anyone was paying attention."</text>

