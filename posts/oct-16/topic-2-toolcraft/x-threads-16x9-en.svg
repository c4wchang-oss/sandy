  <text x="820" y="426" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A7060">you see it. Quality gate at tool-authorship level.</text>

  <rect x="800" y="448" width="4" height="56" rx="2" fill="#10B981" opacity="0.7"/>
  <text x="820" y="468" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A7F3D0" font-weight="600">Skills convergence arc complete</text>
  <text x="820" y="488" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A7060">Code editors ’ design tools ’ web CMSs ’</text>
  <text x="820" y="506" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A7060">creative desktop apps ’ tool authorship itself.</text>

  <rect x="800" y="528" width="4" height="72" rx="2" fill="#10B981" opacity="0.4"/>
  <text x="820" y="548" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A7F3D0" font-weight="600">Open question: who does the taste audit?</text>
  <text x="820" y="568" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A7060">Architecture . Defaults, affordances, discoverability</text>
  <text x="820" y="586" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A7060">= product design decisions. No framework encodes taste.</text>

