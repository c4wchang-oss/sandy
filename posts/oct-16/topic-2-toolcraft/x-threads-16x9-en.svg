  <rect x="800" y="368" width="4" height="56" rx="2" fill="#10B981" opacity="0.7"/>
  <text x="820" y="388" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A7F3D0" font-weight="600">Visual testing rules  the new detail</text>
