<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0905"/>
      <stop offset="100%" style="stop-color:#1a1008"/>
    </linearGradient>
    <linearGradient id="orange1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg1)"/>

  <!-- Left accent bar  orange for Runway -->
  <rect x="64" y="64" width="3" height="547" fill="url(#orange1)" opacity="0.9"/>

  <!-- Category label -->
  <text x="88" y="108" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#f97316" letter-spacing="3" opacity="0.85">AI UX · OCT 27, 2026</text>

  <!-- Main headline -->
  <text x="88" y="185" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1">Workflow as product.</text>
  <text x="88" y="245" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="400" fill="#f97316">Runway App Studio ships.</text>

  <!-- Divider -->
  <rect x="88" y="272" width="72" height="2" fill="#ea580c" opacity="0.5"/>

  <!-- Core insight -->
  <text x="88" y="322" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="400" fill="#9ca3af">The power user stops being a bottleneck.</text>
  <text x="88" y="350" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="400" fill="#9ca3af">They become the architect.</text>

  <!-- Workflow steps (right side) -->
  <!-- Step 1: Describe -->
  <rect x="720" y="90" width="400" height="60" rx="6" fill="#160c04" stroke="#292219" stroke-width="1"/>
  <rect x="720" y="90" width="4" height="60" fill="#f97316" rx="2"/>
  <text x="742" y="116" font-family="'SF Mono', monospace" font-size="11" fill="#fb923c" font-weight="600" letter-spacing="1">01</text>
  <text x="742" y="137" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#e2e8f0">Describe the app you want</text>

  <!-- Arrow -->
  <text x="911" y="167" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#4b5563">“</text>

  <!-- Step 2: Build -->
  <rect x="720" y="175" width="400" height="60" rx="6" fill="#160c04" stroke="#292219" stroke-width="1"/>
  <rect x="720" y="175" width="4" height="60" fill="#fb923c" rx="2"/>
  <text x="742" y="201" font-family="'SF Mono', monospace" font-size="11" fill="#fb923c" font-weight="600" letter-spacing="1">02</text>
  <text x="742" y="222" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#e2e8f0">App Studio builds, tests, deploys</text>

  <!-- Arrow -->
  <text x="911" y="252" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#4b5563">“</text>

  <!-- Step 3: Share -->
  <rect x="720" y="260" width="400" height="60" rx="6" fill="#1a0e05" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="720" y="260" width="4" height="60" fill="#ea580c" rx="2"/>
  <text x="742" y="286" font-family="'SF Mono', monospace" font-size="11" fill="#fb923c" font-weight="600" letter-spacing="1">03</text>
  <text x="742" y="307" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#f1f5f9" font-weight="600">Team runs the app  no prompt engineering</text>

  <!-- Key insight block (bottom left) -->
  <rect x="88" y="400" width="568" height="100" rx="6" fill="#160c04" stroke="#292219" stroke-width="1"/>
  <text x="112" y="436" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#ea580c" letter-spacing="1.5">BRAND KIT = STRUCTURAL CONSTRAINT</text>
  <text x="112" y="462" font-family="'Helvetica Neue', sans-serif" font-size="17" fill="#e2e8f0">Not a checklist. Baked into how the app runs.</text>
  <text x="112" y="487" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#6b7280">The app can't drift from brand. The constraint is architectural.</text>

  <!-- Honest caveat -->
  <rect x="720" y="348" width="400" height="70" rx="6" fill="#0d0a06" stroke="#292219" stroke-width="1"/>
  <text x="742" y="374" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#f59e0b" letter-spacing="1" font-weight="600">WATCH FOR</text>
  <text x="742" y="396" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#9ca3af">Runway-native · Taste judgment doesn't encode</text>
  <text x="742" y="413" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#6b7280">Wrong workflow ’ app scales the wrong thing</text>

  <!-- What encodes / what doesn't -->
  <rect x="720" y="436" width="400" height="74" rx="6" fill="#160c04" stroke="#ea580c" stroke-width="1"/>
  <text x="742" y="462" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#fb923c" font-weight="600" letter-spacing="1">THE REAL QUESTION</text>
  <text x="742" y="486" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Whose workflow is worth encoding?</text>
  <text x="742" y="504" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#6b7280">What gets lost in the translation?</text>

  <!-- Bottom attribution -->
  <text x="88" y="624" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#374151">Senior UX perspective · runway.com/news · Included in every paid Runway plan</text>
</svg>
