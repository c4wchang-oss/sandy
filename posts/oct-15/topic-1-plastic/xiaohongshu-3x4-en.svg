<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050C08;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081508;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060E08;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)" />

  <!-- Top section: visual -->
  <rect x="60" y="60" width="960" height="480" rx="20" fill="#0A1810" stroke="#143020" stroke-width="1.5"/>

  <!-- Window chrome -->
  <rect x="60" y="60" width="960" height="52" rx="20" fill="#0E2018"/>
  <rect x="60" y="96" width="960" height="16" fill="#0E2018"/>
  <circle cx="96" cy="86" r="8" fill="#FF5F57"/>
  <circle cx="122" cy="86" r="8" fill="#FEBC2E"/>
  <circle cx="148" cy="86" r="8" fill="#28C840"/>
  <text x="540" y="91" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#10B981" opacity="0.8" text-anchor="middle">Plastic  canvas.html · no export step</text>

  <!-- Code panel left -->
  <rect x="80" y="132" width="380" height="380" rx="10" fill="#060E08"/>
  <!-- Code content -->
  <text x="100" y="164" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#10B981" opacity="0.9">&lt;div class="layout"&gt;</text>
  <text x="116" y="188" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" opacity="0.75">  display: grid;</text>
  <text x="116" y="212" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" opacity="0.75">  gap: var(--sp-8);</text>
  <text x="116" y="236" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" opacity="0.75">  color: var(--c-text);</text>
  <text x="100" y="260" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#10B981" opacity="0.9">&lt;/div&gt;</text>
  <text x="100" y="300" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#10B981" opacity="0.9">&lt;button class="cta"&gt;</text>
  <text x="116" y="324" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" opacity="0.75">  background: var(</text>
  <text x="116" y="348" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#10B981" opacity="0.8">    --c-primary</text>
  <text x="116" y="372" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" opacity="0.75">  );</text>
  <text x="100" y="396" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#10B981" opacity="0.9">&lt;/button&gt;</text>
  <!-- Cursor line indicator -->
  <rect x="100" y="432" width="2" height="40" rx="1" fill="#10B981" opacity="0.9"/>
  <rect x="106" y="440" width="200" height="14" rx="3" fill="#10B981" opacity="0.08"/>
  <text x="108" y="452" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#10B981" opacity="0.4">agent editing here...</text>
  <rect x="100" y="480" width="240" height="20" rx="4" fill="#143020" opacity="0.6"/>
  <text x="108" y="494" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#6EE7B7" opacity="0.5">0 rebuild · 0 export · ship direct</text>

  <!-- Visual preview right -->
  <rect x="480" y="132" width="520" height="380" rx="10" fill="#081410" stroke="#143020" stroke-width="1"/>
  <!-- Mini nav -->
  <rect x="496" y="148" width="488" height="36" rx="6" fill="#0E2018"/>
  <rect x="510" y="160" width="60" height="10" rx="3" fill="#10B981" opacity="0.7"/>
  <rect x="880" y="160" width="40" height="10" rx="3" fill="#1A3020" opacity="0.6"/>
  <rect x="928" y="160" width="40" height="10" rx="3" fill="#1A3020" opacity="0.6"/>
  <!-- Hero -->
  <rect x="496" y="194" width="488" height="120" rx="6" fill="#0A1810" stroke="#143020" stroke-width="1"/>
  <rect x="512" y="214" width="180" height="18" rx="4" fill="#10B981" opacity="0.45"/>
  <rect x="512" y="240" width="280" height="10" rx="3" fill="#1A3020" opacity="0.5"/>
  <rect x="512" y="258" width="240" height="10" rx="3" fill="#1A3020" opacity="0.35"/>
  <rect x="512" y="280" width="100" height="28" rx="6" fill="#10B981" opacity="0.85"/>
  <text x="562" y="299" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#050C08" font-weight="700" text-anchor="middle">Get started</text>
  <!-- Feature grid -->
  <rect x="496" y="326" width="152" height="80" rx="6" fill="#0E2018" stroke="#143020" stroke-width="1"/>
  <rect x="508" y="338" width="60" height="32" rx="4" fill="#143020"/>
  <rect x="508" y="378" width="80" height="8" rx="3" fill="#1A3020" opacity="0.6"/>
  <rect x="508" y="392" width="60" height="6" rx="3" fill="#1A3020" opacity="0.4"/>
  <rect x="656" y="326" width="152" height="80" rx="6" fill="#0E2018" stroke="#143020" stroke-width="1"/>
  <rect x="668" y="338" width="60" height="32" rx="4" fill="#143020"/>
  <rect x="668" y="378" width="80" height="8" rx="3" fill="#1A3020" opacity="0.6"/>
  <rect x="668" y="392" width="60" height="6" rx="3" fill="#1A3020" opacity="0.4"/>
  <rect x="816" y="326" width="152" height="80" rx="6" fill="#0A2018" stroke="#10B981" stroke-width="1.5"/>
  <rect x="828" y="338" width="60" height="32" rx="4" fill="#10B981" opacity="0.25"/>
  <rect x="828" y="378" width="80" height="8" rx="3" fill="#10B981" opacity="0.4"/>
  <rect x="828" y="392" width="60" height="6" rx="3" fill="#10B981" opacity="0.25"/>
  <!-- Agent label on canvas -->
  <rect x="800" y="148" width="172" height="28" rx="6" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="1"/>
  <text x="886" y="167" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#10B981" opacity="0.9" text-anchor="middle">Agent editing · live</text>

  <!-- Headline section -->
  <rect x="60" y="572" width="960" height="4" rx="2" fill="url(#accent)"/>

  <rect x="60" y="596" width="160" height="32" rx="16" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="1"/>
  <text x="140" y="618" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#10B981" font-weight="600" text-anchor="middle">PLASTIC</text>

  <text x="60" y="700" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="80" fill="#F0FAF4" font-weight="800" letter-spacing="-3">The canvas</text>
  <text x="60" y="800" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="80" fill="#34D399" font-weight="800" letter-spacing="-3">is HTML.</text>

  <text x="60" y="856" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#6EE7B7" opacity="0.8" font-weight="300">No export. No rebuild. No translation layer.</text>

  <!-- Points -->
  <rect x="60" y="892" width="960" height="1" fill="#143020"/>

  <rect x="60" y="912" width="44" height="44" rx="8" fill="#10B981" opacity="0.12"/>
  <text x="82" y="940" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#10B981" text-anchor="middle" font-weight="700">01</text>
  <text x="118" y="930" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#F0FAF4" font-weight="600">You draw. It ships.</text>
  <text x="118" y="954" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6EE7B7" opacity="0.65">Canvas edits ’ production HTML/CSS. Instantly.</text>

  <rect x="60" y="980" width="44" height="44" rx="8" fill="#10B981" opacity="0.12"/>
  <text x="82" y="1008" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#10B981" text-anchor="middle" font-weight="700">02</text>
  <text x="118" y="998" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#F0FAF4" font-weight="600">Agents read the real design.</text>
  <text x="118" y="1022" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6EE7B7" opacity="0.65">Claude, Codex, Cursor, Grok via MCP.</text>

  <rect x="60" y="1048" width="44" height="44" rx="8" fill="#10B981" opacity="0.12"/>
  <text x="82" y="1076" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#10B981" text-anchor="middle" font-weight="700">03</text>
  <text x="118" y="1066" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#F0FAF4" font-weight="600">Constrained by design.</text>
  <text x="118" y="1090" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6EE7B7" opacity="0.65">Agents can't run system commands. That's the trust.</text>

  <rect x="60" y="1116" width="44" height="44" rx="8" fill="#10B981" opacity="0.12"/>
  <text x="82" y="1144" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#10B981" text-anchor="middle" font-weight="700">04</text>
  <text x="118" y="1134" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#F0FAF4" font-weight="600">Figma import works.</text>
  <text x="118" y="1158" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6EE7B7" opacity="0.65">Drop .fig ’ pages, frames, variables ’ HTML/CSS.</text>

  <!-- Divider -->
  <rect x="60" y="1190" width="960" height="1" fill="#143020"/>

  <!-- Honest caveat box -->
  <rect x="60" y="1206" width="960" height="80" rx="12" fill="#060E08" stroke="#143020" stroke-width="1"/>
  <text x="84" y="1232" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#10B981" opacity="0.7" font-weight="600">Honest caveat</text>
  <text x="84" y="1254" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6EE7B7" opacity="0.55">Invite-only preview. Mac (Apple silicon) + browser. Optimized for web,</text>
  <text x="84" y="1272" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6EE7B7" opacity="0.55">not Figma-scale design systems. "No rebuild" depends on your token fidelity.</text>

  <!-- Pattern note -->
  <text x="60" y="1322" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#10B981" opacity="0.5">Pattern: Elyx ’ Timeful ’ Plastic</text>
  <text x="60" y="1346" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6EE7B7" opacity="0.4">Three tools challenging the binary design file format simultaneously.</text>

  <!-- Source + watermark -->
  <text x="60" y="1410" font-family="'SF Mono', 'Fira Code', monospace" font-size="15" fill="#10B981" opacity="0.45">useplastic.app</text>
  <text x="1020" y="1410" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#10B981" opacity="0.3" text-anchor="end">Senior UX · Oct 2026</text>
</svg>
