<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0A1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#120F20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08061A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Subtle grid -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#14103A" stroke-width="1"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#14103A" stroke-width="1"/>
  <line x1="520" y1="0" x2="520" y2="900" stroke="#14103A" stroke-width="1"/>

  <!-- Left panel: motion visualization -->
  <rect x="40" y="60" width="440" height="780" rx="16" fill="#0A0818" stroke="#1A1535" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="40" y="60" width="440" height="48" rx="16" fill="#0F0C20"/>
  <rect x="40" y="92" width="440" height="16" fill="#0F0C20"/>
  <circle cx="68" cy="84" r="6" fill="#FF5F57"/>
  <circle cx="90" cy="84" r="6" fill="#FEBC2E"/>
  <circle cx="112" cy="84" r="6" fill="#28C840"/>
  <text x="240" y="89" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8B5CF6" opacity="0.8" text-anchor="middle">Autograph 2027.0 · MCP</text>

  <!-- Motion timeline visualization -->
  <text x="60" y="140" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8B5CF6" opacity="0.6">Agent: Claude Code · building composition</text>

  <!-- Composition preview area -->
  <rect x="56" y="156" width="408" height="180" rx="8" fill="#08061A" stroke="#1A1535" stroke-width="1"/>

  <!-- Animated logo preview -->
  <rect x="156" y="176" width="208" height="140" rx="6" fill="#0F0C20"/>
  <!-- Logo shape suggestion -->
  <circle cx="260" cy="216" r="30" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  <circle cx="260" cy="216" r="20" fill="#8B5CF6" opacity="0.12"/>
  <text x="260" y="222" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#A78BFA" text-anchor="middle" font-weight="700">A</text>
  <!-- Motion arc paths -->
  <path d="M 156 246 Q 200 196 244 226" stroke="#8B5CF6" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4,4"/>
  <path d="M 276 226 Q 320 196 364 246" stroke="#A78BFA" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Text below logo -->
  <rect x="176" y="272" width="168" height="8" rx="3" fill="#1A1535" opacity="0.7"/>
  <rect x="196" y="288" width="128" height="6" rx="3" fill="#1A1535" opacity="0.5"/>

  <!-- Timeline -->
  <rect x="56" y="348" width="408" height="80" rx="8" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
  <text x="72" y="368" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8B5CF6" opacity="0.6">Timeline · 2.4s</text>
  <!-- Playhead and tracks -->
  <rect x="72" y="378" width="376" height="2" rx="1" fill="#1A1535"/>
  <rect x="72" y="378" width="120" height="2" rx="1" fill="#8B5CF6" opacity="0.7"/>
  <!-- Track rows -->
  <rect x="72" y="388" width="320" height="12" rx="3" fill="#8B5CF6" opacity="0.15"/>
  <rect x="72" y="388" width="80" height="12" rx="3" fill="#8B5CF6" opacity="0.4"/>
  <text x="156" y="399" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#A78BFA" opacity="0.5">Bounce · ease-out</text>
  <rect x="72" y="406" width="200" height="12" rx="3" fill="#A78BFA" opacity="0.12"/>
  <rect x="72" y="406" width="50" height="12" rx="3" fill="#A78BFA" opacity="0.35"/>
  <text x="126" y="417" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#A78BFA" opacity="0.5">Elastic · spring(0.5)</text>

  <!-- Easing curves -->
  <rect x="56" y="440" width="196" height="80" rx="8" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
  <text x="72" y="460" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8B5CF6" opacity="0.6">Bounce curve</text>
  <!-- Bounce SVG curve approximation -->
  <polyline points="72,510 96,490 116,508 136,486 156,496 176,480 196,480" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.8"/>

  <rect x="268" y="440" width="196" height="80" rx="8" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
  <text x="284" y="460" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#A78BFA" opacity="0.6">Elastic curve</text>
  <!-- Elastic SVG curve approximation -->
  <polyline points="284,510 308,470 328,510 348,475 368,495 388,480 408,476" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- MCP connection indicator -->
  <rect x="56" y="536" width="408" height="60" rx="8" fill="#08061A" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="72" y="558" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8B5CF6" opacity="0.8">MCP Connected</text>
  <text x="72" y="576" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#A78BFA" opacity="0.6">Claude · ChatGPT · constructing composition</text>
  <circle cx="440" cy="566" r="6" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="440" cy="566" r="12" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>

  <!-- Governance gap visualization -->
  <rect x="56" y="612" width="408" height="200" rx="8" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
  <text x="72" y="634" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8B5CF6" opacity="0.6">Design system governance status</text>
  <!-- Color row -->
  <rect x="72" y="648" width="160" height="30" rx="6" fill="#0F0C20"/>
  <circle cx="92" cy="663" r="6" fill="#10B981"/>
  <text x="106" y="668" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C4B5FD" opacity="0.8">Color  brand owns</text>
  <!-- Type row -->
  <rect x="72" y="686" width="180" height="30" rx="6" fill="#0F0C20"/>
  <circle cx="92" cy="701" r="6" fill="#10B981"/>
  <text x="106" y="706" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C4B5FD" opacity="0.8">Typography  DS owns</text>
  <!-- Motion row  alert state -->
  <rect x="72" y="724" width="200" height="30" rx="6" fill="#2D1050" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="92" cy="739" r="6" fill="#F59E0B"/>
  <text x="106" y="744" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#FCD34D" opacity="0.9">Motion  nobody owns</text>
  <text x="72" y="776" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8B5CF6" opacity="0.4">Agent will execute without governance.</text>
  <text x="72" y="792" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8B5CF6" opacity="0.4">That's the DesignOps problem now.</text>

  <!-- Right content panel -->
  <!-- Tag -->
  <rect x="560" y="72" width="180" height="28" rx="14" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="650" y="91" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8B5CF6" font-weight="600" text-anchor="middle">OCT 14 · FREE TOOL</text>

  <!-- Main headline -->
  <text x="560" y="168" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="68" fill="#FAF5FF" font-weight="700" letter-spacing="-2">Motion has</text>
  <text x="560" y="248" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="68" fill="#A78BFA" font-weight="700" letter-spacing="-2">agent access.</text>

  <!-- Accent line -->
  <rect x="560" y="272" width="480" height="4" rx="2" fill="url(#accent)"/>

  <!-- Sub headline -->
  <text x="560" y="326" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#C4B5FD" font-weight="400">Autograph 2027 + MCP</text>
  <text x="560" y="364" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#C4B5FD" font-weight="400">Claude + ChatGPT · free · macOS+Win</text>

  <!-- Divider -->
  <rect x="560" y="408" width="480" height="1" fill="#1A1535"/>

  <!-- Point 1 -->
  <circle cx="580" cy="460" r="20" fill="#8B5CF6" opacity="0.15"/>
  <text x="580" y="465" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#8B5CF6" text-anchor="middle" font-weight="700">01</text>
  <text x="616" y="453" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FAF5FF" font-weight="600">Agents build compositions inside the app.</text>
  <text x="616" y="475" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4B5FD" opacity="0.7">Bounce, Elastic curves, responsive layouts. MCP-native.</text>

  <!-- Point 2 -->
  <circle cx="580" cy="534" r="20" fill="#8B5CF6" opacity="0.15"/>
  <text x="580" y="539" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#8B5CF6" text-anchor="middle" font-weight="700">02</text>
  <text x="616" y="527" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FAF5FF" font-weight="600">Convergence arc: complete.</text>
  <text x="616" y="549" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4B5FD" opacity="0.7">Code ’ Figma ’ Web CMS ’ Comfy ’ Voyager ’ Autograph.</text>

  <!-- Point 3 -->
  <circle cx="580" cy="610" r="20" fill="#8B5CF6" opacity="0.15"/>
  <text x="580" y="615" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#8B5CF6" text-anchor="middle" font-weight="700">03</text>
  <text x="616" y="603" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FAF5FF" font-weight="600">Brief quality is the only bottleneck now.</text>
  <text x="616" y="625" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4B5FD" opacity="0.7">Write like a motion director. Not a prompt engineer.</text>

  <!-- Divider -->
  <rect x="560" y="660" width="480" height="1" fill="#1A1535"/>

  <!-- Governance frame -->
  <rect x="560" y="678" width="480" height="90" rx="10" fill="#0F0C20" stroke="#1A1535" stroke-width="1"/>
  <text x="580" y="704" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8B5CF6" opacity="0.8" font-weight="600">Motion DesignOps is now unavoidable.</text>
  <text x="580" y="726" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#C4B5FD" opacity="0.6">Color ’ brand. Type ’ DS. Motion ’ nobody.</text>
  <text x="580" y="748" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#C4B5FD" opacity="0.6">Agents will execute without governance. That's a DesignOps problem.</text>

  <!-- Source -->
  <text x="560" y="818" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#8B5CF6" opacity="0.5">Autograph 2027.0 · free · maxon.net</text>

  <!-- Watermark -->
  <text x="1560" y="870" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8B5CF6" opacity="0.3" text-anchor="end">Senior UX · Oct 2026</text>
</svg>
