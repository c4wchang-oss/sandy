  <text x="100" y="158" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8B5CF6" opacity="0.6">composition ∑ agent building</text>
  <!-- Logo animation frame -->
  <rect x="100" y="168" width="380" height="180" rx="8" fill="#0F0C20"/>
  <circle cx="290" cy="238" r="50" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>
  <circle cx="290" cy="238" r="35" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="290" cy="238" r="20" fill="#8B5CF6" opacity="0.15"/>
  <text x="290" y="246" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#A78BFA" text-anchor="middle" font-weight="700">A</text>
  <!-- Motion arcs -->
  <path d="M 140 268 Q 200 198 250 248" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6,4"/>
  <path d="M 330 248 Q 380 198 440 268" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6,4"/>
  <!-- Text below -->
  <rect x="140" y="316" width="300" height="10" rx="4" fill="#1A1535" opacity="0.6"/>
  <rect x="180" y="332" width="220" height="8" rx="3" fill="#1A1535" opacity="0.4"/>
  <!-- Timeline -->
  <rect x="100" y="360" width="380" height="10" rx="2" fill="#14103A"/>
  <rect x="100" y="360" width="150" height="10" rx="2" fill="#8B5CF6" opacity="0.6"/>
  <rect x="100" y="376" width="380" height="8" rx="2" fill="#A78BFA" opacity="0.1"/>
  <rect x="100" y="376" width="80" height="8" rx="2" fill="#A78BFA" opacity="0.4"/>
  <!-- Curve labels -->
  <text x="100" y="400" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8B5CF6" opacity="0.7">Bounce</text>
  <text x="240" y="400" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#A78BFA" opacity="0.6">Elastic ∑ spring(0.5)</text>
