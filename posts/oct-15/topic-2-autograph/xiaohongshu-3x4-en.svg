  <rect x="540" y="174" width="440" height="52" rx="8" fill="#0F0C20"/>
  <circle cx="564" cy="200" r="10" fill="#10B981"/>
  <text x="582" y="196" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C4B5FD" font-weight="600">Color</text>
  <text x="582" y="216" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C4B5FD" opacity="0.5">brand team owns it</text>

  <rect x="540" y="236" width="440" height="52" rx="8" fill="#0F0C20"/>
  <circle cx="564" cy="262" r="10" fill="#10B981"/>
  <text x="582" y="258" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C4B5FD" font-weight="600">Typography</text>
  <text x="582" y="278" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C4B5FD" opacity="0.5">design systems owns it</text>

  <rect x="540" y="298" width="440" height="52" rx="8" fill="#2D1050" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="564" cy="324" r="10" fill="#F59E0B"/>
  <text x="582" y="320" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#FCD34D" font-weight="700">Motion</text>
  <text x="582" y="340" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#FCD34D" opacity="0.7">nobody owns it ê this is the problem</text>

  <text x="540" y="390" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8B5CF6" opacity="0.6">Agents will execute without constraints.</text>
  <text x="540" y="410" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8B5CF6" opacity="0.5">That's now a DesignOps problem.</text>

  <rect x="540" y="430" width="440" height="60" rx="8" fill="#12093A" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="560" y="455" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A78BFA" opacity="0.8" font-weight="600">Skills convergence arc: COMPLETE</text>
  <text x="560" y="475" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8B5CF6" opacity="0.5">codeífigmaíCMSícomfyívoyageríautograph</text>

