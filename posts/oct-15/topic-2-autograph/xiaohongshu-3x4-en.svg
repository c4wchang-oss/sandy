  <rect x="60" y="596" width="200" height="32" rx="16" fill="#8B5CF6" opacity="0.12" stroke="#8B5CF6" stroke-width="1"/>
  <text x="160" y="618" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B5CF6" font-weight="600" text-anchor="middle">AUTOGRAPH 2027</text>

  <!-- Main headline -->
  <text x="60" y="712" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="82" fill="#FAF5FF" font-weight="800" letter-spacing="-3">Motion has</text>
  <text x="60" y="810" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="82" fill="#A78BFA" font-weight="800" letter-spacing="-3">agent access.</text>

  <text x="60" y="866" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#C4B5FD" opacity="0.8">Now who owns the motion constraints?</text>

