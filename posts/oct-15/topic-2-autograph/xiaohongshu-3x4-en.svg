  <rect x="60" y="60" width="960" height="52" rx="20" fill="#0F0C20"/>
  <rect x="60" y="96" width="960" height="16" fill="#0F0C20"/>
  <circle cx="96" cy="86" r="8" fill="#FF5F57"/>
  <circle cx="122" cy="86" r="8" fill="#FEBC2E"/>
  <circle cx="148" cy="86" r="8" fill="#28C840"/>
  <text x="540" y="91" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B5CF6" opacity="0.8" text-anchor="middle">Autograph 2027.0  Motion + MCP</text>

  <!-- Left: motion canvas preview -->
  <rect x="80" y="132" width="420" height="380" rx="10" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
