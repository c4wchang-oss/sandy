  <rect x="60" y="900" width="960" height="1" fill="#1A1535"/>

  <rect x="60" y="920" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.12"/>
  <text x="82" y="948" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#8B5CF6" text-anchor="middle" font-weight="700">01</text>
  <text x="118" y="938" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#FAF5FF" font-weight="600">Claude + ChatGPT build inside the app.</text>
  <text x="118" y="962" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C4B5FD" opacity="0.65">MCP-native. Bounce + Elastic. Responsive layouts.</text>

  <rect x="60" y="988" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.12"/>
  <text x="82" y="1016" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#8B5CF6" text-anchor="middle" font-weight="700">02</text>
  <text x="118" y="1006" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#FAF5FF" font-weight="600">Skills arc is complete.</text>
  <text x="118" y="1030" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C4B5FD" opacity="0.65">Every creative tool layer now has agent access.</text>

  <rect x="60" y="1056" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.12"/>
  <text x="82" y="1084" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#8B5CF6" text-anchor="middle" font-weight="700">03</text>
  <text x="118" y="1074" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#FAF5FF" font-weight="600">Brief quality = the only bottleneck.</text>
  <text x="118" y="1098" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C4B5FD" opacity="0.65">Write like a motion director. Not a prompt engineer.</text>

  <rect x="60" y="1124" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.12"/>
  <text x="82" y="1152" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#8B5CF6" text-anchor="middle" font-weight="700">04</text>
  <text x="118" y="1142" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#FAF5FF" font-weight="600">Motion DesignOps is now unavoidable.</text>
  <text x="118" y="1166" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C4B5FD" opacity="0.65">Nobody owns the motion style library. That changes now.</text>

  <!-- Divider -->
  <rect x="60" y="1198" width="960" height="1" fill="#1A1535"/>

  <!-- Honest caveat box -->
  <rect x="60" y="1214" width="960" height="80" rx="12" fill="#08061A" stroke="#1A1535" stroke-width="1"/>
  <text x="84" y="1240" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8B5CF6" opacity="0.7" font-weight="600">Honest caveat</text>
  <text x="84" y="1262" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4B5FD" opacity="0.55">Free motion-graphics tool, not After Effects at production scale. Agent building a</text>
  <text x="84" y="1280" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4B5FD" opacity="0.55">composition ` understanding motion intent. Taste is still yours.</text>

  <!-- Source + watermark -->
  <text x="60" y="1410" font-family="'SF Mono', 'Fira Code', monospace" font-size="15" fill="#8B5CF6" opacity="0.45">Autograph 2027.0 ∑ free ∑ maxon.net</text>
  <text x="1020" y="1410" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8B5CF6" opacity="0.3" text-anchor="end">Senior UX ∑ Oct 2026</text>
</svg>
