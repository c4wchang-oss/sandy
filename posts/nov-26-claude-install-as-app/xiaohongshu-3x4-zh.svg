<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#F97316"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="390" height="34" rx="17" fill="#1A0D00"/>
  <text x="80" y="82" font-size="13" fill="#F97316" font-weight="600" letter-spacing="1">CLAUDE INSTALL AS APP · 2026 年 11 月 24 日</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Artifact →</text>
  <text x="60" y="232" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">已安裝工具。</text>
  <text x="60" y="310" font-size="38" fill="#FDBA74" font-weight="700" letter-spacing="-1">Brief → Artifact → Dock。</text>
  <text x="60" y="360" font-size="38" fill="#FDBA74" font-weight="700" letter-spacing="-1">序列閉合了。</text>

  <!-- Divider -->
  <line x1="60" y1="392" x2="840" y2="392" stroke="#202020" stroke-width="1.5"/>

  <!-- Feature label -->
  <text x="60" y="430" font-size="13" fill="#F97316" font-weight="600" letter-spacing="2">三個權限層</text>

  <!-- Default -->
  <rect x="60" y="450" width="780" height="62" rx="6" fill="#141414" stroke="#78350F" stroke-width="1"/>
  <text x="80" y="476" font-size="14" fill="#B45309" font-weight="700">預設 — 和瀏覽器分頁一樣 · 沒有新的表面積</text>
  <text x="80" y="498" font-size="13" fill="#606060">所有已安裝 artifact 的安全起始點</text>

  <!-- App Permissions -->
  <rect x="60" y="528" width="780" height="80" rx="6" fill="#1A0D00" stroke="#F97316" stroke-width="1.5"/>
  <text x="80" y="556" font-size="14" fill="#F97316" font-weight="700">APP 權限 — 通知 + 作業系統整合</text>
  <text x="80" y="580" font-size="14" fill="#FDBA74">通知 · 全域快捷鍵 · 永遠在最上層的視窗</text>
  <text x="80" y="600" font-size="12" fill="#78350F">選單欄項目（macOS）· 系統匣（Windows）· 需要明確同意</text>

  <!-- Full Access -->
  <rect x="60" y="624" width="780" height="80" rx="6" fill="#1A0D00" stroke="#F97316" stroke-width="1.5"/>
  <text x="80" y="652" font-size="14" fill="#F97316" font-weight="700">完整存取 — 執行程式 · 讀取/寫入/刪除檔案</text>
  <text x="80" y="676" font-size="14" fill="#FDBA74">不需要每次詢問 · 只限你自己撰寫的 artifact</text>
  <text x="80" y="696" font-size="12" fill="#78350F">外部 artifact 顯示警告 · Team/Enterprise：admin 控制這個層</text>

  <!-- Trust architecture note -->
  <rect x="60" y="722" width="780" height="80" rx="8" fill="#0F0700" stroke="#78350F" stroke-width="1.5"/>
  <text x="80" y="750" font-size="14" fill="#F97316" font-weight="600">關鍵信任決策：</text>
  <text x="80" y="774" font-size="14" fill="#A0A0A0">權限以版本為單位。每次編輯都重設授予。</text>
  <text x="80" y="798" font-size="13" fill="#606060">如果同意涵蓋默默的更新，那不是同意——那是你某時同意過一次的勾選框。</text>

  <!-- The governance section -->
  <text x="60" y="842" font-size="13" fill="#F97316" font-weight="600" letter-spacing="2">治理缺口</text>

  <text x="60" y="874" font-size="15" fill="#FDBA74" font-weight="600">分享連結 → 任何人都可以把它安裝為 app。</text>
  <text x="60" y="898" font-size="14" fill="#606060">獨立：低風險。團隊：誰管理你的團隊可以安裝</text>
  <text x="60" y="918" font-size="14" fill="#606060">哪些 artifact 以哪個權限層？產品目前還沒有答案。</text>

  <text x="60" y="958" font-size="15" fill="#FDBA74" font-weight="600">Team 方案：app 功能開啟，完整存取關閉直到 admin 啟用。</text>
  <text x="60" y="982" font-size="14" fill="#606060">Enterprise：整個功能關閉直到 owner 在組織設定中啟用。</text>

  <!-- Caveats section -->
  <text x="60" y="1022" font-size="13" fill="#F97316" font-weight="600" letter-spacing="2">誠實的前提</text>

  <text x="60" y="1054" font-size="14" fill="#606060">需要網路連線 + Claude 帳號才能保持開啟（不是本地優先）</text>
  <text x="60" y="1074" font-size="14" fill="#606060">Claude Docs、Slides、Sheets：無法安裝為 app</text>
  <text x="60" y="1094" font-size="14" fill="#606060">HIPAA 組織 + 混合部署：被排除在這個功能之外</text>

  <!-- Bottom reframe -->
  <text x="60" y="1130" font-size="17" fill="#FFFFFF" font-weight="600">不是「更快建構 app」。</text>
  <text x="60" y="1154" font-size="17" fill="#FFFFFF" font-weight="600">你在對話描述就建構出的工具，就是你從 Dock 執行的工具。</text>

  <!-- Attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A2A1A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
