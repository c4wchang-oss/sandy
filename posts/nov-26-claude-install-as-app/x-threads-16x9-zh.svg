<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#F97316" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#F97316" font-weight="600" letter-spacing="2">CLAUDE INSTALL AS APP · 2026 年 11 月 24 日 · BETA</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Artifact → 已安裝工具。</text>
  <text x="104" y="224" font-size="38" fill="#FDBA74" font-weight="700" letter-spacing="-1">Brief → Artifact → Dock。序列閉合。</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#222222" stroke-width="1.5"/>

  <!-- Three permission tier boxes -->
  <!-- Default tier -->
  <rect x="80" y="274" width="316" height="110" rx="6" fill="#1A0D00" stroke="#F97316" stroke-width="1.5"/>
  <text x="100" y="302" font-size="12" fill="#F97316" font-weight="700" letter-spacing="1">預設</text>
  <text x="100" y="326" font-size="16" fill="#FFFFFF" font-weight="600">和瀏覽器分頁一樣</text>
  <text x="100" y="348" font-size="13" fill="#FDBA74">沒有新的表面積</text>
  <text x="100" y="368" font-size="12" fill="#78350F">安全的起始點</text>

  <!-- Arrow -->
  <text x="411" y="334" font-size="22" fill="#78350F">→</text>

  <!-- App Permissions tier -->
  <rect x="436" y="274" width="316" height="110" rx="6" fill="#1A0D00" stroke="#F97316" stroke-width="1.5"/>
  <text x="456" y="302" font-size="12" fill="#F97316" font-weight="700" letter-spacing="1">APP 權限</text>
  <text x="456" y="326" font-size="16" fill="#FFFFFF" font-weight="600">通知 · 快捷鍵</text>
  <text x="456" y="348" font-size="13" fill="#FDBA74">永遠在最上層 · 選單欄</text>
  <text x="456" y="368" font-size="12" fill="#78350F">需要明確同意</text>

  <!-- Arrow -->
  <text x="767" y="334" font-size="22" fill="#78350F">→</text>

  <!-- Full Access tier -->
  <rect x="790" y="274" width="314" height="110" rx="6" fill="#1A0D00" stroke="#F97316" stroke-width="1.5"/>
  <text x="810" y="302" font-size="12" fill="#F97316" font-weight="700" letter-spacing="1">完整存取</text>
  <text x="810" y="326" font-size="16" fill="#FFFFFF" font-weight="600">執行程式 · 存取檔案</text>
  <text x="810" y="348" font-size="13" fill="#FDBA74">讀取 · 寫入 · 刪除</text>
  <text x="810" y="368" font-size="12" fill="#78350F">只限自己撰寫的 artifact</text>

  <!-- Trust architecture note -->
  <rect x="80" y="406" width="680" height="62" rx="6" fill="#141414" stroke="#78350F" stroke-width="1.5"/>
  <text x="100" y="432" font-size="14" fill="#F97316" font-weight="600">信任架構：</text>
  <text x="193" y="432" font-size="14" fill="#808080">權限以版本為單位。每次編輯都重設授予。</text>
  <text x="100" y="456" font-size="13" fill="#606060">如果同意涵蓋默默的更新，那不是同意——那是你同意過一次的勾選框。</text>

  <!-- Governance box -->
  <rect x="786" y="406" width="318" height="62" rx="6" fill="#100700" stroke="#78350F" stroke-width="1"/>
  <text x="806" y="428" font-size="12" fill="#92400E" font-weight="600" letter-spacing="1">治理缺口</text>
  <text x="806" y="450" font-size="13" fill="#B45309">分享連結 → 任何人可安裝。</text>
  <text x="806" y="466" font-size="13" fill="#B45309">在團隊規模誰來治理？</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">不是「更快建構 app」。你在對話中描述就建構出的工具，就是你從 Dock 執行的工具。</text>
  <text x="80" y="556" font-size="17" fill="#606060">每版本重新詢問是正確的基礎。在團隊規模的治理層仍然是開放問題。</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#3A2A1A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
