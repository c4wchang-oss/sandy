  <text x="64" y="954" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Token values are accessible. Intent isn't.</text>
  <text x="64" y="976" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Access ` comprehension. The reasoning</text>
  <text x="64" y="998" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">behind it is still yours to document.</text>

