<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A14"/>
      <stop offset="100%" style="stop-color:#0F0F22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4D8FFF"/>
      <stop offset="100%" style="stop-color:#7B5EFF"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid overlay -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="6" height="720" fill="url(#accent)" rx="3"/>

  <!-- Main quote block -->
  <text x="136" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF" letter-spacing="-2">Direct manipulation</text>
  <text x="136" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF" letter-spacing="-2">is a 1982 principle.</text>

  <!-- Divider line -->
  <line x1="136" y1="420" x2="800" y2="420" stroke="#4D8FFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Secondary text -->
  <text x="136" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="38" fill="#A0A8C0" letter-spacing="0">Figma built their entire canvas around it in 2013.</text>
  <text x="136" y="545" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="38" fill="#A0A8C0" letter-spacing="0">AI builders figured it out in 2026.</text>

  <!-- Key insight card -->
  <rect x="136" y="610" width="880" height="180" rx="16" fill="url(#card-bg)" stroke="#4D8FFF" stroke-width="1" stroke-opacity="0.3"/>
  <text x="176" y="668" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#4D8FFF" letter-spacing="2">WHAT VISUAL EDITS ACTUALLY SOLVED</text>
  <text x="176" y="718" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="32" fill="#FFFFFF">Not precision.</text>
  <text x="430" y="718" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="32" fill="#4D8FFF">The revision loop.</text>
  <text x="176" y="762" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#7B8AA8">Click ’ change ’ stack ’ send once. Client watches live.</text>

  <!-- Right side visual  click icon representation -->
  <g transform="translate(1300, 400)">
    <!-- Outer circle -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="#4D8FFF" stroke-width="2" stroke-opacity="0.15"/>
    <circle cx="200" cy="200" r="130" fill="none" stroke="#4D8FFF" stroke-width="1" stroke-opacity="0.1"/>

    <!-- Cursor icon -->
    <g transform="translate(130, 100)" filter="url(#glow)">
      <path d="M20 20 L20 120 L55 90 L75 130 L90 123 L70 83 L110 83 Z" fill="#4D8FFF" opacity="0.9"/>
    </g>

    <!-- Click rings -->
    <circle cx="200" cy="175" r="30" fill="none" stroke="#7B5EFF" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="0 0">
      <animate attributeName="r" values="30;60;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Toolbar mockup -->
    <rect x="60" y="300" width="280" height="50" rx="10" fill="#1A1A2E" stroke="#4D8FFF" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="75" y="315" width="40" height="20" rx="4" fill="#4D8FFF" opacity="0.8"/>
    <rect x="125" y="315" width="40" height="20" rx="4" fill="#2A2A4A"/>
    <rect x="175" y="315" width="40" height="20" rx="4" fill="#2A2A4A"/>
    <rect x="225" y="315" width="40" height="20" rx="4" fill="#2A2A4A"/>
    <rect x="275" y="315" width="40" height="20" rx="4" fill="#2A2A4A"/>
  </g>

  <!-- Bottom metadata -->
  <text x="136" y="980" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#3A4060">Bolt.new Visual Edits  ·  Sep 3, 2026  ·  Senior UX Designer POV</text>

  <!-- Topic tag -->
  <rect x="1680" y="940" width="160" height="40" rx="20" fill="#4D8FFF" fill-opacity="0.15" stroke="#4D8FFF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1760" y="965" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#4D8FFF" text-anchor="middle">#AIdesign</text>
</svg>
