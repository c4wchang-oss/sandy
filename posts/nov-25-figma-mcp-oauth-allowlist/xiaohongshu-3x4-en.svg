<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#3B82F6"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#3B82F6" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="360" height="34" rx="17" fill="#0A1628"/>
  <text x="80" y="82" font-size="13" fill="#3B82F6" font-weight="600" letter-spacing="1">FIGMA MCP ALLOWLIST · NOV 17, 2026</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Who authorized</text>
  <text x="60" y="232" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Cursor to read</text>
  <text x="60" y="296" font-size="52" fill="#93C5FD" font-weight="700" letter-spacing="-1">your design</text>
  <text x="60" y="360" font-size="52" fill="#93C5FD" font-weight="700" letter-spacing="-1">system?</text>

  <!-- Divider -->
  <line x1="60" y1="392" x2="840" y2="392" stroke="#202020" stroke-width="1.5"/>

  <!-- Before / After comparison -->
  <text x="60" y="430" font-size="13" fill="#3B82F6" font-weight="600" letter-spacing="2">WHAT CHANGED — NOV 17</text>

  <!-- Before -->
  <rect x="60" y="450" width="376" height="78" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="80" y="478" font-size="13" fill="#6B7280" font-weight="700">BEFORE</text>
  <text x="80" y="502" font-size="14" fill="#9CA3AF">Anyone with Cursor: individual auth only</text>
  <text x="80" y="518" font-size="12" fill="#4B5563">No admin layer. No scope visibility.</text>

  <!-- After -->
  <rect x="464" y="450" width="376" height="78" rx="6" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="484" y="478" font-size="13" fill="#3B82F6" font-weight="700">AFTER</text>
  <text x="484" y="502" font-size="14" fill="#FFFFFF">Admin-approved only, at scope level</text>
  <text x="484" y="518" font-size="12" fill="#1D4ED8">Org / Enterprise plans</text>

  <!-- Enterprise-managed auth -->
  <rect x="60" y="544" width="780" height="78" rx="6" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="80" y="572" font-size="14" fill="#3B82F6" font-weight="700">DEEPER LAYER: Enterprise-Managed Auth</text>
  <text x="80" y="596" font-size="14" fill="#93C5FD">Okta XAA or Claude auto-connect → no individual sign-in</text>
  <text x="80" y="612" font-size="12" fill="#1D4ED8">SAML SSO required. Admin makes trust decision for everyone.</text>

  <!-- Operational warning -->
  <rect x="60" y="638" width="780" height="80" rx="8" fill="#1A0000" stroke="#991B1B" stroke-width="1.5"/>
  <text x="80" y="664" font-size="14" fill="#EF4444" font-weight="600">⚠  Operational warning</text>
  <text x="80" y="688" font-size="14" fill="#A0A0A0">Flipping the switch breaks ALL existing connections immediately.</text>
  <text x="80" y="706" font-size="13" fill="#606060">Audit → pre-approve → then change policy. Any other order breaks your team.</text>

  <!-- 6 key points section -->
  <text x="60" y="762" font-size="13" fill="#3B82F6" font-weight="600" letter-spacing="2">KEY POINTS</text>

  <text x="60" y="794" font-size="15" fill="#93C5FD" font-weight="600">1. Scope-level approval, not just connection</text>
  <text x="60" y="818" font-size="14" fill="#606060">Read file content, create comments, write to canvas — each approved separately</text>

  <text x="60" y="858" font-size="15" fill="#93C5FD" font-weight="600">2. Org/Enterprise only</text>
  <text x="60" y="882" font-size="14" fill="#606060">Professional/Starter stay at "allow all apps" — governance tool not yet for smaller teams</text>

  <text x="60" y="922" font-size="15" fill="#93C5FD" font-weight="600">3. Same constraint enforcement pattern</text>
  <text x="60" y="946" font-size="14" fill="#606060">Convention → Architecture. A2UI 1.0 (Nov 11) did same for UI generation. Different layer.</text>

  <!-- Bottom reframe -->
  <text x="60" y="1000" font-size="17" fill="#FFFFFF" font-weight="600">The question isn't "can our agents access Figma?"</text>
  <text x="60" y="1026" font-size="17" fill="#FFFFFF" font-weight="600">They can. They will.</text>
  <text x="60" y="1066" font-size="15" fill="#606060">The question is: who decided which agents access</text>
  <text x="60" y="1090" font-size="15" fill="#606060">which parts of your design system?</text>
  <text x="60" y="1130" font-size="15" fill="#3B82F6" font-weight="600">Do you know the answer right now?</text>

  <!-- Attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
