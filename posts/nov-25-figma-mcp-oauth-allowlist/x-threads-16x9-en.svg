<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#3B82F6" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#3B82F6" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#3B82F6" font-weight="600" letter-spacing="2">FIGMA MCP ALLOWLIST · NOV 17, 2026</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Who authorized Cursor to read</text>
  <text x="104" y="224" font-size="44" fill="#93C5FD" font-weight="700" letter-spacing="-1">your design system?</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#222222" stroke-width="1.5"/>

  <!-- Before / After / New layer boxes -->
  <!-- Before -->
  <rect x="80" y="274" width="316" height="110" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="100" y="302" font-size="12" fill="#6B7280" font-weight="700" letter-spacing="1">BEFORE NOV 17</text>
  <text x="100" y="326" font-size="16" fill="#D1D5DB" font-weight="600">Anyone with Cursor</text>
  <text x="100" y="348" font-size="13" fill="#9CA3AF">Individual authorization only</text>
  <text x="100" y="368" font-size="12" fill="#4B5563">No admin layer. No scope visibility.</text>

  <!-- Arrow -->
  <text x="411" y="334" font-size="22" fill="#1D4ED8">→</text>

  <!-- After -->
  <rect x="436" y="274" width="316" height="110" rx="6" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="456" y="302" font-size="12" fill="#3B82F6" font-weight="700" letter-spacing="1">AFTER NOV 17</text>
  <text x="456" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Admin-approved apps only</text>
  <text x="456" y="348" font-size="13" fill="#93C5FD">Scope-level approval required</text>
  <text x="456" y="368" font-size="12" fill="#1D4ED8">Org / Enterprise plans only</text>

  <!-- Plus/arrow to deeper layer -->
  <text x="767" y="334" font-size="22" fill="#1D4ED8">+</text>

  <!-- Enterprise-managed auth -->
  <rect x="790" y="274" width="314" height="110" rx="6" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="810" y="302" font-size="12" fill="#3B82F6" font-weight="700" letter-spacing="1">DEEPER LAYER</text>
  <text x="810" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Enterprise-managed auth</text>
  <text x="810" y="348" font-size="13" fill="#93C5FD">Okta XAA or Claude auto-connect</text>
  <text x="810" y="368" font-size="12" fill="#1D4ED8">SAML SSO required</text>

  <!-- Operational warning -->
  <rect x="80" y="406" width="680" height="62" rx="6" fill="#141414" stroke="#991B1B" stroke-width="1.5"/>
  <text x="100" y="432" font-size="14" fill="#EF4444" font-weight="600">⚠  Operational warning:</text>
  <text x="264" y="432" font-size="14" fill="#808080">flipping the switch breaks existing connections immediately.</text>
  <text x="100" y="456" font-size="13" fill="#606060">The right sequence: audit → pre-approve active connections → then change policy.</text>

  <!-- Constraint frame -->
  <rect x="786" y="406" width="318" height="62" rx="6" fill="#060D1A" stroke="#1E3A5F" stroke-width="1"/>
  <text x="806" y="428" font-size="12" fill="#1D4ED8" font-weight="600" letter-spacing="1">CONSTRAINT HIERARCHY</text>
  <text x="806" y="450" font-size="13" fill="#3B82F6">Convention → Architecture</text>
  <text x="806" y="466" font-size="13" fill="#3B82F6">Same pattern as A2UI 1.0</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">The question isn't "can our agents access Figma?" They can, and they will.</text>
  <text x="80" y="556" font-size="17" fill="#606060">The question is: who decided which agents access which parts of your design system?</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
