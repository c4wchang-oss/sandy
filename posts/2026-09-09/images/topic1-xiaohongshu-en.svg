<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0A04"/>
      <stop offset="100%" style="stop-color:#1A1106"/>
    </linearGradient>
    <linearGradient id="accent-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8840A"/>
      <stop offset="100%" style="stop-color:#F5C842"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1408;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#140E04;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent-h)"/>

  <!-- Platform label -->
  <rect x="60" y="56" width="240" height="46" rx="23" fill="#E8840A" fill-opacity="0.12" stroke="#E8840A" stroke-width="1" stroke-opacity="0.5"/>
  <text x="180" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="19" fill="#E8840A" text-anchor="middle">AI UX INSIGHT</text>

  <!-- Date -->
  <text x="1020" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#3A2A0A" text-anchor="end">2026.09.09</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="-1">ChatGPT&#x2019;s Sketch tool</text>
  <text x="60" y="282" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#E8840A" letter-spacing="-1">fixed a 2-year</text>
  <text x="60" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="-1">design regression.</text>

  <!-- Accent line -->
  <rect x="60" y="382" width="480" height="4" rx="2" fill="url(#accent-h)"/>

  <!-- Subtitle -->
  <text x="60" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#A07030">ChatGPT Images 2.5  Senior UX POV</text>

  <!-- The core insight section -->
  <text x="60" y="514" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#E8840A" letter-spacing="2">THE MISMATCH</text>

  <rect x="60" y="534" width="960" height="96" rx="12" fill="#1E1408" fill-opacity="0.7" stroke="#E8840A" stroke-width="1" stroke-opacity="0.25"/>
  <text x="100" y="576" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#AAAAAA">Text prompting</text>
  <text x="100" y="610" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#7A5020">verbal medium &#x2192; visual problem = precision lost in translation</text>

  <rect x="60" y="642" width="960" height="96" rx="12" fill="#1E1408" fill-opacity="0.8" stroke="#F5C842" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="100" y="684" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#F5C842">@Sketch annotation</text>
  <text x="100" y="718" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#E8C060">spatial mode &#x2192; visual problem = no translation needed</text>

  <!-- What shipped section -->
  <text x="60" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#E8840A" letter-spacing="2">WHAT SHIPPED  SEP 8</text>

  <!-- Feature grid -->
  <rect x="60" y="824" width="456" height="130" rx="12" fill="url(#card)" stroke="#E8840A" stroke-width="1" stroke-opacity="0.25"/>
  <text x="100" y="874" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#E8840A">@Sketch</text>
  <text x="100" y="912" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">draw visual reference</text>
  <text x="100" y="940" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">guide generation</text>

  <rect x="564" y="824" width="456" height="130" rx="12" fill="url(#card)" stroke="#F5C842" stroke-width="1" stroke-opacity="0.25"/>
  <text x="604" y="874" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#F5C842">Annotate</text>
  <text x="604" y="912" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">mark changes on</text>
  <text x="604" y="940" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">image directly</text>

  <rect x="60" y="966" width="456" height="130" rx="12" fill="url(#card)" stroke="#E8840A" stroke-width="1" stroke-opacity="0.25"/>
  <text x="100" y="1016" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="50" fill="#E8840A">50%</text>
  <text x="100" y="1054" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">faster generation</text>
  <text x="100" y="1082" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#5A4010">Images 2.5</text>

  <rect x="564" y="966" width="456" height="130" rx="12" fill="url(#card)" stroke="#F5C842" stroke-width="1" stroke-opacity="0.25"/>
  <text x="604" y="1016" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="36" fill="#F5C842">Likeness</text>
  <text x="604" y="1054" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6030">better preservation</text>
  <text x="604" y="1082" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#5A4010">people + pets</text>

  <!-- Key insight -->
  <rect x="60" y="1124" width="960" height="230" rx="16" fill="#1A0E04" fill-opacity="0.9" stroke="#E8840A" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="100" y="1176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#E8840A" letter-spacing="2">SENIOR UX TAKE</text>
  <text x="100" y="1222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#CCCCCC">Brief quality is still the ceiling.</text>
  <text x="100" y="1264" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#AAAAAA">Format shifted: text &#x2192; sketch.</text>
  <text x="100" y="1306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#F5C842">Most designers sketch better than they describe.</text>
  <text x="100" y="1342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#7A6020">Advantage finally shifts our way.</text>

  <!-- Source -->
  <text x="540" y="1418" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#3A2A0A" text-anchor="middle">openai.com  September 8, 2026</text>
</svg>
