<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle token grid background -->
  <g opacity="0.05" stroke="#10B981" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Accent bar top-left -->
  <rect x="80" y="80" width="6" height="80" fill="#10B981" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#10B981" font-weight="600" letter-spacing="2">TOKENS BY UI COLORS · 2026 年 11 月</text>

  <!-- Main headline -->
  <text x="104" y="172" font-size="46" fill="#FFFFFF" font-weight="700" letter-spacing="-0.5">四種工具從你的部署產品生成 DESIGN.md。</text>
  <text x="104" y="234" font-size="46" fill="#10B981" font-weight="700" letter-spacing="-0.5">這一種從你的設計意圖出發。</text>

  <!-- Divider -->
  <line x1="104" y1="274" x2="760" y2="274" stroke="#222222" stroke-width="1.5"/>

  <!-- Key insight rows -->
  <g font-size="17" fill="#A0A0A0" font-weight="400">
    <text x="104" y="310">Primitive token → 語意角色 → 真實 UI 預覽 → 匯出 DESIGN.md。</text>
    <text x="104" y="342">Brief 品質就是 quality ceiling。確保進去的是你的設計意圖。</text>
  </g>

  <!-- Two-layer token pill -->
  <rect x="104" y="368" width="800" height="40" rx="6" fill="#0A1F14" stroke="#166534" stroke-width="1"/>
  <text x="124" y="394" font-size="14" fill="#10B981" font-weight="600">第一層</text>
  <text x="174" y="394" font-size="14" fill="#505050">原始數值  →</text>
  <text x="274" y="394" font-size="14" fill="#10B981" font-weight="600">第二層</text>
  <text x="318" y="394" font-size="14" fill="#505050">語意角色  →</text>
  <text x="418" y="394" font-size="14" fill="#A0A0A0" font-weight="600">真實 UI 預覽  →</text>
  <text x="560" y="394" font-size="14" fill="#10B981" font-weight="700">DESIGN.md</text>

  <!-- Caveat pill -->
  <rect x="104" y="426" width="720" height="40" rx="6" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="124" y="452" font-size="14" fill="#F59E0B" font-weight="600">⚠  Caveat：</text>
  <text x="216" y="452" font-size="14" fill="#808080">靜態匯出——不跟 Figma 或 code token 保持 live sync。建立工具，不是維護工具。</text>

  <!-- Comparison block -->
  <rect x="104" y="490" width="460" height="72" rx="6" fill="#141414" stroke="#1E1E1E" stroke-width="1"/>
  <text x="124" y="516" font-size="14" fill="#A0A0A0" font-weight="600">掃描式工具</text>
  <text x="124" y="542" font-size="13" fill="#606060">繼承已部署的 production 狀態（含漂移）</text>
  <text x="124" y="560" font-size="13" fill="#F59E0B">⚠ 意外的東西也一起進了 agent context</text>

  <rect x="590" y="490" width="460" height="72" rx="6" fill="#0A1F14" stroke="#166534" stroke-width="1"/>
  <text x="610" y="516" font-size="14" fill="#10B981" font-weight="600">Tokens by UI Colors</text>
  <text x="610" y="542" font-size="13" fill="#606060">從你的意圖建構，在真實 UI 預覽過</text>
  <text x="610" y="560" font-size="13" fill="#10B981">✓ 進去的就是你決定的東西</text>

  <!-- Bottom right attribution -->
  <text x="1120" y="650" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI 工具</text>
</svg>
