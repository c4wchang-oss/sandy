<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle token grid background -->
  <g opacity="0.05" stroke="#10B981" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Accent bar top-left -->
  <rect x="80" y="80" width="6" height="80" fill="#10B981" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#10B981" font-weight="600" letter-spacing="2">TOKENS BY UI COLORS · NOV 2026</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="46" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Four tools generate DESIGN.md</text>
  <text x="104" y="226" font-size="46" fill="#FFFFFF" font-weight="700" letter-spacing="-1">from your deployed product.</text>
  <text x="104" y="290" font-size="46" fill="#10B981" font-weight="700" letter-spacing="-1">This one starts from your intent.</text>

  <!-- Divider -->
  <line x1="104" y1="326" x2="760" y2="326" stroke="#222222" stroke-width="1.5"/>

  <!-- Key insight rows -->
  <g font-size="17" fill="#A0A0A0" font-weight="400">
    <text x="104" y="362">Primitive tokens → semantic roles → real UI preview → DESIGN.md export.</text>
    <text x="104" y="394">Brief quality is the quality ceiling. Make sure it reflects your decisions.</text>
  </g>

  <!-- Two-layer token pill -->
  <rect x="104" y="420" width="680" height="40" rx="6" fill="#0A1F14" stroke="#166534" stroke-width="1"/>
  <text x="124" y="446" font-size="14" fill="#10B981" font-weight="600">TOKEN LAYER 1</text>
  <text x="234" y="446" font-size="14" fill="#505050">primitive values  →</text>
  <text x="354" y="446" font-size="14" fill="#10B981" font-weight="600">TOKEN LAYER 2</text>
  <text x="466" y="446" font-size="14" fill="#505050">semantic roles  →</text>
  <text x="572" y="446" font-size="14" fill="#A0A0A0" font-weight="600">DESIGN.md</text>

  <!-- Caveat pill -->
  <rect x="104" y="478" width="560" height="40" rx="6" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="124" y="504" font-size="14" fill="#F59E0B" font-weight="600">⚠  Caveat:</text>
  <text x="210" y="504" font-size="14" fill="#808080">Static export — no live sync with Figma or code tokens. Creation tool, not maintenance tool.</text>

  <!-- Bottom reframe -->
  <text x="104" y="570" font-size="20" fill="#FFFFFF" font-weight="600">Scan-based tools inherit production drift.</text>
  <text x="104" y="600" font-size="20" fill="#606060" font-weight="400">Tokens by UI Colors inherits your intent instead.</text>

  <!-- Bottom right attribution -->
  <text x="1120" y="650" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
