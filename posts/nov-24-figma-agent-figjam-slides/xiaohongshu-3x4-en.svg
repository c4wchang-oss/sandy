<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#7C3AED"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#7C3AED" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="260" height="34" rx="17" fill="#150C2E"/>
  <text x="80" y="82" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="1">FIGMA AGENT · NOV 23, 2026</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">The pipeline</text>
  <text x="60" y="232" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">is complete.</text>
  <text x="60" y="310" font-size="40" fill="#A78BFA" font-weight="700" letter-spacing="-1">FigJam agent +</text>
  <text x="60" y="362" font-size="40" fill="#A78BFA" font-weight="700" letter-spacing="-1">Slides agent landed.</text>

  <!-- Divider -->
  <line x1="60" y1="394" x2="840" y2="394" stroke="#202020" stroke-width="1.5"/>

  <!-- Pipeline label -->
  <text x="60" y="432" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="2">THE DESIGN PROCESS PIPELINE — NOW FULLY COVERED</text>

  <!-- Pipeline stages -->
  <!-- FigJam -->
  <rect x="60" y="452" width="380" height="78" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="80" y="478" font-size="13" fill="#7C3AED" font-weight="700">NEW  —  FigJam (Research Synthesis)</text>
  <text x="80" y="502" font-size="14" fill="#A78BFA">Transcripts + notes → organized board</text>
  <text x="80" y="518" font-size="12" fill="#6D28D9">Addresses the context assembly bottleneck</text>

  <!-- Dev Mode -->
  <rect x="460" y="452" width="380" height="78" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="480" y="478" font-size="13" fill="#6B7280" font-weight="700">NOV 19  —  Dev Mode (Handoff)</text>
  <text x="480" y="502" font-size="14" fill="#9CA3AF">Inspect, compare versions, code snippets</text>
  <text x="480" y="518" font-size="12" fill="#4B5563">Engineering layer closed</text>

  <!-- Design Canvas -->
  <rect x="60" y="546" width="380" height="78" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="80" y="572" font-size="13" fill="#6B7280" font-weight="700">EXISTING  —  Design Canvas</text>
  <text x="80" y="596" font-size="14" fill="#9CA3AF">Generate + refine + iterate</text>
  <text x="80" y="612" font-size="12" fill="#4B5563">Has been here for a while</text>

  <!-- Slides -->
  <rect x="460" y="546" width="380" height="78" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="480" y="572" font-size="13" fill="#7C3AED" font-weight="700">NEW  —  Slides (Communication)</text>
  <text x="480" y="596" font-size="14" fill="#A78BFA">Adapt deck per audience + shorten copy</text>
  <text x="480" y="612" font-size="12" fill="#6D28D9">Communication design decisions</text>

  <!-- Interesting insight -->
  <rect x="60" y="650" width="780" height="80" rx="6" fill="#0F0A1E" stroke="#4C1D95" stroke-width="1"/>
  <text x="80" y="678" font-size="14" fill="#8B5CF6" font-weight="600">The more interesting story is Slides.</text>
  <text x="80" y="700" font-size="14" fill="#6D56A0">"Adapt for a different audience" is audience modeling — not search-and-replace.</text>
  <text x="80" y="718" font-size="13" fill="#4C1D95">Watch how it restructures emphasis before trusting it at high-stakes presentations.</text>

  <!-- Caveat box -->
  <rect x="60" y="754" width="780" height="90" rx="8" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="80" y="782" font-size="14" fill="#F59E0B" font-weight="600">⚠  Honest caveat</text>
  <text x="80" y="808" font-size="14" fill="#707070">The agent works from what you bring in. Scattered, unstructured</text>
  <text x="80" y="826" font-size="14" fill="#707070">research artifacts → organized scatter. The input is now the brief.</text>

  <!-- 5 things section header -->
  <text x="60" y="882" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="2">WHAT TO KNOW</text>

  <!-- Points -->
  <text x="60" y="910" font-size="15" fill="#A78BFA" font-weight="600">1. All paid plans, no new tier</text>
  <text x="60" y="934" font-size="14" fill="#606060">FigJam and Slides agent available now</text>

  <text x="60" y="966" font-size="15" fill="#A78BFA" font-weight="600">2. Specific connectors only</text>
  <text x="60" y="990" font-size="14" fill="#606060">Design files, transcripts, research notes — not arbitrary files</text>

  <text x="60" y="1022" font-size="15" fill="#A78BFA" font-weight="600">3. FigJam vs Slides: different trust calibration</text>
  <text x="60" y="1046" font-size="14" fill="#606060">FigJam = assembly. Slides = interpretive audience modeling.</text>

  <!-- Bottom reframe -->
  <text x="60" y="1100" font-size="17" fill="#FFFFFF" font-weight="600">Bottleneck moved from context assembly</text>
  <text x="60" y="1126" font-size="17" fill="#FFFFFF" font-weight="600">to intake quality.</text>
  <text x="60" y="1152" font-size="15" fill="#505050">Structure your artifacts first.</text>

  <!-- Attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
