<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#7C3AED"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#7C3AED" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="280" height="34" rx="17" fill="#150C2E"/>
  <text x="80" y="82" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="1">FIGMA AGENT · 2026 年 11 月 23 日</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Pipeline 完整了。</text>
  <text x="60" y="244" font-size="40" fill="#A78BFA" font-weight="700" letter-spacing="-1">FigJam agent +</text>
  <text x="60" y="296" font-size="40" fill="#A78BFA" font-weight="700" letter-spacing="-1">Slides agent 上線。</text>

  <!-- Divider -->
  <line x1="60" y1="328" x2="840" y2="328" stroke="#202020" stroke-width="1.5"/>

  <!-- Pipeline label -->
  <text x="60" y="366" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="1">設計流程 PIPELINE — 現在全面覆蓋</text>

  <!-- Pipeline stages -->
  <!-- FigJam -->
  <rect x="60" y="386" width="380" height="78" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="80" y="412" font-size="13" fill="#7C3AED" font-weight="700">新功能 — FigJam（研究合成）</text>
  <text x="80" y="436" font-size="14" fill="#A78BFA">逐字稿 + 筆記 → 整理好的 board</text>
  <text x="80" y="452" font-size="12" fill="#6D28D9">Context 組裝瓶頸已解決</text>

  <!-- Dev Mode -->
  <rect x="460" y="386" width="380" height="78" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="480" y="412" font-size="13" fill="#6B7280" font-weight="700">11 月 19 日 — Dev Mode（交接）</text>
  <text x="480" y="436" font-size="14" fill="#9CA3AF">檢視 + 版本比較 + 程式碼片段</text>
  <text x="480" y="452" font-size="12" fill="#4B5563">工程層已封閉</text>

  <!-- Design Canvas -->
  <rect x="60" y="480" width="380" height="78" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="80" y="506" font-size="13" fill="#6B7280" font-weight="700">原有功能 — Design Canvas</text>
  <text x="80" y="530" font-size="14" fill="#9CA3AF">生成 + 精修 + 迭代</text>
  <text x="80" y="546" font-size="12" fill="#4B5563">已有一段時間</text>

  <!-- Slides -->
  <rect x="460" y="480" width="380" height="78" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="480" y="506" font-size="13" fill="#7C3AED" font-weight="700">新功能 — Slides（溝通）</text>
  <text x="480" y="530" font-size="14" fill="#A78BFA">為不同受眾調整 deck + 縮短 copy</text>
  <text x="480" y="546" font-size="12" fill="#6D28D9">溝通設計決策層</text>

  <!-- Interesting insight -->
  <rect x="60" y="584" width="780" height="80" rx="6" fill="#0F0A1E" stroke="#4C1D95" stroke-width="1"/>
  <text x="80" y="612" font-size="14" fill="#8B5CF6" font-weight="600">Slides 的故事更有趣。</text>
  <text x="80" y="636" font-size="14" fill="#6D56A0">「為不同受眾調整」是 audience modeling，不是搜尋替換。</text>
  <text x="80" y="652" font-size="13" fill="#4C1D95">在你信任它用在高風險簡報之前，先觀察它怎麼重新結構強調點。</text>

  <!-- Caveat box -->
  <rect x="60" y="688" width="780" height="90" rx="8" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="80" y="716" font-size="14" fill="#F59E0B" font-weight="600">⚠  誠實的前提</text>
  <text x="80" y="742" font-size="14" fill="#707070">Agent 從你帶進來的東西工作。分散、無結構的研究</text>
  <text x="80" y="760" font-size="14" fill="#707070">artifact → 整理過的分散。輸入現在就是 brief。</text>

  <!-- 5 things section header -->
  <text x="60" y="816" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="1">值得知道的事</text>

  <!-- Points -->
  <text x="60" y="844" font-size="15" fill="#A78BFA" font-weight="600">1. 所有付費方案，不需要新層級</text>
  <text x="60" y="868" font-size="14" fill="#606060">FigJam 和 Slides agent 現在都可用</text>

  <text x="60" y="900" font-size="15" fill="#A78BFA" font-weight="600">2. 只支援特定 connector</text>
  <text x="60" y="924" font-size="14" fill="#606060">設計檔案、逐字稿、研究筆記——不是任意檔案</text>

  <text x="60" y="956" font-size="15" fill="#A78BFA" font-weight="600">3. FigJam vs Slides：不同的信任校準</text>
  <text x="60" y="980" font-size="14" fill="#606060">FigJam = 組裝。Slides = 詮釋性 audience modeling。</text>

  <!-- Bottom reframe -->
  <text x="60" y="1056" font-size="18" fill="#FFFFFF" font-weight="600">瓶頸從 context 組裝移到了輸入品質。</text>
  <text x="60" y="1086" font-size="16" fill="#505050">先把研究 artifact 整理好，</text>
  <text x="60" y="1110" font-size="16" fill="#505050">agent 才能幫你思考得更快。</text>

  <!-- Attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
