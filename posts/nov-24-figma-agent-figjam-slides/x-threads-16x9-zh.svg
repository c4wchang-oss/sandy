<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle pipeline grid background -->
  <g opacity="0.04" stroke="#7C3AED" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#7C3AED" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#7C3AED" font-weight="600" letter-spacing="2">FIGMA AGENT · 2026 年 11 月 23 日</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Pipeline 完整了。</text>
  <text x="104" y="224" font-size="44" fill="#A78BFA" font-weight="700" letter-spacing="-1">研究 → Canvas → 交接 → Slides。</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#222222" stroke-width="1.5"/>

  <!-- Pipeline stages — 4 boxes -->
  <!-- FigJam -->
  <rect x="80" y="274" width="230" height="110" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="100" y="302" font-size="12" fill="#7C3AED" font-weight="700" letter-spacing="1">新功能 · FIGJAM</text>
  <text x="100" y="326" font-size="16" fill="#FFFFFF" font-weight="600">研究合成</text>
  <text x="100" y="348" font-size="13" fill="#A78BFA">逐字稿 + 筆記 → board</text>
  <text x="100" y="368" font-size="12" fill="#6D28D9">Context 組裝瓶頸已解決</text>

  <!-- Arrow -->
  <text x="324" y="334" font-size="22" fill="#4B5563">→</text>

  <!-- Design Canvas -->
  <rect x="358" y="274" width="230" height="110" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="378" y="302" font-size="12" fill="#6B7280" font-weight="700" letter-spacing="1">原有功能 · CANVAS</text>
  <text x="378" y="326" font-size="16" fill="#D1D5DB" font-weight="600">設計執行</text>
  <text x="378" y="348" font-size="13" fill="#9CA3AF">生成 + 迭代</text>
  <text x="378" y="368" font-size="12" fill="#4B5563">已有一段時間</text>

  <!-- Arrow -->
  <text x="602" y="334" font-size="22" fill="#4B5563">→</text>

  <!-- Dev Mode -->
  <rect x="636" y="274" width="230" height="110" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="656" y="302" font-size="12" fill="#6B7280" font-weight="700" letter-spacing="1">11 月 19 日 · DEV MODE</text>
  <text x="656" y="326" font-size="16" fill="#D1D5DB" font-weight="600">工程交接</text>
  <text x="656" y="348" font-size="13" fill="#9CA3AF">程式碼片段 + 資產匯出</text>
  <text x="656" y="368" font-size="12" fill="#4B5563">下游端點</text>

  <!-- Arrow -->
  <text x="880" y="334" font-size="22" fill="#4B5563">→</text>

  <!-- Slides -->
  <rect x="914" y="274" width="230" height="110" rx="6" fill="#150C2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="934" y="302" font-size="12" fill="#7C3AED" font-weight="700" letter-spacing="1">新功能 · SLIDES</text>
  <text x="934" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Stakeholder 溝通</text>
  <text x="934" y="348" font-size="13" fill="#A78BFA">為不同受眾調整 deck</text>
  <text x="934" y="368" font-size="12" fill="#6D28D9">溝通設計決策層</text>

  <!-- The honest caveat section -->
  <rect x="80" y="406" width="680" height="62" rx="6" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="100" y="432" font-size="14" fill="#F59E0B" font-weight="600">⚠  前提：</text>
  <text x="176" y="432" font-size="14" fill="#808080">Agent 從你帶進來的東西工作。</text>
  <text x="100" y="456" font-size="14" fill="#606060">分散、無結構的研究 artifact → 整理過的分散。輸入現在就是 brief。</text>

  <!-- Key insight box -->
  <rect x="786" y="406" width="358" height="62" rx="6" fill="#0F0A1E" stroke="#4C1D95" stroke-width="1"/>
  <text x="806" y="432" font-size="13" fill="#6D28D9" font-weight="600" letter-spacing="1">所有付費方案</text>
  <text x="806" y="456" font-size="14" fill="#A78BFA">設計檔、逐字稿、研究筆記</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">瓶頸從 context 組裝移到了輸入品質。</text>
  <text x="80" y="556" font-size="17" fill="#606060">先把研究 artifact 整理好，agent 才能幫你思考得更快。</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
