<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#10B981" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#10B981" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#10B981" font-weight="600" letter-spacing="2">ONLOOK 2.0 · 2026 年 11 月 19 日 · 免費 · 開源</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Canvas 疊在你真實的 codebase 上。</text>
  <text x="104" y="224" font-size="38" fill="#6EE7B7" font-weight="700" letter-spacing="-1">免費。本地優先。BYOA。</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Four boxes -->
  <!-- Git Worktree box -->
  <rect x="80" y="274" width="230" height="110" rx="6" fill="#051A10" stroke="#10B981" stroke-width="1.5"/>
  <text x="100" y="302" font-size="11" fill="#10B981" font-weight="700" letter-spacing="1">GIT WORKTREE</text>
  <text x="100" y="326" font-size="14" fill="#FFFFFF" font-weight="600">安全探索</text>
  <text x="100" y="348" font-size="12" fill="#6EE7B7">獨立分支</text>
  <text x="100" y="368" font-size="11" fill="#064E3B">主 checkout 永遠不被觸碰</text>

  <!-- Visual Pointing box -->
  <rect x="324" y="274" width="230" height="110" rx="6" fill="#051A10" stroke="#10B981" stroke-width="1.5"/>
  <text x="344" y="302" font-size="11" fill="#10B981" font-weight="700" letter-spacing="1">視覺指向</text>
  <text x="344" y="326" font-size="14" fill="#FFFFFF" font-weight="600">點擊 → 參考</text>
  <text x="344" y="348" font-size="12" fill="#6EE7B7">檔案 + 行 + component</text>
  <text x="344" y="368" font-size="11" fill="#064E3B">不是截圖描述</text>

  <!-- BYOA box -->
  <rect x="568" y="274" width="230" height="110" rx="6" fill="#051A10" stroke="#10B981" stroke-width="1.5"/>
  <text x="588" y="302" font-size="11" fill="#10B981" font-weight="700" letter-spacing="1">BYOA</text>
  <text x="588" y="326" font-size="14" fill="#FFFFFF" font-weight="600">你的 agent，你的訂閱</text>
  <text x="588" y="348" font-size="12" fill="#6EE7B7">Claude Code 或 ChatGPT</text>
  <text x="588" y="368" font-size="11" fill="#064E3B">不需要 Onlook 帳號</text>

  <!-- Multi-version box -->
  <rect x="812" y="274" width="302" height="110" rx="6" fill="#051A10" stroke="#10B981" stroke-width="1.5"/>
  <text x="832" y="302" font-size="11" fill="#10B981" font-weight="700" letter-spacing="1">多版本探索</text>
  <text x="832" y="326" font-size="14" fill="#FFFFFF" font-weight="600">10 個 live frame 並排</text>
  <text x="832" y="348" font-size="12" fill="#6EE7B7">每個 = 真實運行產品</text>
  <text x="832" y="368" font-size="11" fill="#064E3B">Preview 模式：live 互動</text>

  <!-- Comparison row -->
  <rect x="80" y="406" width="510" height="62" rx="6" fill="#0A1A0F" stroke="#166534" stroke-width="1"/>
  <text x="100" y="430" font-size="13" fill="#10B981" font-weight="600">對比 Dessn（11 月 22 日）：</text>
  <text x="100" y="454" font-size="12" fill="#505050">相同終態：canvas = production code。Dessn 雲端，Onlook 本地 · 免費 · Apache 2.0</text>

  <!-- Visual pointing note -->
  <rect x="606" y="406" width="508" height="62" rx="6" fill="#051008" stroke="#047857" stroke-width="1"/>
  <text x="626" y="428" font-size="12" fill="#047857" font-weight="600" letter-spacing="1">視覺指向確認 × 4</text>
  <text x="626" y="450" font-size="13" fill="#6EE7B7">MagicPath → Skisso → Ilse → Onlook</text>
  <text x="626" y="466" font-size="12" fill="#505050">Canvas / Live CSS / Dev App / Production Repo</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">不是「AI 設計工具」。是 production codebase 的設計師 canvas 層。</text>
  <text x="80" y="556" font-size="16" fill="#505050">BYOA：canvas 免費。Skills 文件品質設定上限。Brief 智識是你需要建立的。</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#2A3A2A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
