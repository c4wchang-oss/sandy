<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A08"/>
      <stop offset="100%" stop-color="#141208"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="100" width="4" height="255" rx="2" fill="#F59E0B" opacity="0.9"/>

  <!-- Accent line under headline -->
  <rect x="76" y="361" width="520" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="80" width="130" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="141" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FCD34D" text-anchor="middle" letter-spacing="1.2">CANVA MCP GA</text>

  <!-- Main headline -->
  <text x="76" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">The pipe is open.</text>
  <text x="76" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F59E0B" letter-spacing="-1.5">Brand governance</text>
  <text x="76" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">isn't automatic.</text>
  <text x="76" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#9CA3AF" letter-spacing="-0.3">Per-user only. No org-level auth.</text>

  <!-- Divider -->
  <rect x="76" y="380" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points row -->
  <!-- Point 1 -->
  <text x="76" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F59E0B" letter-spacing="0.8">CREATE</text>
  <text x="76" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Generate designs from a brief.</text>
  <text x="76" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">No Canva tab required.</text>

  <!-- Point 2 -->
  <text x="460" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F59E0B" letter-spacing="0.8">EDIT</text>
  <text x="460" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Targeted edits to existing work.</text>
  <text x="460" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Describe it. Canva applies it.</text>

  <!-- Point 3 -->
  <text x="840" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F59E0B" letter-spacing="0.8">EXPORT</text>
  <text x="840" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">PDF, PNG, PPTX, MP4.</text>
  <text x="840" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">From any AI tool workflow.</text>

  <!-- Vertical separators -->
  <line x1="432" y1="408" x2="432" y2="482" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="812" y1="408" x2="812" y2="482" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="95" fill="#0C0C08"/>
  <rect x="0" y="580" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6B7280">Canva MCP · Self-serve GA · Oct 27, 2026 · Per-user OAuth</text>

  <!-- Bottom label right  the governance message -->
  <text x="1124" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F59E0B" text-anchor="end">Design the governance</text>
  <text x="1124" y="635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F59E0B" text-anchor="end">layer first.</text>

  <!-- Small amber dot accent -->
  <circle cx="1148" cy="555" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="1160" cy="555" r="3" fill="#F59E0B" opacity="0.3"/>
  <circle cx="1172" cy="555" r="3" fill="#F59E0B" opacity="0.15"/>
</svg>
