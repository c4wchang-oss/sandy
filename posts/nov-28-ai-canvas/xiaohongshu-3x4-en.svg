<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0A00"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Top accent bar -->
  <rect x="60" y="70" width="6" height="88" fill="#F97316" rx="3"/>

  <!-- Source label -->
  <text x="84" y="94" font-size="11" fill="#F97316" font-weight="600" letter-spacing="2">AI CANVAS · PRODUCT HUNT · NOV 18, 2026</text>

  <!-- Main headline -->
  <text x="84" y="150" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="-1">The screen-ten problem.</text>
  <text x="84" y="192" font-size="22" fill="#FED7AA" font-weight="500">Done-gate = automated floor enforcement</text>
  <text x="84" y="220" font-size="22" fill="#FED7AA" font-weight="500">at the design output layer.</text>

  <!-- Divider -->
  <line x1="60" y1="248" x2="840" y2="248" stroke="#1C1400" stroke-width="1.5"/>

  <!-- The problem section -->
  <rect x="60" y="268" width="780" height="150" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="298" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">THE PROBLEM</text>

  <rect x="84" y="310" width="720" height="28" rx="4" fill="#1A2E0A" stroke="#22C55E" stroke-width="1"/>
  <text x="100" y="329" font-size="13" fill="#86EFAC">Screen 1: "Looks great." ✓ The spacing is right, components consistent</text>

  <rect x="84" y="346" width="720" height="28" rx="4" fill="#2A0A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="100" y="365" font-size="13" fill="#FCA5A5">Screen 10: Different gray. Off spacing. 3 button variants. Spinner invisible. ✗</text>

  <text x="84" y="402" font-size="14" fill="#FB923C">Not a prompt problem. AI improvises without a system to follow.</text>

  <!-- AI Brain section -->
  <rect x="60" y="438" width="780" height="200" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="470" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">ANDROMEDA PRO AI BRAIN</text>
  <text x="84" y="502" font-size="22" fill="#FFFFFF" font-weight="700">93 files. Agent reads before it builds.</text>
  <text x="84" y="534" font-size="15" fill="#FB923C">Component rules · Building skill · Review skill · Done-gate tools</text>
  <text x="84" y="560" font-size="14" fill="#78350F">Token-driven system: change a token → every component follows</text>
  <text x="84" y="582" font-size="14" fill="#78350F">MCP server: free, unlimited, connects to Claude · ChatGPT · Codex · Cursor</text>
  <text x="84" y="604" font-size="14" fill="#78350F">Install as real editable source via shadcn command</text>

  <!-- Done-gate section -->
  <rect x="60" y="658" width="780" height="250" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="690" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">THE DONE-GATE</text>
  <text x="84" y="722" font-size="22" fill="#FFFFFF" font-weight="700">Runs after every screen build.</text>

  <rect x="84" y="738" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="756" font-size="13" fill="#FCA5A5">Raw color instead of a token → FAIL (must fix inside the system)</text>

  <rect x="84" y="770" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="788" font-size="13" fill="#FCA5A5">Off-scale spacing value → FAIL (must fix inside the system)</text>

  <rect x="84" y="802" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="820" font-size="13" fill="#FCA5A5">Unsupported component use → FAIL (must fix inside the system)</text>

  <rect x="84" y="838" width="560" height="30" rx="4" fill="#1A0E00" stroke="#78350F" stroke-width="1"/>
  <text x="100" y="858" font-size="13" fill="#92400E">allow comment = deliberate exception, explicit, local, documented</text>

  <text x="84" y="894" font-size="14" fill="#FB923C">Work doesn't count as done until it passes the gate.</text>

  <!-- Constraint hierarchy -->
  <rect x="60" y="930" width="780" height="140" rx="8" fill="#120C00" stroke="#2A1400" stroke-width="1"/>
  <text x="84" y="962" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">CONSTRAINT ENFORCEMENT HIERARCHY</text>

  <rect x="84" y="978" width="220" height="50" rx="4" fill="#0A0800"/>
  <text x="100" y="998" font-size="12" fill="#374151" font-weight="600">Convention</text>
  <text x="100" y="1016" font-size="11" fill="#374151">DESIGN.md · Library Guidelines</text>
  <text x="100" y="1030" font-size="11" fill="#4B5563">Can be bypassed silently</text>

  <rect x="330" y="978" width="220" height="50" rx="4" fill="#1A0E00" stroke="#F97316" stroke-width="1"/>
  <text x="346" y="998" font-size="12" fill="#FB923C" font-weight="700">Done-gate</text>
  <text x="346" y="1016" font-size="11" fill="#FB923C">AI Canvas</text>
  <text x="346" y="1030" font-size="11" fill="#78350F">Fails drift, requires correction</text>

  <rect x="576" y="978" width="220" height="50" rx="4" fill="#0A0800"/>
  <text x="592" y="998" font-size="12" fill="#374151" font-weight="600">Protocol</text>
  <text x="592" y="1016" font-size="11" fill="#374151">A2UI 1.0</text>
  <text x="592" y="1030" font-size="11" fill="#4B5563">Parse error — impossible</text>

  <!-- Bottom caveat + footer -->
  <text x="84" y="1104" font-size="13" fill="#FB923C" font-weight="600">Done-gate raises the floor. The craft ceiling is still yours.</text>
  <text x="84" y="1126" font-size="12" fill="#374151">React only · Andromeda Pro = their design language · Premium for Pro tier</text>
  <text x="84" y="1160" font-size="12" fill="#374151">aicanvas.me · Product Hunt · Nov 18, 2026</text>
</svg>
