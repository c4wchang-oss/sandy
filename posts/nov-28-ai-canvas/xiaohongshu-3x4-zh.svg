<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0A00"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Top accent bar -->
  <rect x="60" y="70" width="6" height="88" fill="#F97316" rx="3"/>

  <!-- Source label -->
  <text x="84" y="94" font-size="11" fill="#F97316" font-weight="600" letter-spacing="2">AI CANVAS · PRODUCT HUNT · 2026 年 11 月 18 日</text>

  <!-- Main headline -->
  <text x="84" y="150" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="-1">第十個螢幕問題。</text>
  <text x="84" y="192" font-size="21" fill="#FED7AA" font-weight="500">Done-gate = 設計輸出層的</text>
  <text x="84" y="220" font-size="21" fill="#FED7AA" font-weight="500">自動化底線執行。</text>

  <!-- Divider -->
  <line x1="60" y1="248" x2="840" y2="248" stroke="#1C1400" stroke-width="1.5"/>

  <!-- The problem section -->
  <rect x="60" y="268" width="780" height="150" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="298" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">問題所在</text>

  <rect x="84" y="310" width="720" height="28" rx="4" fill="#1A2E0A" stroke="#22C55E" stroke-width="1"/>
  <text x="100" y="329" font-size="13" fill="#86EFAC">第 1 個螢幕：「看起來很棒！」✓ 間距正確，元件一致</text>

  <rect x="84" y="346" width="720" height="28" rx="4" fill="#2A0A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="100" y="365" font-size="13" fill="#FCA5A5">第 10 個螢幕：不同灰色。間距不對。3 種按鈕樣式。Spinner 看不見。✗</text>

  <text x="84" y="402" font-size="14" fill="#FB923C">不是 prompt 問題。沒有系統遵循時，AI 即興發揮。</text>

  <!-- AI Brain section -->
  <rect x="60" y="438" width="780" height="200" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="470" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">ANDROMEDA PRO AI BRAIN</text>
  <text x="84" y="502" font-size="22" fill="#FFFFFF" font-weight="700">93 個文件。Agent 在建構前讀取。</text>
  <text x="84" y="534" font-size="15" fill="#FB923C">元件規則 · 建構技能 · 審查技能 · Done-gate 工具</text>
  <text x="84" y="560" font-size="14" fill="#78350F">Token 驅動系統：改一個 token → 每個元件跟著改</text>
  <text x="84" y="582" font-size="14" fill="#78350F">MCP server：免費，不計量，連接 Claude · ChatGPT · Codex · Cursor</text>
  <text x="84" y="604" font-size="14" fill="#78350F">透過 shadcn 指令安裝為真實可編輯原始碼</text>

  <!-- Done-gate section -->
  <rect x="60" y="658" width="780" height="250" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="84" y="690" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">DONE-GATE</text>
  <text x="84" y="722" font-size="22" fill="#FFFFFF" font-weight="700">每次螢幕建構後執行。</text>

  <rect x="84" y="738" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="756" font-size="13" fill="#FCA5A5">原始顏色值而非 token → 失敗（必須在系統內修正）</text>

  <rect x="84" y="770" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="788" font-size="13" fill="#FCA5A5">不在比例尺上的間距值 → 失敗（必須在系統內修正）</text>

  <rect x="84" y="802" width="720" height="26" rx="4" fill="#2A0A0A"/>
  <text x="100" y="820" font-size="13" fill="#FCA5A5">不支援的元件使用方式 → 失敗（必須在系統內修正）</text>

  <rect x="84" y="838" width="600" height="30" rx="4" fill="#1A0E00" stroke="#78350F" stroke-width="1"/>
  <text x="100" y="858" font-size="13" fill="#92400E">allow 註解 = 刻意例外，明確的、局部的、在程式碼中有記錄的</text>

  <text x="84" y="894" font-size="14" fill="#FB923C">通過 gate 前，工作不算完成。</text>

  <!-- Constraint hierarchy -->
  <rect x="60" y="930" width="780" height="140" rx="8" fill="#120C00" stroke="#2A1400" stroke-width="1"/>
  <text x="84" y="962" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">約束執行層級</text>

  <rect x="84" y="978" width="220" height="50" rx="4" fill="#0A0800"/>
  <text x="100" y="998" font-size="12" fill="#374151" font-weight="600">約定</text>
  <text x="100" y="1016" font-size="11" fill="#374151">DESIGN.md · Library Guidelines</text>
  <text x="100" y="1030" font-size="11" fill="#4B5563">可以悄悄繞過</text>

  <rect x="330" y="978" width="220" height="50" rx="4" fill="#1A0E00" stroke="#F97316" stroke-width="1"/>
  <text x="346" y="998" font-size="12" fill="#FB923C" font-weight="700">Done-gate</text>
  <text x="346" y="1016" font-size="11" fill="#FB923C">AI Canvas</text>
  <text x="346" y="1030" font-size="11" fill="#78350F">失敗漂移，必須修正</text>

  <rect x="576" y="978" width="220" height="50" rx="4" fill="#0A0800"/>
  <text x="592" y="998" font-size="12" fill="#374151" font-weight="600">協議執行</text>
  <text x="592" y="1016" font-size="11" fill="#374151">A2UI 1.0</text>
  <text x="592" y="1030" font-size="11" fill="#4B5563">解析錯誤——架構上不可能</text>

  <!-- Bottom caveat + footer -->
  <text x="84" y="1104" font-size="13" fill="#FB923C" font-weight="600">Done-gate 提高地板。工藝天花板還是你的。</text>
  <text x="84" y="1126" font-size="12" fill="#374151">僅限 React · Andromeda Pro = 他們的設計語言 · 高級方案</text>
  <text x="84" y="1160" font-size="12" fill="#374151">aicanvas.me · Product Hunt · 2026 年 11 月 18 日</text>
</svg>
