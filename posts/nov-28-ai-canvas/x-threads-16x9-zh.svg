<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0A00"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="78" width="6" height="88" fill="#F97316" rx="3"/>

  <!-- Source label -->
  <text x="104" y="102" font-size="12" fill="#F97316" font-weight="600" letter-spacing="2">AI CANVAS · PRODUCT HUNT · 2026 年 11 月 18 日</text>

  <!-- Main headline -->
  <text x="104" y="156" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">第一個螢幕很棒。</text>
  <text x="104" y="208" font-size="44" fill="#FED7AA" font-weight="700" letter-spacing="-1">第十個螢幕漂移了。Done-gate 抓住它。</text>

  <!-- Divider -->
  <line x1="104" y1="234" x2="1116" y2="234" stroke="#1C1400" stroke-width="1.5"/>

  <!-- Left panel: The problem -->
  <rect x="80" y="254" width="340" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="104" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">第十個螢幕問題</text>
  <text x="104" y="316" font-size="17" fill="#FFFFFF" font-weight="600">第 1 個螢幕</text>
  <rect x="104" y="324" width="285" height="20" rx="3" fill="#1A2E0A" stroke="#22C55E" stroke-width="1"/>
  <text x="116" y="338" font-size="11" fill="#86EFAC">看起來很棒 ✓</text>
  <text x="104" y="372" font-size="17" fill="#FFFFFF" font-weight="600">第 10 個螢幕</text>
  <rect x="104" y="380" width="285" height="20" rx="3" fill="#2A0A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="116" y="394" font-size="11" fill="#FCA5A5">不同灰色。間距不對 ✗</text>
  <text x="104" y="438" font-size="13" fill="#FB923C">不是 prompt 問題。</text>
  <text x="104" y="458" font-size="13" fill="#FB923C">是約束執行問題。</text>
  <text x="104" y="486" font-size="12" fill="#78350F">沒有系統執行時，AI 即興發揮。</text>
  <text x="104" y="503" font-size="12" fill="#78350F">修復：一個抓住漂移的 gate。</text>

  <!-- Center panel: AI Brain -->
  <rect x="440" y="254" width="310" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="464" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">ANDROMEDA PRO AI BRAIN</text>
  <text x="464" y="310" font-size="14" fill="#FFFFFF" font-weight="600">Agent 在建構前讀取的 93 個文件</text>
  <text x="464" y="338" font-size="12" fill="#FB923C">元件規則</text>
  <text x="464" y="358" font-size="12" fill="#FB923C">建構技能</text>
  <text x="464" y="378" font-size="12" fill="#FB923C">審查技能</text>
  <text x="464" y="398" font-size="12" fill="#FB923C">Done-gate 驗證工具</text>
  <line x1="464" y1="414" x2="720" y2="414" stroke="#2A1A00" stroke-width="1"/>
  <text x="464" y="438" font-size="12" fill="#78350F">Token 驅動：顏色、間距、字型</text>
  <text x="464" y="458" font-size="12" fill="#78350F">MCP server：免費，不計量</text>
  <text x="464" y="478" font-size="12" fill="#78350F">Claude · ChatGPT · Codex · Cursor</text>
  <text x="464" y="498" font-size="12" fill="#78350F">透過 shadcn 指令安裝可編輯原始碼</text>

  <!-- Right panel: Done-gate -->
  <rect x="770" y="254" width="350" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="794" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">DONE-GATE</text>
  <text x="794" y="310" font-size="14" fill="#FFFFFF" font-weight="600">每次螢幕建構後執行</text>

  <!-- Fail examples -->
  <rect x="794" y="322" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="337" font-size="12" fill="#FCA5A5">原始顏色值而非 token → 失敗</text>
  <rect x="794" y="350" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="365" font-size="12" fill="#FCA5A5">不在比例尺上的間距 → 失敗</text>
  <rect x="794" y="378" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="393" font-size="12" fill="#FCA5A5">不支援的元件使用方式 → 失敗</text>

  <text x="794" y="428" font-size="13" fill="#FB923C" font-weight="600">Agent 在系統內修正。</text>
  <text x="794" y="448" font-size="12" fill="#78350F">通過前工作不算完成。</text>

  <rect x="794" y="466" width="302" height="30" rx="4" fill="#1A0E00" stroke="#78350F" stroke-width="1"/>
  <text x="808" y="486" font-size="12" fill="#92400E">allow 註解 = 刻意例外，在程式碼中有記錄</text>

  <!-- Constraint hierarchy row -->
  <rect x="80" y="534" width="1036" height="52" rx="6" fill="#120C00" stroke="#2A1400" stroke-width="1"/>
  <text x="104" y="556" font-size="12" fill="#78350F" font-weight="700" letter-spacing="1">約束執行層級</text>
  <text x="104" y="576" font-size="12" fill="#374151">約定（DESIGN.md）</text>
  <text x="104" y="576" dx="176" font-size="12" fill="#78350F">→</text>
  <text x="306" y="576" font-size="12" fill="#FB923C" font-weight="600">Done-gate（AI Canvas）</text>
  <text x="306" y="576" dx="192" font-size="12" fill="#78350F">→</text>
  <text x="524" y="576" font-size="12" fill="#374151">協議執行（A2UI 1.0）</text>
  <text x="740" y="576" font-size="12" fill="#374151">· 僅限 React · Andromeda Pro = 他們的 DS · 高級方案</text>

  <!-- Footer label -->
  <text x="104" y="636" font-size="12" fill="#374151">aicanvas.me · Product Hunt · 2026 年 11 月 18 日 · Senior UX Designer 視角</text>
</svg>
