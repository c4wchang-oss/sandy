<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0A00"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="78" width="6" height="88" fill="#F97316" rx="3"/>

  <!-- Source label -->
  <text x="104" y="102" font-size="12" fill="#F97316" font-weight="600" letter-spacing="2">AI CANVAS · PRODUCT HUNT · NOV 18, 2026</text>

  <!-- Main headline -->
  <text x="104" y="156" font-size="46" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Screen one looks great.</text>
  <text x="104" y="208" font-size="46" fill="#FED7AA" font-weight="700" letter-spacing="-1">Screen ten drifts. The done-gate catches it.</text>

  <!-- Divider -->
  <line x1="104" y1="234" x2="1116" y2="234" stroke="#1C1400" stroke-width="1.5"/>

  <!-- Left panel: The problem -->
  <rect x="80" y="254" width="340" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="104" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">THE SCREEN-TEN PROBLEM</text>
  <text x="104" y="316" font-size="17" fill="#FFFFFF" font-weight="600">Screen 1</text>
  <rect x="104" y="324" width="285" height="20" rx="3" fill="#1A2E0A" stroke="#22C55E" stroke-width="1"/>
  <text x="116" y="338" font-size="11" fill="#86EFAC">Looks great ✓</text>
  <text x="104" y="372" font-size="17" fill="#FFFFFF" font-weight="600">Screen 10</text>
  <rect x="104" y="380" width="285" height="20" rx="3" fill="#2A0A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="116" y="394" font-size="11" fill="#FCA5A5">Different gray. Wrong spacing ✗</text>
  <text x="104" y="438" font-size="13" fill="#FB923C">Not a prompt problem.</text>
  <text x="104" y="458" font-size="13" fill="#FB923C">A constraint enforcement problem.</text>
  <text x="104" y="486" font-size="12" fill="#78350F">AI improvises when no system is enforced.</text>
  <text x="104" y="503" font-size="12" fill="#78350F">The fix: a gate that catches drift.</text>

  <!-- Center panel: AI Brain -->
  <rect x="440" y="254" width="310" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="464" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">ANDROMEDA PRO AI BRAIN</text>
  <text x="464" y="310" font-size="14" fill="#FFFFFF" font-weight="600">93 files agent reads before building</text>
  <text x="464" y="338" font-size="12" fill="#FB923C">Component rules</text>
  <text x="464" y="358" font-size="12" fill="#FB923C">Building skill</text>
  <text x="464" y="378" font-size="12" fill="#FB923C">Review skill</text>
  <text x="464" y="398" font-size="12" fill="#FB923C">Done-gate verification tools</text>
  <line x1="464" y1="414" x2="720" y2="414" stroke="#2A1A00" stroke-width="1"/>
  <text x="464" y="438" font-size="12" fill="#78350F">Token-driven: colors, spacing, type</text>
  <text x="464" y="458" font-size="12" fill="#78350F">MCP server: free, no meter</text>
  <text x="464" y="478" font-size="12" fill="#78350F">Claude · ChatGPT · Codex · Cursor</text>
  <text x="464" y="498" font-size="12" fill="#78350F">Editable source via shadcn command</text>

  <!-- Right panel: Done-gate -->
  <rect x="770" y="254" width="350" height="264" rx="8" fill="#120C00" stroke="#F97316" stroke-width="1.5"/>
  <text x="794" y="284" font-size="11" fill="#F97316" font-weight="700" letter-spacing="2">THE DONE-GATE</text>
  <text x="794" y="310" font-size="14" fill="#FFFFFF" font-weight="600">Runs after every screen build</text>

  <!-- Fail examples -->
  <rect x="794" y="322" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="337" font-size="12" fill="#FCA5A5">Raw color instead of token → FAIL</text>
  <rect x="794" y="350" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="365" font-size="12" fill="#FCA5A5">Off-scale spacing value → FAIL</text>
  <rect x="794" y="378" width="302" height="22" rx="3" fill="#2A0A0A"/>
  <text x="808" y="393" font-size="12" fill="#FCA5A5">Unsupported component use → FAIL</text>

  <text x="794" y="428" font-size="13" fill="#FB923C" font-weight="600">Agent fixes inside the system.</text>
  <text x="794" y="448" font-size="12" fill="#78350F">Work doesn't count as done until it passes.</text>

  <rect x="794" y="466" width="302" height="30" rx="4" fill="#1A0E00" stroke="#78350F" stroke-width="1"/>
  <text x="808" y="486" font-size="12" fill="#92400E">allow comment = deliberate exception, documented</text>

  <!-- Constraint hierarchy row -->
  <rect x="80" y="534" width="1036" height="52" rx="6" fill="#120C00" stroke="#2A1400" stroke-width="1"/>
  <text x="104" y="556" font-size="12" fill="#78350F" font-weight="700" letter-spacing="1">CONSTRAINT ENFORCEMENT HIERARCHY</text>
  <text x="104" y="576" font-size="12" fill="#374151">Convention (DESIGN.md)</text>
  <text x="104" y="576" dx="216" font-size="12" fill="#78350F">→</text>
  <text x="348" y="576" font-size="12" fill="#FB923C" font-weight="600">Done-gate (AI Canvas)</text>
  <text x="348" y="576" dx="184" font-size="12" fill="#78350F">→</text>
  <text x="558" y="576" font-size="12" fill="#374151">Protocol enforce (A2UI 1.0)</text>
  <text x="800" y="576" font-size="12" fill="#374151">· React only · Andromeda Pro = their DS · Premium for Pro</text>

  <!-- Footer label -->
  <text x="104" y="636" font-size="12" fill="#374151">aicanvas.me · Product Hunt · Nov 18, 2026 · From a Senior UX Designer's desk</text>
</svg>
