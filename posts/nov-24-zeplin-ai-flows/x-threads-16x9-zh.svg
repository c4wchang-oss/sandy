<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle background -->
  <g opacity="0.04" stroke="#0D9488" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#0D9488" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#0D9488" font-weight="600" letter-spacing="2">ZEPLIN AI FLOWS · 2026 年 11 月 9 日 · BETA</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="47" fill="#FFFFFF" font-weight="700" letter-spacing="-1">AI Flows 的價值不是速度。</text>
  <text x="104" y="228" font-size="47" fill="#2DD4BF" font-weight="700" letter-spacing="-1">是缺口報告。</text>

  <!-- Divider -->
  <line x1="104" y1="260" x2="1100" y2="260" stroke="#222222" stroke-width="1.5"/>

  <!-- Flow diagram — happy path + gap detected -->
  <!-- Screen A -->
  <rect x="80" y="284" width="150" height="88" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="100" y="314" font-size="12" fill="#6B7280" font-weight="600">SCREEN</text>
  <text x="100" y="336" font-size="15" fill="#D1D5DB" font-weight="600">註冊</text>
  <text x="100" y="356" font-size="11" fill="#4B5563">第 1 步</text>

  <!-- Arrow -->
  <line x1="230" y1="328" x2="280" y2="328" stroke="#374151" stroke-width="2"/>
  <polygon points="280,322 290,328 280,334" fill="#374151"/>
  <text x="240" y="320" font-size="10" fill="#4B5563">繼續</text>

  <!-- Screen B -->
  <rect x="290" y="284" width="150" height="88" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="310" y="314" font-size="12" fill="#6B7280" font-weight="600">SCREEN</text>
  <text x="310" y="336" font-size="15" fill="#D1D5DB" font-weight="600">驗證信箱</text>
  <text x="310" y="356" font-size="11" fill="#4B5563">第 2 步</text>

  <!-- Arrow -->
  <line x1="440" y1="328" x2="490" y2="328" stroke="#374151" stroke-width="2"/>
  <polygon points="490,322 500,328 490,334" fill="#374151"/>
  <text x="447" y="320" font-size="10" fill="#4B5563">已驗證</text>

  <!-- Screen C -->
  <rect x="500" y="284" width="150" height="88" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1"/>
  <text x="520" y="314" font-size="12" fill="#6B7280" font-weight="600">SCREEN</text>
  <text x="520" y="336" font-size="15" fill="#D1D5DB" font-weight="600">工作區</text>
  <text x="520" y="356" font-size="11" fill="#4B5563">第 3 步</text>

  <!-- Arrow pointing to missing -->
  <line x1="650" y1="328" x2="700" y2="328" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="700,322 710,328 700,334" fill="#EF4444"/>
  <text x="655" y="320" font-size="10" fill="#EF4444">錯誤？</text>

  <!-- Missing screen — gap detected -->
  <rect x="710" y="284" width="150" height="88" rx="6" fill="#1C0000" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="730" y="314" font-size="12" fill="#EF4444" font-weight="700">⚠  缺失</text>
  <text x="730" y="336" font-size="13" fill="#F87171">錯誤狀態</text>
  <text x="730" y="356" font-size="11" fill="#7F1D1D">還沒設計</text>

  <!-- AI flag label -->
  <rect x="876" y="284" width="288" height="88" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="1"/>
  <text x="896" y="310" font-size="12" fill="#0D9488" font-weight="700" letter-spacing="1">AI 標出的缺口</text>
  <text x="896" y="334" font-size="14" fill="#2DD4BF" font-weight="600">「error path 沒有 screen。」</text>
  <text x="896" y="356" font-size="13" fill="#5EEAD4">「Dead end，沒有退路。」</text>

  <!-- The honest caveat -->
  <rect x="80" y="398" width="680" height="62" rx="6" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="100" y="424" font-size="14" fill="#F59E0B" font-weight="600">⚠  前提：</text>
  <text x="176" y="424" font-size="14" fill="#808080">AI 讀取 screen 名稱，不是像素。</text>
  <text x="100" y="448" font-size="14" fill="#606060">「Screen 32」→ 能連接。「密碼重設——錯誤狀態」→ 能標出缺失。</text>

  <!-- Right info box -->
  <rect x="786" y="398" width="358" height="62" rx="6" fill="#042F2E" stroke="#065F5B" stroke-width="1"/>
  <text x="806" y="424" font-size="13" fill="#0D9488" font-weight="600" letter-spacing="1">所有方案 · BETA · 免費</text>
  <text x="806" y="448" font-size="14" fill="#2DD4BF">放上 screen，描述，1 分鐘以內完成。</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">跑 AI Flows 是為了找出你還沒設計的東西。</text>
  <text x="80" y="556" font-size="17" fill="#606060">缺口報告是價值。速度是附帶效果。</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
