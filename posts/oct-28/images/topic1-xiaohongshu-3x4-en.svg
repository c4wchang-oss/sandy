<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#040d0f"/>
      <stop offset="100%" style="stop-color:#071419"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bg1)"/>

  <!-- Top accent bar -->
  <rect x="60" y="60" width="780" height="3" fill="url(#teal1)" opacity="0.8"/>

  <!-- Category label -->
  <text x="60" y="112" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#06b6d4" letter-spacing="3" opacity="0.85">AI UX · OCT 28, 2026</text>

  <!-- Main headline -->
  <text x="60" y="178" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Wonder.</text>
  <text x="60" y="230" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="400" fill="#06b6d4">What a Senior Designer needs to know.</text>

  <!-- Divider -->
  <rect x="60" y="256" width="780" height="1" fill="#1e293b"/>

  <!-- Section 1: The BYOA Story -->
  <text x="60" y="294" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#0891b2" letter-spacing="1.5" font-weight="600">THE BYOA MODEL</text>

  <rect x="60" y="308" width="780" height="90" rx="4" fill="#071c22" stroke="#0e3344" stroke-width="1"/>
  <text x="84" y="338" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#e2e8f0">Bring your Claude Code or Codex plan.</text>
  <text x="84" y="362" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#e2e8f0">Agents run locally. Zero extra credits.</text>
  <text x="84" y="386" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#64748b">Wonder = canvas. You = agent relationship.</text>

  <!-- Divider -->
  <rect x="60" y="414" width="780" height="1" fill="#1e293b"/>

  <!-- Section 2: Features -->
  <text x="60" y="452" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#0891b2" letter-spacing="1.5" font-weight="600">WHAT SHIPPED OCT 27</text>

  <rect x="60" y="466" width="780" height="54" rx="4" fill="#071c22" stroke="#0e3344" stroke-width="1"/>
  <rect x="60" y="466" width="3" height="54" fill="#06b6d4"/>
  <text x="80" y="488" font-family="'SF Mono', monospace" font-size="10" fill="#22d3ee" font-weight="600" letter-spacing="1">01</text>
  <text x="80" y="507" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Live app preview right on the canvas</text>

  <rect x="60" y="526" width="780" height="54" rx="4" fill="#071c22" stroke="#0e3344" stroke-width="1"/>
  <rect x="60" y="526" width="3" height="54" fill="#22d3ee"/>
  <text x="80" y="548" font-family="'SF Mono', monospace" font-size="10" fill="#22d3ee" font-weight="600" letter-spacing="1">02</text>
  <text x="80" y="567" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Capture screens as editable layers</text>

  <rect x="60" y="586" width="780" height="54" rx="4" fill="#071c22" stroke="#0e3344" stroke-width="1"/>
  <rect x="60" y="586" width="3" height="54" fill="#0891b2"/>
  <text x="80" y="608" font-family="'SF Mono', monospace" font-size="10" fill="#22d3ee" font-weight="600" letter-spacing="1">03</text>
  <text x="80" y="627" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Parallel agents in separate worktrees</text>

  <rect x="60" y="646" width="780" height="54" rx="4" fill="#071c22" stroke="#0e3344" stroke-width="1"/>
  <rect x="60" y="646" width="3" height="54" fill="#0e7490"/>
  <text x="80" y="668" font-family="'SF Mono', monospace" font-size="10" fill="#22d3ee" font-weight="600" letter-spacing="1">04</text>
  <text x="80" y="687" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Auditable agent memory (you can edit it)</text>

  <rect x="60" y="706" width="780" height="54" rx="4" fill="#0a1f28" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="60" y="706" width="3" height="54" fill="#22d3ee"/>
  <text x="80" y="728" font-family="'SF Mono', monospace" font-size="10" fill="#22d3ee" font-weight="600" letter-spacing="1">05</text>
  <text x="80" y="747" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">Second opinion  review before ship</text>

  <!-- Divider -->
  <rect x="60" y="776" width="780" height="1" fill="#1e293b"/>

  <!-- Section 3: Honest limits -->
  <text x="60" y="814" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#f59e0b" letter-spacing="1.5" font-weight="600">WATCH FOR</text>

  <text x="60" y="842" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">   Desktop only  Mac + Windows (no browser yet)</text>
  <text x="60" y="866" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">   Claude Code + Codex only (Cursor coming soon)</text>
  <text x="60" y="890" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">   Team sharing requires Pro ($20/mo)</text>
  <text x="60" y="914" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">   Canvas for existing code  not a no-code tool</text>

  <!-- Senior Designer callout -->
  <rect x="60" y="942" width="780" height="90" rx="6" fill="#071c22" stroke="#0891b2" stroke-width="1.5"/>
  <text x="84" y="970" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#06b6d4" font-weight="600" letter-spacing="1">SENIOR DESIGNER TAKE</text>
  <text x="84" y="994" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#e2e8f0">Wonder separated the canvas from the agent.</text>
  <text x="84" y="1016" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#94a3b8">That separation is the architecture worth having.</text>

  <!-- Bottom tag -->
  <text x="60" y="1160" font-family="'SF Mono', monospace" font-size="11" fill="#1e293b" letter-spacing="2">SENIOR UX DESIGNER PERSPECTIVE · OCT 28, 2026</text>
</svg>
