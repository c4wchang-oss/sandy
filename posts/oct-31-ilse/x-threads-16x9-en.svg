<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080F0C"/>
      <stop offset="100%" stop-color="#0E1512"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="120" width="4" height="220" rx="2" fill="#059669" opacity="0.9"/>

  <!-- Accent line -->
  <rect x="76" y="348" width="520" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="100" width="80" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="116" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle" letter-spacing="1.2">ILSE</text>

  <!-- Main headline -->
  <text x="76" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">The agent edits the</text>
  <text x="76" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">wrong component.</text>
  <text x="76" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="400" fill="#059669" letter-spacing="-0.5">Point at it. Problem solved.</text>

  <!-- Divider -->
  <rect x="76" y="370" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points -->
  <text x="76" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#059669" letter-spacing="0.8">POINT + SAY</text>
  <text x="76" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Click element ’ agent gets</text>
  <text x="76" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">exact file + line + tokens</text>

  <text x="460" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#059669" letter-spacing="0.8">AUTO DESIGN.MD</text>
  <text x="460" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Components + tokens written</text>
  <text x="460" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">automatically. No AI needed.</text>

  <text x="840" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#059669" letter-spacing="0.8">TEST MODE (PRO)</text>
  <text x="840" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">"Buy the lamp" ’ Ilse</text>
  <text x="840" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">walks your app, reports</text>

  <!-- Vertical separators -->
  <line x1="432" y1="398" x2="432" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="812" y1="398" x2="812" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="95" fill="#080E0B"/>
  <rect x="0" y="580" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6B7280">Built by a 9-year designer · React Visual Agent Bridge · Oct 30, 2026</text>

  <!-- Bottom code snippet -->
  <rect x="76" y="638" width="340" height="24" rx="4" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-opacity="0.2" stroke-width="1"/>
  <text x="90" y="654" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#34D399">npx ilse-design@latest</text>

  <!-- Works with -->
  <text x="480" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#4B5563">Works with:</text>
  <text x="480" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">Claude Code · Cursor · Codex · Gemini · any MCP agent</text>

  <!-- Dot accent -->
  <circle cx="1148" cy="555" r="3" fill="#059669" opacity="0.6"/>
  <circle cx="1160" cy="555" r="3" fill="#059669" opacity="0.3"/>
  <circle cx="1172" cy="555" r="3" fill="#059669" opacity="0.15"/>
</svg>
