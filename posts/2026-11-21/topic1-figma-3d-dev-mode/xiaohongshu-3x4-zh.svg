<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#8B5CF6"/>

  <!-- Subtle 3D grid background -->
  <g opacity="0.07" stroke="#8B5CF6" stroke-width="1" fill="none">
    <line x1="0" y1="250" x2="900" y2="420"/>
    <line x1="0" y1="380" x2="900" y2="490"/>
    <line x1="0" y1="510" x2="900" y2="560"/>
    <line x1="0" y1="640" x2="900" y2="630"/>
    <line x1="0" y1="770" x2="900" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="1200"/>
    <line x1="300" y1="0" x2="300" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="750" y1="0" x2="750" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="260" height="34" rx="17" fill="#1E1225"/>
  <text x="80" y="82" font-size="13" fill="#8B5CF6" font-weight="600" letter-spacing="1">FIGMA · 2026 年 11 月</text>

  <!-- Main headline -->
  <text x="60" y="160" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-1">Figma 原生 3D</text>
  <text x="60" y="222" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-1">正式來了</text>

  <!-- Subhead -->
  <text x="60" y="276" font-size="22" fill="#8B5CF6" font-weight="600">Pipeline 壓縮了。來看真正改變的是什麼。</text>

  <!-- Divider -->
  <line x1="60" y1="310" x2="840" y2="310" stroke="#222222" stroke-width="1.5"/>

  <!-- Section: Old Pipeline -->
  <text x="60" y="354" font-size="13" fill="#606060" font-weight="600" letter-spacing="2">以前的 PIPELINE</text>
  <g font-size="16" fill="#606060">
    <text x="60" y="384">Cinema 4D / After Effects → 渲染影片 →</text>
    <text x="60" y="408">貼進 Figma → 手動 annotation → 跟工程師解釋</text>
  </g>

  <!-- Arrow down -->
  <text x="60" y="450" font-size="22" fill="#3A3A3A">↓</text>

  <!-- Section: New Pipeline -->
  <text x="60" y="490" font-size="13" fill="#8B5CF6" font-weight="600" letter-spacing="2">現在的 PIPELINE</text>
  <g font-size="16">
    <text x="60" y="520" fill="#FFFFFF">在 canvas 上做 3D 設計</text>
    <text x="60" y="550" fill="#808080">↓  Figma Motion 加 keyframe 動畫</text>
    <text x="60" y="580" fill="#808080">↓  Dev Mode 複製精確 CSS transform</text>
    <text x="60" y="610" fill="#808080">↓  Coding agent 透過 Figma MCP 讀取</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="642" x2="840" y2="642" stroke="#222222" stroke-width="1.5"/>

  <!-- Nov 19 highlight -->
  <rect x="60" y="662" width="780" height="80" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1"/>
  <text x="84" y="692" font-size="14" fill="#8B5CF6" font-weight="600">新功能 · 11 月 19 日</text>
  <text x="84" y="716" font-size="16" fill="#CCCCCC" font-weight="500">Figma agent 現在也在 Dev Mode 裡了。</text>
  <text x="84" y="736" font-size="14" fill="#808080">Inspect 設計 · 比較版本 · 取得 code snippets · 批次下載 assets</text>

  <!-- Caveat box -->
  <rect x="60" y="766" width="780" height="72" rx="8" fill="#1A1208" stroke="#3A2800" stroke-width="1"/>
  <text x="84" y="794" font-size="13" fill="#F59E0B" font-weight="700">⚠  注意事項</text>
  <text x="84" y="816" font-size="14" fill="#A07020">開啟「Keep nested layers 3D」= parent frame 的</text>
  <text x="84" y="836" font-size="14" fill="#A07020">opacity、blend modes、effects 全部停用。</text>

  <!-- Key frame story -->
  <text x="60" y="884" font-size="13" fill="#606060" font-weight="600" letter-spacing="2">這才是重點</text>
  <text x="60" y="914" font-size="17" fill="#E0E0E0" font-weight="500">Figma 自家 motion designer 需要</text>
  <text x="60" y="938" font-size="17" fill="#E0E0E0" font-weight="500">3D 卡片 layout（grid/helix/ring/scatter）。</text>
  <text x="60" y="962" font-size="17" fill="#E0E0E0" font-weight="500">他請 agent 幫他做了一個 plugin。</text>
  <text x="60" y="986" font-size="17" fill="#E0E0E0" font-weight="500">Agent 做出來了。他用了。</text>

  <!-- Punchline -->
  <text x="60" y="1036" font-size="20" fill="#8B5CF6" font-weight="700">「我描述了我需要的工具。」</text>
  <text x="60" y="1064" font-size="16" fill="#606060">不是「AI 幫我設計」。是完全不同的技能。</text>

  <!-- Footer -->
  <line x1="60" y1="1120" x2="840" y2="1120" stroke="#1A1A1A" stroke-width="1"/>
  <text x="60" y="1150" font-size="13" fill="#3A3A3A">Senior UX · AI 工具觀察 · 2026 年 11 月</text>
  <text x="840" y="1150" font-size="13" fill="#3A3A3A" text-anchor="end">#figma #ux設計 #3d設計</text>
</svg>
