<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#8B5CF6"/>

  <!-- Subtle 3D grid background (perspective lines) -->
  <g opacity="0.07" stroke="#8B5CF6" stroke-width="1" fill="none">
    <line x1="0" y1="250" x2="900" y2="420"/>
    <line x1="0" y1="380" x2="900" y2="490"/>
    <line x1="0" y1="510" x2="900" y2="560"/>
    <line x1="0" y1="640" x2="900" y2="630"/>
    <line x1="0" y1="770" x2="900" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="1200"/>
    <line x1="300" y1="0" x2="300" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="750" y1="0" x2="750" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="200" height="34" rx="17" fill="#1E1225"/>
  <text x="80" y="82" font-size="13" fill="#8B5CF6" font-weight="600" letter-spacing="1">FIGMA · NOV 2026</text>

  <!-- Main headline -->
  <text x="60" y="160" font-size="58" fill="#FFFFFF" font-weight="800" letter-spacing="-1.5">Native 3D</text>
  <text x="60" y="228" font-size="58" fill="#FFFFFF" font-weight="800" letter-spacing="-1.5">in Figma</text>

  <!-- Subhead -->
  <text x="60" y="286" font-size="24" fill="#8B5CF6" font-weight="600">Pipeline compressed. Here's what changed.</text>

  <!-- Divider -->
  <line x1="60" y1="316" x2="840" y2="316" stroke="#222222" stroke-width="1.5"/>

  <!-- Section: Old Pipeline -->
  <text x="60" y="360" font-size="13" fill="#606060" font-weight="600" letter-spacing="2">BEFORE</text>
  <g font-size="16" fill="#606060">
    <text x="60" y="390">Cinema 4D / After Effects → render video →</text>
    <text x="60" y="414">paste in Figma → annotate CSS manually</text>
  </g>

  <!-- Arrow down -->
  <text x="60" y="456" font-size="22" fill="#3A3A3A">↓</text>

  <!-- Section: New Pipeline -->
  <text x="60" y="496" font-size="13" fill="#8B5CF6" font-weight="600" letter-spacing="2">NOW</text>
  <g font-size="16">
    <text x="60" y="526" fill="#FFFFFF">3D on canvas</text>
    <text x="60" y="556" fill="#808080">↓  Figma Motion keyframes</text>
    <text x="60" y="586" fill="#808080">↓  Dev Mode copies CSS transforms</text>
    <text x="60" y="616" fill="#808080">↓  Coding agent reads via Figma MCP</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="648" x2="840" y2="648" stroke="#222222" stroke-width="1.5"/>

  <!-- Nov 19 highlight -->
  <rect x="60" y="668" width="780" height="80" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1"/>
  <text x="84" y="698" font-size="14" fill="#8B5CF6" font-weight="600">NEW · NOV 19</text>
  <text x="84" y="722" font-size="16" fill="#CCCCCC" font-weight="500">Figma agent now lives in Dev Mode.</text>
  <text x="84" y="742" font-size="14" fill="#808080">Inspect designs · compare versions · get code snippets · bulk download assets</text>

  <!-- Caveat box -->
  <rect x="60" y="772" width="780" height="72" rx="8" fill="#1A1208" stroke="#3A2800" stroke-width="1"/>
  <text x="84" y="800" font-size="13" fill="#F59E0B" font-weight="700">⚠  CAVEAT</text>
  <text x="84" y="822" font-size="14" fill="#A07020">"Keep nested layers 3D" disables opacity,</text>
  <text x="84" y="842" font-size="14" fill="#A07020">blend modes, effects on the parent frame.</text>

  <!-- Key frame story -->
  <text x="60" y="890" font-size="13" fill="#606060" font-weight="600" letter-spacing="2">THE REAL STORY</text>
  <text x="60" y="920" font-size="17" fill="#E0E0E0" font-weight="500">Figma's motion designer needed 3D</text>
  <text x="60" y="944" font-size="17" fill="#E0E0E0" font-weight="500">card layouts (grid/helix/ring/scatter).</text>
  <text x="60" y="968" font-size="17" fill="#E0E0E0" font-weight="500">He asked the agent to build a plugin.</text>
  <text x="60" y="992" font-size="17" fill="#E0E0E0" font-weight="500">Got it. Used it.</text>

  <!-- Punchline -->
  <text x="60" y="1040" font-size="20" fill="#8B5CF6" font-weight="700">"I described the tool I needed."</text>
  <text x="60" y="1068" font-size="16" fill="#606060">Not "AI designed for me." Different skill.</text>

  <!-- Footer -->
  <line x1="60" y1="1120" x2="840" y2="1120" stroke="#1A1A1A" stroke-width="1"/>
  <text x="60" y="1150" font-size="13" fill="#3A3A3A">Senior UX · AI Tools · Nov 2026</text>
  <text x="840" y="1150" font-size="13" fill="#3A3A3A" text-anchor="end">#figma #uxdesign #3d</text>
</svg>
