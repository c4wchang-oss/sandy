<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#060D1A"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#3B82F6" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Decorative component boxes top right -->
  <g opacity="0.15">
    <rect x="880" y="80" width="80" height="40" rx="4" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <rect x="972" y="80" width="80" height="40" rx="4" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <rect x="1064" y="80" width="80" height="40" rx="4" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <rect x="880" y="132" width="80" height="40" rx="4" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <rect x="972" y="132" width="80" height="40" rx="4" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <rect x="1064" y="132" width="80" height="40" rx="4" fill="#1A3B6E" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1070" y="158" font-size="11" fill="#3B82F6" opacity="0.6">✓ 已登記</text>

  <!-- Accent bar top-left -->
  <rect x="80" y="80" width="6" height="80" fill="#3B82F6" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#3B82F6" font-weight="600" letter-spacing="2">GOOGLE A2UI 1.0 · 2026 年 11 月 11 日</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">你的 design system</text>
  <text x="104" y="232" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">現在是合約。</text>
  <text x="104" y="296" font-size="50" fill="#3B82F6" font-weight="700" letter-spacing="-1">不是建議文件。</text>

  <!-- Divider line -->
  <line x1="104" y1="336" x2="700" y2="336" stroke="#1A2A3A" stroke-width="1.5"/>

  <!-- Key contrast statement -->
  <g font-size="17">
    <text x="104" y="372" fill="#808080">Convention：「請遵守這些規則」</text>
    <text x="104" y="404" fill="#A0C4FF">Enforcement：agent <tspan font-weight="700" fill="#FFFFFF">在架構上無法</tspan>使用未登記的 component</text>
  </g>

  <!-- Key guarantee bar -->
  <rect x="104" y="430" width="500" height="40" rx="6" fill="#0D1A2E" stroke="#1A3B6E" stroke-width="1"/>
  <text x="124" y="456" font-size="14" fill="#3B82F6" font-weight="600">A2UI 保證：</text>
  <text x="208" y="456" font-size="14" fill="#808080">Native components · 預設 Accessibility · 品牌一致性強制執行</text>

  <!-- Bottom tag line -->
  <text x="104" y="560" font-size="20" fill="#FFFFFF" font-weight="600">Catalog quality = AI output quality ceiling。</text>
  <text x="104" y="590" font-size="20" fill="#606060">A2UI 執行 governance，它不修復 governance。</text>

  <!-- Bottom right attribution -->
  <text x="1120" y="640" font-size="13" fill="#1A2A3A" text-anchor="end">Senior UX · AI 工具觀察</text>
</svg>
