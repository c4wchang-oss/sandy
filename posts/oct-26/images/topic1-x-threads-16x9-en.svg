  <text x="730" y="392" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#64748b">Free during preview · billed to your AI client plan</text>

  <!-- Skills = quality ceiling callout -->
  <rect x="730" y="430" width="400" height="80" rx="6" fill="#120e2a" stroke="#6c63ff" stroke-width="1" opacity="0.9"/>
  <text x="754" y="460" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#a78bfa" letter-spacing="1" font-weight="600">QUALITY CEILING</text>
  <text x="754" y="484" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#e2e8f0">Skills in your Framer project</text>
  <text x="754" y="503" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#64748b">Write them before you open the door.</text>

  <!-- Bottom attribution -->
  <text x="88" y="624" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#374151">Senior UX perspective · framer.com/updates · Free during preview on every plan</text>
</svg>
