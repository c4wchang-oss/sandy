<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a18"/>
      <stop offset="100%" style="stop-color:#0a1428"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg1)"/>

  <!-- Left accent bar  purple for Framer brand -->
  <rect x="64" y="64" width="3" height="547" fill="url(#accent1)" opacity="0.9"/>

  <!-- Category label -->
  <text x="88" y="108" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#a78bfa" letter-spacing="3" opacity="0.85">AI UX · OCT 26, 2026</text>

  <!-- Main headline -->
  <text x="88" y="195" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Web platform MCP:</text>
  <text x="88" y="258" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="54" font-weight="700" fill="#a78bfa" letter-spacing="-1">complete.</text>

  <!-- Divider -->
  <rect x="88" y="285" width="72" height="2" fill="#6c63ff" opacity="0.5"/>

  <!-- Sub-headline -->
  <text x="88" y="337" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#9ca3af">Framer MCP joined Webflow + Elementor.</text>
  <text x="88" y="365" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#9ca3af">Every major web platform. 46 days.</text>

  <!-- Platform timeline (right side) -->
  <!-- Webflow -->
  <rect x="730" y="100" width="400" height="60" rx="6" fill="#0d1625" stroke="#1e293b" stroke-width="1"/>
  <rect x="730" y="100" width="4" height="60" fill="#38bdf8" rx="2"/>
  <text x="752" y="126" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#60a5fa" font-weight="600" letter-spacing="1">SEP 6</text>
  <text x="752" y="147" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#e2e8f0">Webflow  agent-native access</text>

  <!-- Connector line -->
  <line x1="930" y1="160" x2="930" y2="175" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Elementor -->
  <rect x="730" y="175" width="400" height="60" rx="6" fill="#0d1625" stroke="#1e293b" stroke-width="1"/>
  <rect x="730" y="175" width="4" height="60" fill="#34d399" rx="2"/>
  <text x="752" y="201" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#6ee7b7" font-weight="600" letter-spacing="1">SEP 23</text>
  <text x="752" y="222" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#e2e8f0">Elementor  WordPress gets MCP</text>

  <!-- Connector line -->
  <line x1="930" y1="235" x2="930" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Framer (highlighted) -->
  <rect x="730" y="250" width="400" height="70" rx="6" fill="#1a1040" stroke="#6c63ff" stroke-width="1.5"/>
  <rect x="730" y="250" width="4" height="70" fill="#a78bfa" rx="2"/>
  <text x="752" y="278" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#c4b5fd" font-weight="600" letter-spacing="1">OCT 22</text>
  <text x="752" y="300" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#f1f5f9" font-weight="600">Framer MCP  arc complete</text>
  <text x="1085" y="280" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="11" fill="#a78bfa">NEW</text>

  <!-- Key insight block -->
  <rect x="88" y="408" width="600" height="118" rx="6" fill="#0d1625" stroke="#1e293b" stroke-width="1"/>
  <text x="112" y="444" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="600" fill="#6c63ff" letter-spacing="1.5">THE PLAYBOOK (ALL THREE PLATFORMS)</text>
  <text x="112" y="472" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="17" fill="#e2e8f0">Constraint doc ’ Skills ’ MCP</text>
  <text x="112" y="499" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#64748b">Same sequence. Independent decisions. Convergent path.</text>

