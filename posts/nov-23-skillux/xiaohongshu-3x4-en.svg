<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#8B5CF6"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#8B5CF6" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="180" height="34" rx="17" fill="#1A0F2E"/>
  <text x="80" y="82" font-size="13" fill="#8B5CF6" font-weight="600" letter-spacing="1">SKILLUX · NOV 2026</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="54" fill="#FFFFFF" font-weight="700" letter-spacing="-1">AI agents can</text>
  <text x="60" y="232" font-size="54" fill="#FFFFFF" font-weight="700" letter-spacing="-1">now buy UX</text>
  <text x="60" y="296" font-size="54" fill="#FFFFFF" font-weight="700" letter-spacing="-1">judgment.</text>
  <text x="60" y="372" font-size="54" fill="#8B5CF6" font-weight="700" letter-spacing="-1">That's the floor.</text>
  <text x="60" y="440" font-size="54" fill="#8B5CF6" font-weight="700" letter-spacing="-1">You own the ceiling.</text>

  <!-- Divider -->
  <line x1="60" y1="476" x2="840" y2="476" stroke="#202020" stroke-width="1.5"/>

  <!-- Pattern callout -->
  <text x="60" y="520" font-size="14" fill="#8B5CF6" font-weight="600" letter-spacing="1">SKILLS CONVERGENCE ARC · MARKETPLACE MOMENT</text>

  <!-- Ceiling/Floor breakdown -->
  <!-- Ceiling -->
  <rect x="60" y="554" width="780" height="80" rx="6" fill="#1A0F2E" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="80" y="582" font-size="15" fill="#8B5CF6" font-weight="700">CEILING — yours to build</text>
  <text x="80" y="612" font-size="15" fill="#A78BFA">Brand visual language · Component library · Product IA decisions</text>
  <text x="80" y="626" font-size="13" fill="#6D28D9">No marketplace pack gives you this. It requires authorship.</text>

  <!-- Floor -->
  <rect x="60" y="650" width="780" height="80" rx="6" fill="#141414" stroke="#3F3F3F" stroke-width="1.5"/>
  <text x="80" y="678" font-size="15" fill="#606060" font-weight="700">FLOOR — Skillux provides</text>
  <text x="80" y="708" font-size="15" fill="#808080">Hover · Focus · Empty · Error · Loading · Spacing · Type scale</text>
  <text x="80" y="722" font-size="13" fill="#505050">Generic UX best practices. Encoded as SKILL.md.</text>

  <!-- Install command block -->
  <rect x="60" y="754" width="780" height="72" rx="6" fill="#0F0A1E" stroke="#4C1D95" stroke-width="1"/>
  <text x="80" y="782" font-size="14" fill="#6D28D9" font-weight="600">INSTALL</text>
  <text x="80" y="810" font-size="20" fill="#C4B5FD" font-weight="700" font-family="monospace, Courier New">npx skillux add &lt;slug&gt;</text>

  <!-- Caveat box -->
  <rect x="60" y="850" width="780" height="80" rx="8" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="80" y="880" font-size="14" fill="#F59E0B" font-weight="600">⚠  Honest caveat</text>
  <text x="80" y="906" font-size="14" fill="#707070">Marketplace skills are UX best-practice floors. They improve</text>
  <text x="80" y="924" font-size="14" fill="#707070">output quality but don't encode brand-specific constraints.</text>

  <!-- Bottom label -->
  <text x="60" y="1030" font-size="17" fill="#FFFFFF" font-weight="600">Skillux makes the floor cheaper to clear.</text>
  <text x="60" y="1058" font-size="17" fill="#505050" font-weight="400">The gap between that floor and your brand ceiling</text>
  <text x="60" y="1082" font-size="17" fill="#505050" font-weight="400">is exactly the value only a senior designer provides.</text>

  <!-- Bottom right attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
