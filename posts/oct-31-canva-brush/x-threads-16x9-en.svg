<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12101A"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="120" width="4" height="220" rx="2" fill="#7C3AED" opacity="0.9"/>

  <!-- Accent line under headline -->
  <rect x="76" y="348" width="480" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="100" width="120" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="136" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="1.2">CANVA BRUSH</text>

  <!-- Main headline -->
  <text x="76" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">Not image generation.</text>
  <text x="76" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#7C3AED" letter-spacing="-1.5">Design editing.</text>
  <text x="76" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="400" fill="#9CA3AF" letter-spacing="-0.5">This is a different product category.</text>

  <!-- Divider -->
  <rect x="76" y="370" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points row -->
  <!-- Point 1 -->
  <text x="76" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#7C3AED" letter-spacing="0.8">SEES STRUCTURE</text>
  <text x="76" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">VLM trained on real design tasks,</text>
  <text x="76" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">not just pixels</text>

  <!-- Point 2 -->
  <text x="460" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#7C3AED" letter-spacing="0.8">AGENTIC LOOP</text>
  <text x="460" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Edits ’ inspects ’ continues.</text>
  <text x="460" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Self-review in the model</text>

  <!-- Point 3 -->
  <text x="840" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#7C3AED" letter-spacing="0.8">FULLY EDITABLE</text>
  <text x="840" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Every output stays yours</text>
  <text x="840" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">to refine by hand</text>

  <!-- Vertical separators -->
  <line x1="432" y1="398" x2="432" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="812" y1="398" x2="812" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="95" fill="#0D0B15"/>
  <rect x="0" y="580" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6B7280">Canva Research · Vision-Language Model · Oct 2026</text>

  <!-- Bottom label right  stat -->
  <text x="1124" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F5F5F5" text-anchor="end">69%</text>
  <text x="1124" y="633" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280" text-anchor="end">faster editing</text>

  <!-- Separator stat -->
  <line x1="1040" y1="598" x2="1040" y2="648" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <text x="1032" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F5F5F5" text-anchor="end">46%</text>
  <text x="1032" y="633" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280" text-anchor="end">lower cost/edit</text>

  <!-- Small purple dot accent -->
  <circle cx="1148" cy="555" r="3" fill="#7C3AED" opacity="0.6"/>
  <circle cx="1160" cy="555" r="3" fill="#7C3AED" opacity="0.3"/>
  <circle cx="1172" cy="555" r="3" fill="#7C3AED" opacity="0.15"/>
</svg>
