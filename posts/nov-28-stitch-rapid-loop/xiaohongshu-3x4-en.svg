<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0A0A0F"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#6366F1" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Top accent bar -->
  <rect x="60" y="70" width="6" height="88" fill="#6366F1" rx="3"/>

  <!-- Source label -->
  <text x="84" y="94" font-size="11" fill="#6366F1" font-weight="600" letter-spacing="2">GOOGLE STITCH · NOV 2026</text>

  <!-- Main headline -->
  <text x="84" y="150" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="-1">The full lifecycle bet.</text>
  <text x="84" y="196" font-size="22" fill="#A5B4FC" font-weight="500">From 5-second exploration to</text>
  <text x="84" y="224" font-size="22" fill="#A5B4FC" font-weight="500">post-launch continuous improvement.</text>

  <!-- Divider -->
  <line x1="60" y1="252" x2="840" y2="252" stroke="#1E1E2E" stroke-width="1.5"/>

  <!-- SECTION 1: Stitch Rapid -->
  <rect x="60" y="272" width="780" height="340" rx="8" fill="#0D0D1A" stroke="#6366F1" stroke-width="1.5"/>

  <text x="84" y="306" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">STITCH RAPID — FRONT OF PIPELINE · NOV 11</text>

  <text x="84" y="346" font-size="30" fill="#FFFFFF" font-weight="700">5-second prototype.</text>
  <text x="84" y="382" font-size="16" fill="#A5B4FC">Prompt → medium-fidelity multi-screen flow</text>

  <!-- Key insight box -->
  <rect x="84" y="400" width="556" height="36" rx="6" fill="#1E1B4B"/>
  <text x="100" y="424" font-size="14" fill="#A5B4FC" font-weight="600">Gemini Decisions API = discriminative model, not generative</text>

  <text x="84" y="470" font-size="15" fill="#818CF8">→ Picks from 7 design system option spaces</text>
  <text x="84" y="495" font-size="15" fill="#818CF8">→ Speed comes from constraint, not raw generation</text>
  <text x="84" y="520" font-size="15" fill="#818CF8">→ Right-click to edit · Space to voice-edit</text>
  <text x="84" y="545" font-size="15" fill="#818CF8">→ Tap missing link? Generates that screen on the spot</text>

  <rect x="84" y="568" width="720" height="28" rx="4" fill="#0A0A14" stroke="#2D2D5E" stroke-width="1"/>
  <text x="100" y="586" font-size="12" fill="#4B5563">⚠ Sessions not saved · Early MVP · Download before closing tab</text>

  <!-- SECTION 2: Stitch Loop -->
  <rect x="60" y="634" width="780" height="380" rx="8" fill="#0D0D1A" stroke="#6366F1" stroke-width="1.5"/>

  <text x="84" y="668" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">STITCH LOOP — BACK OF PIPELINE · NOV 18 · WAITLIST</text>

  <text x="84" y="708" font-size="30" fill="#FFFFFF" font-weight="700">Post-launch product agent.</text>
  <text x="84" y="744" font-size="16" fill="#A5B4FC">GitHub + live metrics → loops → PRs → you approve</text>

  <!-- 4-step loop circles -->
  <text x="84" y="780" font-size="13" fill="#6366F1" font-weight="700" letter-spacing="1">4-STEP LOOP</text>

  <!-- Step boxes -->
  <rect x="84" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="102" y="818" font-size="12" fill="#6366F1" font-weight="700">1. SUGGEST</text>
  <text x="102" y="838" font-size="11" fill="#818CF8">Evidence-based</text>
  <text x="102" y="852" font-size="11" fill="#818CF8">opportunities</text>

  <rect x="258" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="276" y="818" font-size="12" fill="#6366F1" font-weight="700">2. SOLUTION</text>
  <text x="276" y="838" font-size="11" fill="#818CF8">Tradeoffs +</text>
  <text x="276" y="852" font-size="11" fill="#818CF8">design options</text>

  <rect x="432" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="450" y="818" font-size="12" fill="#6366F1" font-weight="700">3. BUILD</text>
  <text x="450" y="838" font-size="11" fill="#818CF8">Sandbox code →</text>
  <text x="450" y="852" font-size="11" fill="#818CF8">GitHub PR</text>

  <rect x="606" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="624" y="818" font-size="12" fill="#6366F1" font-weight="700">4. REFLECT</text>
  <text x="624" y="838" font-size="11" fill="#818CF8">Monitor metrics</text>
  <text x="624" y="852" font-size="11" fill="#818CF8">watch for regression</text>

  <!-- Default loops -->
  <text x="84" y="890" font-size="14" fill="#A5B4FC">Default loops: Security · Latency · Accessibility (continuous)</text>
  <text x="84" y="914" font-size="14" fill="#818CF8">180+ integrations: Figma, Datadog, Sentry, Linear, Jira, Slack...</text>

  <rect x="84" y="930" width="720" height="30" rx="4" fill="#0A0A14" stroke="#2D2D5E" stroke-width="1"/>
  <text x="100" y="950" font-size="12" fill="#4B5563">Nothing merges without your PR review · brief = your live performance data</text>

  <!-- Bottom reframe -->
  <rect x="60" y="1040" width="780" height="80" rx="8" fill="#12122A" stroke="#2D2D5E" stroke-width="1.5"/>
  <text x="84" y="1072" font-size="17" fill="#FFFFFF" font-weight="600">The brief used to be what the designer wrote.</text>
  <text x="84" y="1098" font-size="17" fill="#A5B4FC">Loop bets the brief is what the product's data says it needs.</text>

  <!-- Bottom label -->
  <text x="84" y="1148" font-size="12" fill="#374151">Stitch Rapid · stitch.google.com · Nov 11, 2026</text>
  <text x="84" y="1168" font-size="12" fill="#374151">Stitch Loop · blog.google · Nov 18, 2026</text>
</svg>
