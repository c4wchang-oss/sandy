<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0A0A0F"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#6366F1" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Top accent bar -->
  <rect x="60" y="70" width="6" height="88" fill="#6366F1" rx="3"/>

  <!-- Source label -->
  <text x="84" y="94" font-size="11" fill="#6366F1" font-weight="600" letter-spacing="2">GOOGLE STITCH · 2026 年 11 月</text>

  <!-- Main headline -->
  <text x="84" y="150" font-size="38" fill="#FFFFFF" font-weight="700" letter-spacing="-1">全生命週期的押注。</text>
  <text x="84" y="196" font-size="21" fill="#A5B4FC" font-weight="500">從 5 秒的探索</text>
  <text x="84" y="224" font-size="21" fill="#A5B4FC" font-weight="500">到發布後的持續改善。</text>

  <!-- Divider -->
  <line x1="60" y1="252" x2="840" y2="252" stroke="#1E1E2E" stroke-width="1.5"/>

  <!-- SECTION 1: Stitch Rapid -->
  <rect x="60" y="272" width="780" height="340" rx="8" fill="#0D0D1A" stroke="#6366F1" stroke-width="1.5"/>

  <text x="84" y="306" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">STITCH RAPID — PIPELINE 前端 · 11 月 11 日</text>

  <text x="84" y="346" font-size="30" fill="#FFFFFF" font-weight="700">5 秒 prototype。</text>
  <text x="84" y="382" font-size="16" fill="#A5B4FC">Prompt → 中等保真度多螢幕流程</text>

  <!-- Key insight box -->
  <rect x="84" y="400" width="680" height="36" rx="6" fill="#1E1B4B"/>
  <text x="100" y="424" font-size="14" fill="#A5B4FC" font-weight="600">Gemini Decisions API = 判別模型，不是生成式模型</text>

  <text x="84" y="470" font-size="15" fill="#818CF8">→ 從 7 個設計系統的選項空間中選擇</text>
  <text x="84" y="495" font-size="15" fill="#818CF8">→ 速度來自約束，不是原始生成能力</text>
  <text x="84" y="520" font-size="15" fill="#818CF8">→ 右鍵編輯 · Space 鍵語音編輯</text>
  <text x="84" y="545" font-size="15" fill="#818CF8">→ 點擊缺失連結？當場生成那個螢幕</text>

  <rect x="84" y="568" width="720" height="28" rx="4" fill="#0A0A14" stroke="#2D2D5E" stroke-width="1"/>
  <text x="100" y="586" font-size="12" fill="#4B5563">⚠ Session 不儲存 · 早期 MVP · 關閉前請下載</text>

  <!-- SECTION 2: Stitch Loop -->
  <rect x="60" y="634" width="780" height="380" rx="8" fill="#0D0D1A" stroke="#6366F1" stroke-width="1.5"/>

  <text x="84" y="668" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">STITCH LOOP — PIPELINE 後端 · 11 月 18 日 · 候補名單</text>

  <text x="84" y="708" font-size="28" fill="#FFFFFF" font-weight="700">後發布 product agent。</text>
  <text x="84" y="744" font-size="15" fill="#A5B4FC">GitHub + live metrics → loop → PR → 你批准</text>

  <!-- 4-step loop -->
  <text x="84" y="780" font-size="13" fill="#6366F1" font-weight="700" letter-spacing="1">四步循環</text>

  <rect x="84" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="102" y="818" font-size="12" fill="#6366F1" font-weight="700">1. 建議</text>
  <text x="102" y="838" font-size="11" fill="#818CF8">有依據的</text>
  <text x="102" y="852" font-size="11" fill="#818CF8">改善機會</text>

  <rect x="258" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="276" y="818" font-size="12" fill="#6366F1" font-weight="700">2. 方案</text>
  <text x="276" y="838" font-size="11" fill="#818CF8">取捨分析 +</text>
  <text x="276" y="852" font-size="11" fill="#818CF8">視覺設計選項</text>

  <rect x="432" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="450" y="818" font-size="12" fill="#6366F1" font-weight="700">3. 建構</text>
  <text x="450" y="838" font-size="11" fill="#818CF8">沙盒寫程式碼</text>
  <text x="450" y="852" font-size="11" fill="#818CF8">→ GitHub PR</text>

  <rect x="606" y="792" width="162" height="60" rx="6" fill="#1E1B4B"/>
  <text x="624" y="818" font-size="12" fill="#6366F1" font-weight="700">4. 反思</text>
  <text x="624" y="838" font-size="11" fill="#818CF8">監控 metrics</text>
  <text x="624" y="852" font-size="11" fill="#818CF8">監控回歸</text>

  <!-- Default loops -->
  <text x="84" y="890" font-size="14" fill="#A5B4FC">預設 loop：安全性 · 延遲 · 無障礙功能（持續運行）</text>
  <text x="84" y="914" font-size="14" fill="#818CF8">180+ 整合：Figma、Datadog、Sentry、Linear、Slack...</text>

  <rect x="84" y="930" width="720" height="30" rx="4" fill="#0A0A14" stroke="#2D2D5E" stroke-width="1"/>
  <text x="100" y="950" font-size="12" fill="#4B5563">沒有任何東西在沒有你審查 PR 的情況下合併</text>

  <!-- Bottom reframe -->
  <rect x="60" y="1040" width="780" height="80" rx="8" fill="#12122A" stroke="#2D2D5E" stroke-width="1.5"/>
  <text x="84" y="1072" font-size="17" fill="#FFFFFF" font-weight="600">Brief 曾經是設計師寫的文件。</text>
  <text x="84" y="1098" font-size="17" fill="#A5B4FC">Loop 押注 brief 是產品數據說它需要什麼。</text>

  <!-- Bottom label -->
  <text x="84" y="1148" font-size="12" fill="#374151">Stitch Rapid · stitch.google.com · 2026 年 11 月 11 日</text>
  <text x="84" y="1168" font-size="12" fill="#374151">Stitch Loop · blog.google · 2026 年 11 月 18 日</text>
</svg>
