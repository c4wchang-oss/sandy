<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07050F"/>
      <stop offset="100%" stop-color="#0C0A18"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pkgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative: npm package boxes (right side) -->
  <rect x="960" y="160" width="88" height="72" rx="6" fill="url(#pkgGrad)" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="1004" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">DS</text>
  <text x="1004" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">package</text>
  <text x="1004" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">v3.2.1</text>

  <rect x="1076" y="210" width="88" height="72" rx="6" fill="url(#pkgGrad)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="1120" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">GitHub</text>
  <text x="1120" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">repo</text>

  <!-- Arrow connecting package to agent -->
  <line x1="1048" y1="250" x2="1076" y2="250" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="1048" cy="250" r="3" fill="#8B5CF6" fill-opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="72" y="110" width="4" height="240" rx="2" fill="#8B5CF6" opacity="0.9"/>

  <!-- Accent line under headline -->
  <rect x="76" y="358" width="480" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="96" width="168" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="160" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C4B5FD" text-anchor="middle" letter-spacing="1.2">FIGMA CODE SOURCES</text>

  <!-- Main headline -->
  <text x="76" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">Your npm package</text>
  <text x="76" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#8B5CF6" letter-spacing="-1.5">IS the brief.</text>
  <text x="76" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="400" fill="#9CA3AF" letter-spacing="-0.5">Real components. Not a description of them.</text>

  <!-- Divider -->
  <rect x="76" y="378" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points row -->
  <!-- Point 1 -->
  <text x="76" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" letter-spacing="0.8">CODE SOURCES</text>
  <text x="76" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Agent uses your actual</text>
  <text x="76" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">DS components. Not a clone.</text>

  <!-- Point 2 -->
  <text x="440" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" letter-spacing="0.8">GUIDELINES + PARTS</text>
  <text x="440" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Rules AND real components.</text>
  <text x="440" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Both. First time in Figma.</text>

  <!-- Point 3 -->
  <text x="820" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" letter-spacing="0.8">QUALITY CEILING</text>
  <text x="820" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">DS code quality =</text>
  <text x="820" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">agent output ceiling. Always.</text>

  <!-- Vertical separators -->
  <line x1="414" y1="404" x2="414" y2="480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="794" y1="404" x2="794" y2="480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="572" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">Figma Code Sources · Config India 2026 · closed beta</text>

  <!-- Bottom label right -->
  <text x="1124" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F5F5F5" text-anchor="end">reference beats</text>
  <text x="1124" y="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280" text-anchor="end">description  always</text>

  <!-- Violet dot accent -->
  <circle cx="1148" cy="548" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="1160" cy="548" r="3" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="1172" cy="548" r="3" fill="#8B5CF6" opacity="0.15"/>
</svg>
