<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07050F"/>
      <stop offset="60%" stop-color="#0C0A18"/>
      <stop offset="100%" stop-color="#07050F"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="772" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="772" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pkgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="3" fill="#8B5CF6"/>

  <!-- Subtle horizontal lines -->
  <line x1="0" y1="300" x2="900" y2="300" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="600" x2="900" y2="600" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="900" x2="900" y2="900" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative npm box top-right -->
  <rect x="772" y="56" width="68" height="56" rx="5" fill="url(#pkgGrad)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="806" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#C4B5FD" text-anchor="middle">DS</text>
  <text x="806" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#A78BFA" text-anchor="middle">npm pkg</text>

  <!-- Header section -->
  <rect x="64" y="58" width="184" height="22" rx="3" fill="#8B5CF6" fill-opacity="0.18"/>
  <text x="156" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C4B5FD" text-anchor="middle" letter-spacing="1.5">FIGMA CODE SOURCES</text>

  <!-- Main title -->
  <text x="64" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#F5F5F5" letter-spacing="-1.5">Your npm package</text>
  <text x="64" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#8B5CF6" letter-spacing="-1.5">IS the brief.</text>

  <!-- Subtitle -->
  <text x="64" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#9CA3AF">Real components. Not a description.</text>
  <text x="64" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#9CA3AF">Reference beats description  always.</text>

  <!-- Divider -->
  <rect x="64" y="302" width="772" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Card 1 -->
  <rect x="64" y="318" width="772" height="96" rx="8" fill="url(#card1)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="64" y="318" width="4" height="96" rx="2" fill="#8B5CF6"/>
  <text x="82" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">01  SILENT DESIGN DEBT  FIXED</text>
  <text x="82" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">AI components that look right but aren't</text>
  <text x="82" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">connected to your DS = debt at generation.</text>

  <!-- Card 2 -->
  <rect x="64" y="428" width="772" height="96" rx="8" fill="url(#card2)" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="64" y="428" width="4" height="96" rx="2" fill="#8B5CF6" fill-opacity="0.7"/>
  <text x="82" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">02  RULES + PARTS (NOT OR)</text>
  <text x="82" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Guidelines = rules. Code Sources = components.</text>
  <text x="82" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Both in Figma. First time.</text>

  <!-- Card 3 -->
  <rect x="64" y="538" width="772" height="96" rx="8" fill="url(#card2)" stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="64" y="538" width="4" height="96" rx="2" fill="#8B5CF6" fill-opacity="0.5"/>
  <text x="82" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">03  DS QUALITY = OUTPUT CEILING</text>
  <text x="82" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Poor naming ’ ambiguous choices.</text>
  <text x="82" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Missing tokens ’ invented defaults.</text>

  <!-- Card 4 -->
  <rect x="64" y="648" width="772" height="96" rx="8" fill="url(#card2)" stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="64" y="648" width="4" height="96" rx="2" fill="#8B5CF6" fill-opacity="0.4"/>
  <text x="82" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">04  THE AUDIT QUESTION</text>
  <text x="82" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">How many published components are</text>
  <text x="82" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">genuinely production-ready?</text>

  <!-- Divider -->
  <rect x="64" y="758" width="772" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Caveat section -->
  <text x="64" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.8">HONEST CAVEAT</text>
  <text x="64" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#9CA3AF">Closed beta only. Clean npm packaging required.</text>
  <text x="64" y="842" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#9CA3AF">Benefit = proportional to your DS rigor.</text>

  <!-- Bottom insight -->
  <rect x="64" y="878" width="772" height="72" rx="8" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1"/>
  <text x="64" y="908" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#C4B5FD" dx="24">You've been describing your DS to the agent.</text>
  <text x="64" y="934" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#A78BFA" dx="24">Now you can give it the actual thing.</text>

  <!-- Bottom bar -->
  <rect x="64" y="988" width="772" height="1" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="64" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">Figma Config India 2026 · figma.com/release-notes</text>

  <!-- Bottom accent dots -->
  <circle cx="800" cy="1020" r="3" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="816" cy="1020" r="3" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="832" cy="1020" r="3" fill="#8B5CF6" opacity="0.12"/>
</svg>
