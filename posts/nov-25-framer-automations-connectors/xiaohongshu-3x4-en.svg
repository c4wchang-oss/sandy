<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#F59E0B"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#F59E0B" stroke-width="1" fill="none">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="0" y1="1000" x2="900" y2="1000"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="310" height="34" rx="17" fill="#1A1200"/>
  <text x="80" y="82" font-size="13" fill="#F59E0B" font-weight="600" letter-spacing="1">FRAMER · NOV 24, 2026</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Agents that</text>
  <text x="60" y="232" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">run your site.</text>
  <text x="60" y="310" font-size="38" fill="#FCD34D" font-weight="700" letter-spacing="-1">Not build it.</text>
  <text x="60" y="360" font-size="38" fill="#FCD34D" font-weight="700" letter-spacing="-1">Run it on a schedule.</text>

  <!-- Divider -->
  <line x1="60" y1="392" x2="840" y2="392" stroke="#202020" stroke-width="1.5"/>

  <!-- Feature label -->
  <text x="60" y="430" font-size="13" fill="#F59E0B" font-weight="600" letter-spacing="2">WHAT SHIPPED — 3 PIECES</text>

  <!-- Automations -->
  <rect x="60" y="450" width="780" height="78" rx="6" fill="#1A1200" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="80" y="478" font-size="14" fill="#F59E0B" font-weight="700">AUTOMATIONS — Scheduled agent workflows</text>
  <text x="80" y="502" font-size="14" fill="#FCD34D">Publish / Form submit / Schedule / A/B test</text>
  <text x="80" y="518" font-size="12" fill="#92400E">SEO audit → Slack on every publish. Daily analytics brief. Lead routing.</text>

  <!-- Connectors -->
  <rect x="60" y="544" width="780" height="78" rx="6" fill="#1A1200" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="80" y="572" font-size="14" fill="#F59E0B" font-weight="700">CONNECTORS — Cross-tool read + write</text>
  <text x="80" y="596" font-size="14" fill="#FCD34D">Slack · Notion · Ahrefs · BigQuery · Google Analytics</text>
  <text x="80" y="612" font-size="12" fill="#92400E">Not just read access — write access. Someone needs to own this settings page.</text>

  <!-- Slack Agent -->
  <rect x="60" y="638" width="780" height="62" rx="6" fill="#141414" stroke="#78350F" stroke-width="1"/>
  <text x="80" y="664" font-size="14" fill="#B45309" font-weight="700">SLACK AGENT — @Framer in a channel or DM</text>
  <text x="80" y="684" font-size="13" fill="#606060">Ask about site, pull analytics, make quick edits without opening Framer</text>

  <!-- Trust architecture note -->
  <rect x="60" y="722" width="780" height="80" rx="8" fill="#0F0A00" stroke="#78350F" stroke-width="1.5"/>
  <text x="80" y="750" font-size="14" fill="#F59E0B" font-weight="600">Trust design worth noting:</text>
  <text x="80" y="774" font-size="14" fill="#A0A0A0">Form submissions → data, not instructions.</text>
  <text x="80" y="794" font-size="13" fill="#606060">Prompt injection protection is explicit in the architecture. Right call.</text>

  <!-- 6 key points section -->
  <text x="60" y="842" font-size="13" fill="#F59E0B" font-weight="600" letter-spacing="2">THE CAVEAT</text>

  <text x="60" y="874" font-size="15" fill="#FCD34D" font-weight="600">Automation frequency amplifies instruction quality</text>
  <text x="60" y="898" font-size="14" fill="#606060">In both directions. Good instructions → consistent quality at scale.</text>
  <text x="60" y="918" font-size="14" fill="#606060">Vague instructions → consistent mediocrity at automated frequency.</text>

  <text x="60" y="958" font-size="15" fill="#FCD34D" font-weight="600">Connectors give write access, not just read</text>
  <text x="60" y="982" font-size="14" fill="#606060">At team level: who owns the Connectors settings page?</text>

  <text x="60" y="1022" font-size="15" fill="#FCD34D" font-weight="600">Workflow-as-institutional-knowledge, again</text>
  <text x="60" y="1046" font-size="14" fill="#606060">Runway App Studio → Figma Weave → Adobe Firefly Graph → now Framer</text>

  <!-- Bottom reframe -->
  <text x="60" y="1100" font-size="17" fill="#FFFFFF" font-weight="600">The question isn't "can we automate?"</text>
  <text x="60" y="1126" font-size="17" fill="#FFFFFF" font-weight="600">It's "are our instructions precise enough?"</text>
  <text x="60" y="1152" font-size="15" fill="#505050">Encode expert workflow. Team runs. Expert architects.</text>

  <!-- Attribution -->
  <text x="840" y="1178" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
