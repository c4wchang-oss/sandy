<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#F59E0B" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#F59E0B" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#F59E0B" font-weight="600" letter-spacing="2">FRAMER AUTOMATIONS · NOV 24, 2026</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="44" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Agents that run your site.</text>
  <text x="104" y="224" font-size="40" fill="#FCD34D" font-weight="700" letter-spacing="-1">Not build it. Run it. On a schedule.</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#222222" stroke-width="1.5"/>

  <!-- Three boxes for the 3 features -->
  <!-- Automations box -->
  <rect x="80" y="274" width="316" height="110" rx="6" fill="#1A1200" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="100" y="302" font-size="12" fill="#F59E0B" font-weight="700" letter-spacing="1">AUTOMATIONS</text>
  <text x="100" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Scheduled agent workflows</text>
  <text x="100" y="348" font-size="13" fill="#FCD34D">Publish / Form / Schedule / A/B</text>
  <text x="100" y="368" font-size="12" fill="#92400E">SEO audit → Slack on every publish</text>

  <!-- Plus -->
  <text x="411" y="334" font-size="22" fill="#78350F">+</text>

  <!-- Connectors box -->
  <rect x="436" y="274" width="316" height="110" rx="6" fill="#1A1200" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="456" y="302" font-size="12" fill="#F59E0B" font-weight="700" letter-spacing="1">CONNECTORS</text>
  <text x="456" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Cross-tool read + write</text>
  <text x="456" y="348" font-size="13" fill="#FCD34D">Slack · Notion · Ahrefs · BigQuery</text>
  <text x="456" y="368" font-size="12" fill="#92400E">Google Analytics · Sheets · more</text>

  <!-- Plus -->
  <text x="767" y="334" font-size="22" fill="#78350F">+</text>

  <!-- Slack Agent box -->
  <rect x="790" y="274" width="314" height="110" rx="6" fill="#1A1200" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="810" y="302" font-size="12" fill="#F59E0B" font-weight="700" letter-spacing="1">SLACK AGENT</text>
  <text x="810" y="326" font-size="16" fill="#FFFFFF" font-weight="600">@Framer from Slack</text>
  <text x="810" y="348" font-size="13" fill="#FCD34D">Ask · analytics · quick edits</text>
  <text x="810" y="368" font-size="12" fill="#92400E">Without opening Framer</text>

  <!-- Trust architecture note -->
  <rect x="80" y="406" width="680" height="62" rx="6" fill="#141414" stroke="#2E2429" stroke-width="1.5"/>
  <text x="100" y="432" font-size="14" fill="#F59E0B" font-weight="600">Trust design:</text>
  <text x="202" y="432" font-size="14" fill="#808080">form submissions → data, not instructions.</text>
  <text x="100" y="456" font-size="13" fill="#606060">Prompt injection protection is baked into the product architecture. It's the right call.</text>

  <!-- Caveat box -->
  <rect x="786" y="406" width="318" height="62" rx="6" fill="#100D00" stroke="#78350F" stroke-width="1"/>
  <text x="806" y="428" font-size="12" fill="#92400E" font-weight="600" letter-spacing="1">AMPLIFICATION CAVEAT</text>
  <text x="806" y="450" font-size="13" fill="#B45309">Automation frequency amplifies</text>
  <text x="806" y="466" font-size="13" fill="#B45309">instruction quality both ways.</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="20" fill="#FFFFFF" font-weight="600">The question is not "can we automate this?" It's "are our instructions precise enough?"</text>
  <text x="80" y="556" font-size="17" fill="#606060">Encode expert workflow. Team runs it. Expert becomes the architect, not the bottleneck.</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
