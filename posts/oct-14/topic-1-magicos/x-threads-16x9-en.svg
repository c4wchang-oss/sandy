  <text x="534" y="536" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8">PRD, refs, rejected dirs  all live on one spatial canvas</text>

  <circle cx="516" cy="572" r="5" fill="#06B6D4"/>
  <text x="534" y="578" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8">Coordinator routes real work into parallel agent threads</text>

  <circle cx="516" cy="614" r="5" fill="#0EA5E9"/>
  <text x="534" y="620" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8">Import from Figma, Claude Design, GitHub  MCP built in</text>

  <circle cx="516" cy="656" r="5" fill="#0EA5E9"/>
  <text x="534" y="662" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8">Voice collaboration: brainstorm out loud, canvas responds</text>

