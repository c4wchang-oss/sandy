  <rect x="500" y="706" width="1020" height="90" rx="12" fill="#0D1E2C" stroke="#1A3048" stroke-width="1.5"/>
  <text x="530" y="742" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#06B6D4" font-weight="600">Canvas-as-context confirmed (4th instance in 6 weeks):</text>
  <text x="530" y="766" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4A8AA8">Doop (Sep 4) ’ MagicPath (Oct 1) ’ Shopify Canvas (Oct 1) ’ MagicOS (Oct 13)</text>
  <text x="530" y="786" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2A5A70">The canvas is the shared context layer, not just the delivery surface.</text>

