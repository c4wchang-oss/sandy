  <text x="1500" y="840" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2A4A5A" text-anchor="end" letter-spacing="1">magicpatterns.com</text>
  <text x="508" y="858" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2A4A5A">Senior UX Designer · AI Tools Watch</text>
