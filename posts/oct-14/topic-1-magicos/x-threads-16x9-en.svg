  <text x="500" y="332" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#accent1)" text-anchor="start">MagicOS saves</text>
  <text x="500" y="408" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#accent1)" text-anchor="start">the process.</text>

