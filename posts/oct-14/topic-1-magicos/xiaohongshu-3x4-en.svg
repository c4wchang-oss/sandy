  <text x="132" y="1074" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8" font-weight="500">Voice collaboration</text>
  <text x="132" y="1094" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#4A7A90">Brainstorm out loud  canvas navigates and responds</text>

