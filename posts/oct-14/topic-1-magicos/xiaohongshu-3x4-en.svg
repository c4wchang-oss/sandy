  <circle cx="114" cy="1004" r="5" fill="#06B6D4"/>
  <text x="132" y="1010" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C0D8E8" font-weight="500">Coordinator + Threads</text>
