  <text x="114" y="1202" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3A6080" font-weight="600">Honest caveat:</text>
  <text x="114" y="1222" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2A5070">Parallel threads are great for divergence. Convergence is still</text>
  <text x="114" y="1242" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2A5070">your judgment call. The coordinator doesn't solve that.</text>

