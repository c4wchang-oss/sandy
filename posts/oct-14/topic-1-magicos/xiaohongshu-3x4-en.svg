  <text x="540" y="1274" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#06B6D4" text-anchor="middle" font-weight="600">Canvas-as-context pattern (4 tools, 6 weeks):</text>
