<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050E18"/>
      <stop offset="100%" style="stop-color:#0B1824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C2A8"/>
      <stop offset="100%" style="stop-color:#0070F3"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1F2D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#091520;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="6" height="760" fill="url(#accent)" rx="3"/>

  <!-- Main headline -->
  <text x="136" y="268" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-2">The boundary between</text>
  <text x="136" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#00C2A8" letter-spacing="-2">deterministic</text>
  <text x="636" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-2"> and </text>
  <text x="136" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#0070F3" letter-spacing="-2">agentic</text>
  <text x="406" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-2"> is your design work.</text>

  <!-- Divider -->
  <line x1="136" y1="510" x2="900" y2="510" stroke="#00C2A8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Subtext -->
  <text x="136" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="36" fill="#7A98B0" letter-spacing="0">Amazon Connect Agentic CX Designer went GA.</text>
  <text x="136" y="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="36" fill="#7A98B0" letter-spacing="0">It's a canvas that makes guardrails the design artifact  not afterthoughts.</text>

  <!-- Key insight card -->
  <rect x="136" y="695" width="820" height="185" rx="16" fill="url(#card-bg)" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.35"/>
  <text x="178" y="750" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="22" fill="#00C2A8" letter-spacing="3">SENIOR UX ROLE SHIFT</text>
  <text x="178" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="30" fill="#FFFFFF">Old: script writer</text>
  <text x="178" y="845" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#00C2A8">New: guardrail architect</text>

  <!-- Right side  canvas visualization -->
  <g transform="translate(1250, 200)">
    <!-- Canvas frame -->
    <rect x="0" y="0" width="560" height="700" rx="16" fill="#0D1F2D" stroke="#1A3A52" stroke-width="2"/>

    <!-- Canvas header -->
    <rect x="0" y="0" width="560" height="52" rx="16" fill="#0F2436"/>
    <rect x="0" y="36" width="560" height="16" fill="#0F2436"/>
    <circle cx="32" cy="26" r="8" fill="#FF5F57" opacity="0.8"/>
    <circle cx="58" cy="26" r="8" fill="#FEBC2E" opacity="0.8"/>
    <circle cx="84" cy="26" r="8" fill="#28C840" opacity="0.8"/>
    <text x="280" y="32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#4A7A9E" text-anchor="middle">Agentic CX Designer</text>

    <!-- START node -->
    <rect x="200" y="80" width="160" height="52" rx="26" fill="#1A4A3A" stroke="#00C2A8" stroke-width="2"/>
    <text x="280" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#00C2A8" text-anchor="middle">START</text>

    <!-- Arrow down -->
    <line x1="280" y1="132" x2="280" y2="174" stroke="#3A6080" stroke-width="2"/>
    <polygon points="272,170 280,186 288,170" fill="#3A6080"/>

    <!-- Deterministic node -->
    <rect x="100" y="186" width="360" height="68" rx="12" fill="#0F2D44" stroke="#0070F3" stroke-width="2"/>
    <text x="280" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#0070F3" text-anchor="middle">DETERMINISTIC</text>
    <text x="280" y="242" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#5A8AAE" text-anchor="middle">Eligibility check  exact logic you define</text>

    <!-- Arrow down -->
    <line x1="280" y1="254" x2="280" y2="296" stroke="#3A6080" stroke-width="2"/>
    <polygon points="272,292 280,308 288,292" fill="#3A6080"/>

    <!-- Generative node -->
    <rect x="100" y="308" width="360" height="68" rx="12" fill="#1A2A1A" stroke="#00C2A8" stroke-width="2"/>
    <text x="280" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#00C2A8" text-anchor="middle">GENERATIVE JOURNEY</text>
    <text x="280" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#4A8A6A" text-anchor="middle">LLM handles natural conversation</text>

    <!-- Arrow down -->
    <line x1="280" y1="376" x2="280" y2="418" stroke="#3A6080" stroke-width="2"/>
    <polygon points="272,414 280,430 288,414" fill="#3A6080"/>

    <!-- Guardrail node -->
    <rect x="100" y="430" width="360" height="68" rx="12" fill="#2A1A0F" stroke="#F0A830" stroke-width="2"/>
    <text x="280" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#F0A830" text-anchor="middle">GUARDRAILS</text>
    <text x="280" y="486" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#A87030" text-anchor="middle">Compliance + brand + policy</text>

    <!-- Arrow down -->
    <line x1="280" y1="498" x2="280" y2="540" stroke="#3A6080" stroke-width="2"/>
    <polygon points="272,536 280,552 288,536" fill="#3A6080"/>

    <!-- Deploy node -->
    <rect x="160" y="552" width="240" height="52" rx="26" fill="#1A3A1A" stroke="#28C840" stroke-width="2"/>
    <text x="280" y="584" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#28C840" text-anchor="middle">DEPLOY</text>

    <!-- The line label -->
    <line x1="60" y1="320" x2="100" y2="320" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="20" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#FF6B35" text-anchor="middle">‘</text>
    <text x="20" y="332" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#FF6B35" text-anchor="middle">THE</text>
    <text x="20" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#FF6B35" text-anchor="middle">LINE</text>
    <text x="20" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#FF6B35" text-anchor="middle">“</text>
  </g>

  <!-- Bottom metadata -->
  <text x="136" y="980" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#2A4A60">Amazon Connect Agentic CX Designer GA  ·  Sep 2, 2026  ·  Senior UX Designer POV</text>

  <!-- Tag -->
  <rect x="1680" y="940" width="180" height="40" rx="20" fill="#00C2A8" fill-opacity="0.12" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1770" y="965" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#00C2A8" text-anchor="middle">#AIdesign</text>
</svg>
