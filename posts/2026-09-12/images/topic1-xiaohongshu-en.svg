<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080C1A"/>
      <stop offset="100%" style="stop-color:#0A0E20"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38B6FF"/>
      <stop offset="100%" style="stop-color:#0070F3"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1228;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#090E1E;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="80" y="80" width="920" height="5" fill="url(#acc)" rx="2"/>

  <!-- Platform label -->
  <text x="540" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="22" fill="#3A4A6A" text-anchor="middle" letter-spacing="4">SENIOR UX &#x2014; AI WORKFLOW</text>

  <!-- Main headline -->
  <text x="80" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="-1">Your AI workflow</text>
  <text x="80" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#38B6FF" letter-spacing="-1">instructions are</text>
  <text x="80" y="376" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="-1">outdated.</text>

  <!-- Tool name + date -->
  <text x="80" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#3A4A6A">GPT-6 Astra &#x2014; OpenAI, Sep 11, 2026</text>

  <!-- Divider -->
  <line x1="80" y1="462" x2="1000" y2="462" stroke="#38B6FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Failure modes -->
  <text x="80" y="516" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#38B6FF" letter-spacing="2">THREE FAILURE MODES</text>

  <rect x="80" y="540" width="920" height="108" rx="14" fill="url(#card)" stroke="#38B6FF" stroke-width="1" stroke-opacity="0.35"/>
  <text x="120" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#38B6FF">01  SKILL BLOAT</text>
  <text x="120" y="627" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#CCCCCC">Too many &#x2192; descriptions truncated &#x2192; wrong skill loads</text>

  <rect x="80" y="666" width="920" height="108" rx="14" fill="url(#card)" stroke="#1A90FF" stroke-width="1" stroke-opacity="0.35"/>
  <text x="120" y="711" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#1A90FF">02  BLANKET AGENTS.MD</text>
  <text x="120" y="753" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#CCCCCC">Read 3 docs before every edit = context waste</text>

  <rect x="80" y="792" width="920" height="108" rx="14" fill="url(#card)" stroke="#0070F3" stroke-width="1" stroke-opacity="0.35"/>
  <text x="120" y="837" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#0070F3">03  EXPIRED GUARDRAILS</text>
  <text x="120" y="879" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#CCCCCC">Gates for weak models now block Astra&#x2019;s judgment</text>

  <!-- Divider -->
  <line x1="80" y1="920" x2="1000" y2="920" stroke="#38B6FF" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Design implication -->
  <text x="80" y="972" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#38B6FF" letter-spacing="2">FOR UX DESIGNERS</text>
  <text x="80" y="1018" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#CCCCCC">DESIGN.md = skill file = constraint architecture.</text>
  <text x="80" y="1058" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#CCCCCC">Lean + semantic beats comprehensive + defensive.</text>

  <!-- Caveat box -->
  <rect x="80" y="1090" width="920" height="86" rx="14" fill="#070B1A" stroke="#3A4A6A" stroke-width="1" stroke-opacity="0.5"/>
  <text x="120" y="1126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#3A4A6A">HONEST CAVEAT</text>
  <text x="120" y="1162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#3A4A6A">Astra still benefits from: define &#x201C;done&#x201D; before starting</text>

  <!-- Bottom reframe -->
  <rect x="80" y="1206" width="920" height="158" rx="14" fill="#0A1030" stroke="#38B6FF" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="540" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#38B6FF" text-anchor="middle">Not rules to protect the model.</text>
  <text x="540" y="1302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#CCCCCC" text-anchor="middle">Briefs that define what done looks like.</text>
  <text x="540" y="1340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">Architecture is yours. Judgment is the model&#x2019;s.</text>

  <!-- Bottom bar -->
  <rect x="80" y="1400" width="920" height="4" fill="url(#acc)" rx="2"/>
</svg>
