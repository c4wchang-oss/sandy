<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle node graph lines in background -->
  <g opacity="0.07" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>
  <!-- Node dots at intersections -->
  <g fill="#F97316" opacity="0.15">
    <circle cx="300" cy="180" r="5"/>
    <circle cx="600" cy="180" r="5"/>
    <circle cx="900" cy="180" r="5"/>
    <circle cx="300" cy="360" r="5"/>
    <circle cx="600" cy="360" r="5"/>
    <circle cx="900" cy="360" r="5"/>
  </g>

  <!-- Accent bar top-left -->
  <rect x="80" y="80" width="6" height="80" fill="#F97316" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#F97316" font-weight="600" letter-spacing="2">ADOBE FIREFLY · 2026 年 11 月 10 日</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Runway 10/27。</text>
  <text x="104" y="230" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Figma 10/30。</text>
  <text x="104" y="300" font-size="50" fill="#F97316" font-weight="700" letter-spacing="-1">Adobe 11/10。15 天。</text>

  <!-- Divider -->
  <line x1="104" y1="336" x2="740" y2="336" stroke="#222222" stroke-width="1.5"/>

  <!-- Key insight rows -->
  <g font-size="17" fill="#A0A0A0" font-weight="400">
    <text x="104" y="372">三個平台收斂到 node-based workflow canvas。同一個賭注：把專家流程編碼成 team 能執行的系統。</text>
    <text x="104" y="404">Graph：公開 beta（模型比較、subgraph）。Builder：私有 beta waitlist。</text>
  </g>

  <!-- Caveat pill -->
  <rect x="104" y="430" width="600" height="40" rx="6" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="124" y="456" font-size="14" fill="#F59E0B" font-weight="600">⚠  注意：</text>
  <text x="196" y="456" font-size="14" fill="#808080">Graph = 公開 beta，不是 GA。Builder = 私有 beta waitlist。最有趣 = 最難取得。</text>

  <!-- Bottom tag line -->
  <text x="104" y="560" font-size="20" fill="#FFFFFF" font-weight="600">Workflow canvas 是新的創意製作介面。</text>
  <text x="104" y="590" font-size="20" fill="#606060" font-weight="400">把流程編碼，部署它，停止成為瓶頸。</text>

  <!-- Bottom right attribution -->
  <text x="1120" y="640" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI 工具觀察</text>
</svg>
