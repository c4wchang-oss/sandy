<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <!-- Background -->
  <rect width="900" height="1200" fill="#0D0D0D"/>

  <!-- Top accent band -->
  <rect width="900" height="6" fill="#F97316"/>

  <!-- Subtle node graph background -->
  <g opacity="0.05" stroke="#F97316" stroke-width="1" fill="none">
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="0" y1="720" x2="900" y2="720"/>
    <line x1="0" y1="960" x2="900" y2="960"/>
    <line x1="225" y1="0" x2="225" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="675" y1="0" x2="675" y2="1200"/>
  </g>
  <!-- Node dots -->
  <g fill="#F97316" opacity="0.12">
    <circle cx="225" cy="240" r="4"/>
    <circle cx="450" cy="240" r="4"/>
    <circle cx="675" cy="240" r="4"/>
    <circle cx="225" cy="480" r="4"/>
    <circle cx="450" cy="480" r="4"/>
    <circle cx="675" cy="480" r="4"/>
  </g>

  <!-- Tool badge -->
  <rect x="60" y="60" width="270" height="34" rx="17" fill="#1E0D00"/>
  <text x="80" y="82" font-size="13" fill="#F97316" font-weight="600" letter-spacing="1">ADOBE FIREFLY · 2026 年 11 月</text>

  <!-- Main headline block -->
  <text x="60" y="168" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">3 個平台。</text>
  <text x="60" y="232" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="-1">15 天。</text>
  <text x="60" y="296" font-size="52" fill="#F97316" font-weight="700" letter-spacing="-1">同一個賭注。</text>

  <!-- Divider -->
  <line x1="60" y1="332" x2="840" y2="332" stroke="#202020" stroke-width="1.5"/>

  <!-- Pattern callout -->
  <text x="60" y="380" font-size="15" fill="#F97316" font-weight="600" letter-spacing="1">WORKFLOW CANVAS 收斂</text>

  <!-- Timeline blocks -->
  <g font-size="18" fill="#CCCCCC" font-weight="400">
    <text x="60" y="432">↗  Runway App Studio       10 月 27 日</text>
    <text x="60" y="470">↗  Figma Weave nodes        10 月 30 日</text>
    <text x="60" y="508">↗  Adobe Firefly Graph      11 月 10 日</text>
  </g>

  <!-- Section divider -->
  <line x1="60" y1="540" x2="840" y2="540" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Firefly Graph features -->
  <text x="60" y="590" font-size="15" fill="#F97316" font-weight="600" letter-spacing="1">FIREFLY GRAPH（公開 BETA）</text>
  <g font-size="19" fill="#CCCCCC" font-weight="400">
    <text x="60" y="634">01  模型比較 — 相同 input，</text>
    <text x="60" y="662">     多個模型，並排輸出</text>
    <text x="60" y="710">02  Subgraph — workflow 層級的</text>
    <text x="60" y="738">     constraint architecture</text>
    <text x="60" y="786">03  分享 workflow — 會執行的</text>
    <text x="60" y="814">     機構知識，不只是文件</text>
  </g>

  <!-- Section divider -->
  <line x1="60" y1="850" x2="840" y2="850" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Builder note -->
  <text x="60" y="898" font-size="15" fill="#F97316" font-weight="600" letter-spacing="1">FIREFLY BUILDER（私有 BETA，WAITLIST）</text>
  <text x="60" y="934" font-size="18" fill="#808080">自然語言 → 有品牌風格的 prototype</text>
  <text x="60" y="960" font-size="18" fill="#808080">品牌指南 → design system → HTML</text>

  <!-- Caveat box -->
  <rect x="60" y="996" width="780" height="60" rx="8" fill="#141414" stroke="#2A1800" stroke-width="1.5"/>
  <text x="80" y="1024" font-size="14" fill="#F59E0B" font-weight="600">⚠  誠實的 caveat</text>
  <text x="80" y="1046" font-size="13" fill="#707070">Graph 公開 beta，不是 GA。Builder 是最有趣也最難取得的功能。</text>

  <!-- Bottom label -->
  <text x="60" y="1138" font-size="17" fill="#FFFFFF" font-weight="600">把流程編碼，部署它。</text>
  <text x="60" y="1164" font-size="17" fill="#505050" font-weight="400">停止成為瓶頸。</text>

  <!-- Bottom right attribution -->
  <text x="840" y="1164" font-size="12" fill="#3A3A3A" text-anchor="end">Senior UX · AI 工具觀察</text>
</svg>
