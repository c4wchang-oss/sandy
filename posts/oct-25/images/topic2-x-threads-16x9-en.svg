<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a06"/>
      <stop offset="100%" style="stop-color:#150f00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg1)"/>

  <!-- Left accent bar  warm gold for Google/Nano Banana theme -->
  <rect x="64" y="64" width="3" height="547" fill="#f9ab00" opacity="0.9"/>

  <!-- Category label -->
  <text x="88" y="108" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#f9ab00" letter-spacing="3" opacity="0.8">AI UX · OCT 25, 2026</text>

  <!-- Main headline -->
  <text x="88" y="195" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Better text in AI images.</text>
  <text x="88" y="256" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="54" font-weight="700" fill="#f9ab00" letter-spacing="-1">Read the model card first.</text>

  <!-- Divider -->
  <rect x="88" y="286" width="80" height="2" fill="#f9ab00" opacity="0.5"/>

  <!-- Sub-headline -->
  <text x="88" y="338" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#aaaaaa">Google Nano Banana 2.1: what "better text" actually means</text>
  <text x="88" y="366" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#aaaaaa">for UX designers  and what the model card says it doesn't.</text>

  <!-- Division of labor (right side) -->
  <text x="780" y="160" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#f9ab00" letter-spacing="2" opacity="0.8">DIVISION OF LABOR</text>

  <!-- Image model column -->
  <text x="780" y="188" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#888888" letter-spacing="1">IMAGE MODEL</text>
  <text x="780" y="212" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Hero visuals</text>
  <text x="780" y="232" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Wide banners (1:4, 4:1)</text>
  <text x="780" y="252" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Infographic drafts</text>
  <text x="780" y="272" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Illustrated scenes</text>
  <text x="780" y="292" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Short multilingual labels</text>

  <!-- Separator -->
  <rect x="950" y="175" width="1" height="140" fill="#333333"/>

  <!-- Design tool column -->
  <text x="970" y="188" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#888888" letter-spacing="1">DESIGN TOOL</text>
  <text x="970" y="212" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">UI components + states</text>
  <text x="970" y="232" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Live editable type</text>
  <text x="970" y="252" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Brand tokens</text>
  <text x="970" y="272" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Interaction logic</text>
  <text x="970" y="292" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#cccccc">Small labels, fine print</text>

  <!-- Benchmark highlight -->
  <rect x="780" y="335" width="380" height="78" rx="5" fill="#1a1200"/>
  <text x="800" y="363" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#f9ab00" letter-spacing="2">INFOGRAPHIC DESIGN BENCHMARK</text>
  <text x="800" y="393" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="700" fill="#f9ab00">1048</text>
  <text x="856" y="393" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#888888"> / DesignArena · highest tested</text>

  <!-- Key insight block -->
  <rect x="88" y="404" width="640" height="120" rx="6" fill="#1a1200" opacity="0.9"/>
  <text x="112" y="441" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#f9ab00" letter-spacing="1.5">IMAGE MODEL vs DESIGN MODEL</text>
  <text x="112" y="469" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="17" font-weight="400" fill="#e8e8e8">Image model: produces pixels  the ending.</text>
  <text x="112" y="494" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="17" font-weight="400" fill="#e8e8e8">Design model: produces working files  the start.</text>

  <!-- Model card caveat -->
  <text x="780" y="452" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#f9ab00" letter-spacing="2">MODEL CARD SAYS:</text>
  <text x="780" y="474" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#666666">Small text at 1K: still blurry</text>
  <text x="780" y="493" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#666666">Long paragraphs: still poor</text>
  <text x="780" y="512" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#666666">Left/right reasoning: occasional confusion</text>

  <!-- Bottom attribution -->
  <text x="88" y="614" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" fill="#444444">Senior UX perspective · Google Nano Banana 2.1 · Released Oct 6, 2026</text>
</svg>
