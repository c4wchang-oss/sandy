<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c12"/>
      <stop offset="100%" style="stop-color:#0c1522"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5cc"/>
      <stop offset="100%" style="stop-color:#0095ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bg1)"/>

  <!-- Top accent bar -->
  <rect x="60" y="60" width="780" height="3" fill="url(#accent1)" opacity="0.8"/>

  <!-- Category label -->
  <text x="60" y="112" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#00e5cc" letter-spacing="3" opacity="0.8">AI UX · OCT 25, 2026</text>

  <!-- Main headline block -->
  <text x="60" y="200" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">5 agents.</text>
  <text x="60" y="270" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="60" font-weight="700" fill="#00e5cc" letter-spacing="-1">One notch.</text>
  <text x="60" y="330" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="400" fill="#888888">AgentValley: notification design</text>
  <text x="60" y="362" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="400" fill="#888888">for AI coding agents.</text>

  <!-- Divider -->
  <rect x="60" y="395" width="60" height="2" fill="#00e5cc" opacity="0.5"/>

  <!-- The 5 problems -->
  <text x="60" y="446" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#00e5cc" letter-spacing="2">THE PROBLEM</text>

  <rect x="60" y="462" width="780" height="52" rx="5" fill="#0e1c2a"/>
  <circle cx="90" cy="488" r="5" fill="#33aaff" opacity="0.6"/>
  <text x="110" y="492" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#cccccc">5 concurrent sessions · 5 terminal tabs to check</text>

  <rect x="60" y="524" width="780" height="52" rx="5" fill="#1a0d08"/>
  <circle cx="90" cy="550" r="6" fill="#ff4444"/>
  <text x="110" y="548" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" font-weight="600" fill="#ff8888">ONE IS WAITING FOR YOU</text>
  <text x="110" y="566" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" fill="#666666">Allow: git push origin main?  · 20 minutes ago</text>

  <!-- Solution block -->
  <text x="60" y="628" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#00e5cc" letter-spacing="2">HOW AGENTVALLEY SOLVES IT</text>

  <text x="60" y="668" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#e0e0e0">` Notch panel  ambient, peripheral, always visible</text>
  <text x="60" y="700" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#e0e0e0">a Red count badge when any agent needs you</text>
  <text x="60" y="732" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#e0e0e0">b Pixel avatar per agent  visual ID at a glance</text>
  <text x="60" y="764" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#e0e0e0">c One click ’ jump to exact terminal tab</text>
  <text x="60" y="796" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#888888">d (Optional plugin) Approve from notch</text>

  <!-- Trust + DesignOps block -->
  <rect x="60" y="830" width="780" height="148" rx="6" fill="#0d1f2d"/>
  <text x="84" y="866" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="600" fill="#00e5cc" letter-spacing="1.5">TRUST + DESIGNOPS</text>
  <text x="84" y="894" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#cccccc">Monitoring reads local files only  no external requests</text>
  <text x="84" y="918" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#cccccc">Open-source · auditable · write access opt-in</text>
  <text x="84" y="948" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#cccccc">Per-project cost tracking ’ PDF statement of work</text>

  <!-- Key insight -->
  <text x="60" y="1024" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#00e5cc" letter-spacing="2">SENIOR UX PRINCIPLE</text>
  <text x="60" y="1056" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#ffffff">Peripheral vision cuts errors without</text>
  <text x="60" y="1084" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="400" fill="#ffffff">adding attention cost.</text>
  <text x="60" y="1112" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="400" fill="#00e5cc">Same principle. New surface.</text>

  <!-- Bottom bar -->
  <rect x="60" y="1152" width="780" height="3" fill="url(#accent1)" opacity="0.4"/>
  <text x="60" y="1177" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#444444">agentvalley.app · Free &amp; open-source · macOS · Claude Code</text>
</svg>
