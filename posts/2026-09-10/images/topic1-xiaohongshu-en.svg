<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#030810"/>
      <stop offset="100%" style="stop-color:#080D1A"/>
    </linearGradient>
    <linearGradient id="accent-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ACEF5"/>
      <stop offset="100%" style="stop-color:#0A7EF5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#060A16;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent-h)"/>

  <!-- Platform label -->
  <rect x="60" y="56" width="240" height="46" rx="23" fill="#0ACEF5" fill-opacity="0.12" stroke="#0ACEF5" stroke-width="1" stroke-opacity="0.5"/>
  <text x="180" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="19" fill="#0ACEF5" text-anchor="middle">AI UX INSIGHT</text>

  <!-- Date -->
  <text x="1020" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#1A3A5A" text-anchor="end">2026.09.08</text>

  <!-- Main title -->
  <text x="60" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1">OUI-1 generates UI</text>
  <text x="60" y="274" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="#0ACEF5" letter-spacing="-1">from your component</text>
  <text x="60" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1">library.</text>

  <!-- Accent line -->
  <rect x="60" y="374" width="480" height="4" rx="2" fill="url(#accent-h)"/>

  <!-- Subtitle -->
  <text x="60" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#2A5A80">World&#x2019;s First Generative UI Model  Senior UX POV</text>

  <!-- Section: The mechanic -->
  <text x="60" y="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#0ACEF5" letter-spacing="2">THE MECHANIC</text>

  <rect x="60" y="520" width="960" height="100" rx="12" fill="url(#card)" stroke="#0ACEF5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="564" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#CCCCCC">TypeScript props in system prompt</text>
  <text x="100" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#2A5A80">Your component signatures = model&#x2019;s design brief</text>

  <!-- What this reveals -->
  <text x="60" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#0ACEF5" letter-spacing="2">WHAT THIS REVEALS</text>

  <rect x="60" y="684" width="960" height="96" rx="12" fill="url(#card)" stroke="#0A7EF5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#AAAAAA">Ambiguous props</text>
  <text x="100" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#2A5070">&#x2192; AI generates ambiguous UI</text>

  <rect x="60" y="790" width="960" height="96" rx="12" fill="url(#card)" stroke="#0A7EF5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="830" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#AAAAAA">Undocumented variants</text>
  <text x="100" y="864" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#2A5070">&#x2192; AI guesses which one to use</text>

  <rect x="60" y="896" width="960" height="96" rx="12" fill="url(#card)" stroke="#4ABCF5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="936" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#AAAAAA">Missing edge cases</text>
  <text x="100" y="970" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#2A5070">&#x2192; generated interface fails at edge cases</text>

  <!-- Key numbers -->
  <text x="60" y="1040" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#0ACEF5" letter-spacing="2">BY THE NUMBERS</text>

  <rect x="60" y="1060" width="300" height="130" rx="12" fill="url(#card)" stroke="#0ACEF5" stroke-width="1" stroke-opacity="0.35"/>
  <text x="100" y="1120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#0ACEF5">71.7%</text>
  <text x="100" y="1154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#2A5A80">benchmark (parser only)</text>
  <text x="100" y="1176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#1A3A5A">base: 13%</text>

  <rect x="380" y="1060" width="280" height="130" rx="12" fill="url(#card)" stroke="#0A7EF5" stroke-width="1" stroke-opacity="0.35"/>
  <text x="420" y="1120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#0A7EF5">4B</text>
  <text x="420" y="1154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#2A5A80">active params</text>
  <text x="420" y="1176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#1A3A5A">RTX 5090 local</text>

  <rect x="680" y="1060" width="340" height="130" rx="12" fill="url(#card)" stroke="#4ABCF5" stroke-width="1" stroke-opacity="0.35"/>
  <text x="720" y="1120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#4ABCF5">67%</text>
  <text x="720" y="1154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#2A5A80">fewer tokens</text>
  <text x="720" y="1176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#1A3A5A">OpenUI Lang</text>

  <!-- Key insight -->
  <rect x="60" y="1224" width="960" height="160" rx="16" fill="#060A18" stroke="#0ACEF5" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="100" y="1272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#0ACEF5" letter-spacing="2">SENIOR UX TAKE</text>
  <text x="100" y="1316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">Design system debt now has a</text>
  <text x="100" y="1352" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#4ABCF5">new demonstration format.</text>

  <!-- Source -->
  <text x="540" y="1420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#1A3A5A" text-anchor="middle">openui.com  September 8, 2026</text>
</svg>
