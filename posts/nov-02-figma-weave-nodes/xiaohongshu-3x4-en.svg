<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0800"/>
      <stop offset="60%" stop-color="#0F0E05"/>
      <stop offset="100%" stop-color="#0A0800"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="772" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="772" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="3" fill="#F59E0B"/>

  <!-- Subtle horizontal lines -->
  <line x1="0" y1="300" x2="900" y2="300" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="600" x2="900" y2="600" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="900" x2="900" y2="900" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative nodes top-right -->
  <circle cx="826" cy="88" r="18" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="826" cy="88" r="5" fill="#F59E0B" fill-opacity="0.7"/>
  <circle cx="826" cy="152" r="18" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="826" cy="152" r="5" fill="#F59E0B" fill-opacity="0.45"/>
  <line x1="826" y1="106" x2="826" y2="134" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Header section -->
  <rect x="64" y="58" width="154" height="22" rx="3" fill="#F59E0B" fill-opacity="0.18"/>
  <text x="141" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FCD34D" text-anchor="middle" letter-spacing="1.5">FIGMA WEAVE</text>

  <!-- Main title -->
  <text x="64" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#F5F5F5" letter-spacing="-1.5">The node graph</text>
  <text x="64" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#F59E0B" letter-spacing="-1.5">IS the brief.</text>

  <!-- Subtitle -->
  <text x="64" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#9CA3AF">Build once. The team runs it.</text>
  <text x="64" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#9CA3AF">Decisions encoded, not documented.</text>

  <!-- Divider -->
  <rect x="64" y="300" width="772" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Card 1 -->
  <rect x="64" y="316" width="772" height="90" rx="8" fill="url(#card1)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="64" y="316" width="4" height="90" rx="2" fill="#F59E0B"/>
  <text x="82" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="0.8">01  NODE GRAPH = RUNNING BRIEF</text>
  <text x="82" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Each step wired as a node. Decisions traceable.</text>
  <text x="82" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">More durable than a doc  it runs.</text>

  <!-- Card 2 -->
  <rect x="64" y="420" width="772" height="90" rx="8" fill="url(#card2)" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="64" y="420" width="4" height="90" rx="2" fill="#F59E0B" fill-opacity="0.7"/>
  <text x="82" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="0.8">02  FIGMA NODE  LIVE SYNC</text>
  <text x="82" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Paste a Figma frame. It stays live.</text>
  <text x="82" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">DS color update ’ campaign reruns. Automatic.</text>

  <!-- Card 3 -->
  <rect x="64" y="524" width="772" height="90" rx="8" fill="url(#card2)" stroke="#F59E0B" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="64" y="524" width="4" height="90" rx="2" fill="#F59E0B" fill-opacity="0.5"/>
  <text x="82" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="0.8">03  BRANCH TO COMPARE</text>
  <text x="82" y="577" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Different models. Same input. Side by side.</text>
  <text x="82" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Decision history stays on canvas.</text>

  <!-- Card 4 -->
  <rect x="64" y="628" width="772" height="90" rx="8" fill="url(#card2)" stroke="#F59E0B" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="64" y="628" width="4" height="90" rx="2" fill="#F59E0B" fill-opacity="0.4"/>
  <text x="82" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="0.8">04  PUBLISH AS WEAVE TOOL</text>
  <text x="82" y="681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Team runs it. No node knowledge needed.</text>
  <text x="82" y="704" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E5E7EB">Domain expert ’ system architect.</text>

  <!-- Divider -->
  <rect x="64" y="742" width="772" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- What it encodes section -->
  <text x="64" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="0.8">WHAT WEAVE ENCODES</text>
  <text x="64" y="808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Structure: yes     Taste: no </text>
  <text x="64" y="836" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Bad creative direction ’ scales efficiently.</text>
  <text x="64" y="858" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Garbage-in now happens at workflow level.</text>

  <!-- Divider -->
  <rect x="64" y="886" width="772" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Governance section -->
  <text x="64" y="924" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="0.8">THE GOVERNANCE QUESTION</text>
  <text x="64" y="950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">Who owns the Weave workflow?</text>
  <text x="64" y="974" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">If it lives in one person's account,</text>
  <text x="64" y="996" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9CA3AF">one resignation = institutional knowledge gone.</text>
  <text x="64" y="1028" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#F5F5F5">Workflow governance = next DesignOps problem.</text>

  <!-- Bottom brand line -->
  <rect x="0" y="1158" width="900" height="42" fill="#070600"/>
  <rect x="0" y="1158" width="900" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="64" y="1185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4B5563">Figma Weave · Oct 30, 2026</text>
  <text x="836" y="1185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#F59E0B" text-anchor="end" font-weight="600">@senior_ux</text>
</svg>
