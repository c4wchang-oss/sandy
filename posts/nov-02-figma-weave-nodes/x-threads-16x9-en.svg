<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0800"/>
      <stop offset="100%" stop-color="#0F0E05"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Node connector lines (decorative, right side) -->
  <circle cx="990" cy="200" r="22" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="990" cy="200" r="6" fill="#F59E0B" fill-opacity="0.7"/>
  <circle cx="1080" cy="270" r="22" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="1080" cy="270" r="6" fill="#F59E0B" fill-opacity="0.5"/>
  <circle cx="990" cy="340" r="22" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="990" cy="340" r="6" fill="#F59E0B" fill-opacity="0.35"/>
  <line x1="1012" y1="200" x2="1058" y2="270" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1058" y1="270" x2="1012" y2="340" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="968" y1="200" x2="968" y2="340" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Left accent bar -->
  <rect x="72" y="110" width="4" height="230" rx="2" fill="#F59E0B" opacity="0.9"/>

  <!-- Accent line under headline -->
  <rect x="76" y="350" width="500" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="96" width="154" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="153" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FCD34D" text-anchor="middle" letter-spacing="1.2">FIGMA WEAVE</text>

  <!-- Main headline -->
  <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">The node graph</text>
  <text x="76" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#F59E0B" letter-spacing="-1.5">IS the brief.</text>
  <text x="76" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#9CA3AF" letter-spacing="-0.5">Build once. The team runs it.</text>

  <!-- Divider -->
  <rect x="76" y="372" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points row -->
  <!-- Point 1 -->
  <text x="76" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F59E0B" letter-spacing="0.8">NODE GRAPH</text>
  <text x="76" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Every step is a node.</text>
  <text x="76" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Decisions stay on canvas.</text>

  <!-- Point 2 -->
  <text x="440" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F59E0B" letter-spacing="0.8">FIGMA NODE</text>
  <text x="440" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Paste a frame. It stays live.</text>
  <text x="440" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">DS changes ’ campaign reruns.</text>

  <!-- Point 3 -->
  <text x="820" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F59E0B" letter-spacing="0.8">WEAVE TOOL</text>
  <text x="820" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Publish the workflow.</text>
  <text x="820" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Team runs. No nodes needed.</text>

  <!-- Vertical separators -->
  <line x1="414" y1="398" x2="414" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="794" y1="398" x2="794" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="572" width="1200" height="103" fill="#07060000"/>
  <rect x="0" y="572" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">Figma Weave · Oct 30, 2026 · workflow = institutional knowledge</text>

  <!-- Bottom label right -->
  <text x="1124" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#F5F5F5" text-anchor="end">encode structure</text>
  <text x="1124" y="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280" text-anchor="end">not taste</text>

  <!-- Amber dot accent -->
  <circle cx="1148" cy="548" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="1160" cy="548" r="3" fill="#F59E0B" opacity="0.3"/>
  <circle cx="1172" cy="548" r="3" fill="#F59E0B" opacity="0.15"/>
</svg>
