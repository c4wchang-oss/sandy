<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0518"/>
      <stop offset="100%" style="stop-color:#110D22"/>
    </linearGradient>
    <linearGradient id="accent-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B4FD4"/>
      <stop offset="100%" style="stop-color:#C44FC9"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16092E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D0620;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent-h)"/>

  <!-- Platform label -->
  <rect x="60" y="60" width="260" height="46" rx="23" fill="#7B4FD4" fill-opacity="0.12" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="190" y="89" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#9B6FE4" text-anchor="middle">AI UX INSIGHT</text>

  <!-- Date -->
  <text x="1020" y="89" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#3A2A5A" text-anchor="end">2026.09.08</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="-1">Canva&#x2019;s 100th feature</text>
  <text x="60" y="278" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#C44FC9" letter-spacing="-1">isn&#x2019;t the story.</text>
  <text x="60" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="-1">The floor shift is.</text>

  <!-- Accent line -->
  <rect x="60" y="374" width="520" height="4" rx="2" fill="url(#accent-h)"/>

  <!-- Subtitle -->
  <text x="60" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#8A6AAE">Canva Visual Suite  Senior UX POV</text>

  <!-- Floor shifts section -->
  <text x="60" y="510" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#7B4FD4" letter-spacing="2">THE FLOOR SHIFT MODEL</text>

  <!-- 2013 row -->
  <rect x="60" y="534" width="960" height="80" rx="12" fill="#16092E" fill-opacity="0.6" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.2"/>
  <text x="100" y="582" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#7B4FD4">2013</text>
  <text x="200" y="582" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#AAAAAA">Template floor  anyone could make a flyer</text>

  <!-- 2023 row -->
  <rect x="60" y="626" width="960" height="80" rx="12" fill="#16092E" fill-opacity="0.6" stroke="#9B6FE4" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="674" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#9B6FE4">2023</text>
  <text x="200" y="674" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#CCCCCC">AI generation floor  anyone could design</text>

  <!-- 2026 row -->
  <rect x="60" y="718" width="960" height="80" rx="12" fill="#1E0A38" fill-opacity="0.9" stroke="#C44FC9" stroke-width="2" stroke-opacity="0.6"/>
  <text x="100" y="766" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#C44FC9">2026</text>
  <text x="200" y="766" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#E0C0E0">Productivity suite floor  full content workflow</text>

  <!-- Stats section -->
  <text x="60" y="860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#7B4FD4" letter-spacing="2">THE NUMBERS</text>

  <!-- Stat grid -->
  <rect x="60" y="882" width="456" height="130" rx="12" fill="url(#card)" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.25"/>
  <text x="90" y="932" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="50" fill="#C44FC9">1B+</text>
  <text x="90" y="972" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6AAE">designs / month</text>

  <rect x="564" y="882" width="456" height="130" rx="12" fill="url(#card)" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.25"/>
  <text x="594" y="932" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="50" fill="#9B6FE4">98%</text>
  <text x="594" y="972" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6AAE">Fortune 500</text>

  <rect x="60" y="1024" width="456" height="130" rx="12" fill="url(#card)" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.25"/>
  <text x="90" y="1074" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="50" fill="#7B4FD4">6M+</text>
  <text x="90" y="1114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6AAE">coded websites</text>

  <rect x="564" y="1024" width="456" height="130" rx="12" fill="url(#card)" stroke="#7B4FD4" stroke-width="1" stroke-opacity="0.25"/>
  <text x="594" y="1074" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="50" fill="#C44FC9">100</text>
  <text x="594" y="1114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#8A6AAE">features this year</text>

  <!-- Key insight -->
  <rect x="60" y="1178" width="960" height="170" rx="16" fill="#1A0A30" fill-opacity="0.9" stroke="#C44FC9" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="100" y="1230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#C44FC9" letter-spacing="2">SENIOR UX TAKE</text>
  <text x="100" y="1274" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#CCCCCC">Your stakeholders have a full visual workflow now.</text>
  <text x="100" y="1314" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#C44FC9">Your value: judgment. Not execution.</text>

  <!-- Bottom source -->
  <text x="540" y="1410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#3A2A5A" text-anchor="middle">canva.com  September 3, 2026</text>
</svg>
