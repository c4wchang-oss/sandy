<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle code grid background -->
  <g opacity="0.06" stroke="#0D9488" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Accent bar top-left -->
  <rect x="80" y="80" width="6" height="80" fill="#0D9488" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#0D9488" font-weight="600" letter-spacing="2">DESSN · NOV 2026</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">Every canvas works</text>
  <text x="104" y="230" font-size="50" fill="#FFFFFF" font-weight="700" letter-spacing="-1">from pictures of your app.</text>
  <text x="104" y="300" font-size="50" fill="#0D9488" font-weight="700" letter-spacing="-1">Dessn works from your app.</text>

  <!-- Divider -->
  <line x1="104" y1="336" x2="740" y2="336" stroke="#222222" stroke-width="1.5"/>

  <!-- Key insight rows -->
  <g font-size="17" fill="#A0A0A0" font-weight="400">
    <text x="104" y="372">Agent reads real components at file:line. Reuses them — not visual lookalikes.</text>
    <text x="104" y="404">Canvas-as-context: 7th instance. First where canvas = production source.</text>
  </g>

  <!-- Caveat pill -->
  <rect x="104" y="430" width="560" height="40" rx="6" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="124" y="456" font-size="14" fill="#F59E0B" font-weight="600">⚠  Caveat:</text>
  <text x="210" y="456" font-size="14" fill="#808080">Free = 50 MCP calls/month per team (reads count). Cloud agents: no direct frame writes.</text>

  <!-- Bottom tag line -->
  <text x="104" y="560" font-size="20" fill="#FFFFFF" font-weight="600">The design context is your running production code.</text>
  <text x="104" y="590" font-size="20" fill="#606060" font-weight="400">Not a screenshot of it. The thing itself.</text>

  <!-- Bottom right attribution -->
  <text x="1120" y="640" font-size="13" fill="#3A3A3A" text-anchor="end">Senior UX · AI Tools</text>
</svg>
