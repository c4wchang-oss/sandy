<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14141E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg1)" />

  <!-- Top color bar -->
  <rect x="0" y="0" width="1080" height="6" fill="url(#accent1)"/>

  <!-- Header section -->
  <text x="540" y="100" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6366F1" text-anchor="middle" letter-spacing="3" font-weight="600">SENIOR UX DESIGNER · AI TOOLS WATCH</text>

  <!-- Main headline -->
  <text x="540" y="200" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" text-anchor="middle">Stop the</text>
  <text x="540" y="290" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" text-anchor="middle">5-tab</text>
  <text x="540" y="380" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent1)" text-anchor="middle">research loop</text>

  <!-- Tool name badge -->
  <rect x="380" y="420" width="320" height="52" rx="26" fill="#1E1E30" stroke="#3A3A52" stroke-width="1.5"/>
  <text x="540" y="452" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">Inspo AI  Reviewed</text>

  <!-- Divider -->
  <rect x="460" y="504" width="160" height="3" rx="1.5" fill="url(#accent1)"/>

  <!-- Feature cards -->
  <!-- Card 1 -->
  <rect x="60" y="530" width="960" height="120" rx="14" fill="url(#cardBg)" stroke="#252535" stroke-width="1.5"/>
  <rect x="60" y="530" width="6" height="120" rx="3" fill="#6366F1"/>
  <text x="100" y="573" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6366F1" font-weight="700" letter-spacing="2">01 · SEARCH</text>
  <text x="100" y="600" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600">AI design search</text>
  <text x="100" y="626" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8888A8">50,000+ UI screens · searchable by design intent</text>

  <!-- Card 2 -->
  <rect x="60" y="668" width="960" height="120" rx="14" fill="url(#cardBg)" stroke="#252535" stroke-width="1.5"/>
  <rect x="60" y="668" width="6" height="120" rx="3" fill="#7C7CF8"/>
  <text x="100" y="711" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7C7CF8" font-weight="700" letter-spacing="2">02 · MOODBOARD</text>
  <text x="100" y="738" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600">Zero friction curation</text>
  <text x="100" y="764" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8888A8">Click ’ board · palette · font pairs · share link</text>

  <!-- Card 3 -->
  <rect x="60" y="806" width="960" height="120" rx="14" fill="url(#cardBg)" stroke="#252535" stroke-width="1.5"/>
  <rect x="60" y="806" width="6" height="120" rx="3" fill="#8B5CF6"/>
  <text x="100" y="849" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8B5CF6" font-weight="700" letter-spacing="2">03 · BRAND AUDIT </text>
  <text x="100" y="876" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600">Automated brand QA</text>
  <text x="100" y="902" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8888A8">Upload guidelines ’ score /100 with visual annotations</text>

  <!-- Card 4 -->
  <rect x="60" y="944" width="960" height="120" rx="14" fill="url(#cardBg)" stroke="#252535" stroke-width="1.5"/>
  <rect x="60" y="944" width="6" height="120" rx="3" fill="#A78BFA"/>
  <text x="100" y="987" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A78BFA" font-weight="700" letter-spacing="2">04 · FIGMA + AI GEN</text>
  <text x="100" y="1014" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600">One workspace, end to end</text>
  <text x="100" y="1040" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8888A8">Capture to Figma · generate UI from your curated refs</text>

  <!-- Honest take section -->
  <rect x="60" y="1094" width="960" height="160" rx="14" fill="#16161F" stroke="#2A2A3E" stroke-width="1.5"/>
  <text x="100" y="1134" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#F59E0B" font-weight="700" letter-spacing="2">HONEST TAKE</text>
  <text x="100" y="1162" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C8C8E0">50k screens only matters if curation stays fresh.</text>
  <text x="100" y="1188" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C8C8E0">The brand audit is the most differentiated feature.</text>
  <text x="100" y="1216" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8888A8">Best for: research phase quality, not generation-first.</text>

  <!-- Key insight block -->
  <rect x="60" y="1280" width="960" height="100" rx="14" fill="#0D0D1A" stroke="#6366F1" stroke-width="1.5"/>
  <text x="540" y="1323" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#6366F1" text-anchor="middle" font-weight="600">Better references ’ Better briefs ’ Better AI output</text>
  <text x="540" y="1355" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6666AA" text-anchor="middle">The bottleneck was never the model.</text>

  <!-- Footer -->
  <text x="540" y="1415" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4A4A6A" text-anchor="middle">inspoai.io · Oct 11, 2026</text>
</svg>
