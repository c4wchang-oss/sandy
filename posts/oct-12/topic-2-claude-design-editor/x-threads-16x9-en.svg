<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101018;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg1)" />

  <!-- Subtle grid -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#1C1C24" stroke-width="1"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#1C1C24" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="900" stroke="#1C1C24" stroke-width="1"/>
  <line x1="1066" y1="0" x2="1066" y2="900" stroke="#1C1C24" stroke-width="1"/>

  <!-- Right panel  simulated export ecosystem diagram -->
  <!-- Central node -->
  <circle cx="1260" cy="450" r="70" fill="#1A1A24" stroke="#F97316" stroke-width="2"/>
  <text x="1260" y="440" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#F97316" text-anchor="middle" font-weight="700">Claude</text>
  <text x="1260" y="458" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#F97316" text-anchor="middle" font-weight="700">Design</text>

  <!-- Spokes and connected tool nodes -->
  <!-- Adobe (top-left) -->
  <line x1="1197" y1="397" x2="1110" y2="300" stroke="#F97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="1090" cy="280" r="38" fill="#1A1A24" stroke="#333340" stroke-width="1.5"/>
  <text x="1090" y="284" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#AAAACC" text-anchor="middle">Adobe</text>

  <!-- Canva (top) -->
  <line x1="1260" y1="380" x2="1260" y2="280" stroke="#F97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="1260" cy="252" r="38" fill="#1A1A24" stroke="#333340" stroke-width="1.5"/>
  <text x="1260" y="256" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#AAAACC" text-anchor="middle">Canva</text>

  <!-- v0 (top-right) -->
  <line x1="1323" y1="397" x2="1400" y2="300" stroke="#F97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="1420" cy="280" r="38" fill="#1A1A24" stroke="#333340" stroke-width="1.5"/>
  <text x="1420" y="284" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#AAAACC" text-anchor="middle">v0</text>

  <!-- Vercel (right) -->
  <line x1="1330" y1="450" x2="1430" y2="450" stroke="#F97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="1468" cy="450" r="38" fill="#1A1A24" stroke="#333340" stroke-width="1.5"/>
