  <line x1="1323" y1="503" x2="1400" y2="600" stroke="#F97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="1420" cy="620" r="38" fill="#1A1A24" stroke="#333340" stroke-width="1.5"/>
  <text x="1420" y="624" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#AAAACC" text-anchor="middle">Lovable</text>

