<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0D0D0D"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#06B6D4" stroke-width="1" fill="none">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#06B6D4" rx="3"/>

  <!-- Tool label -->
  <text x="104" y="104" font-size="13" fill="#06B6D4" font-weight="600" letter-spacing="2">LUMA BRAND KIT + CHARACTER LIBRARY · 2026 年 11 月 25 日 · BETA</text>

  <!-- Main headline -->
  <text x="104" y="168" font-size="42" fill="#FFFFFF" font-weight="700" letter-spacing="-1">臉現在是品牌素材。</text>
  <text x="104" y="224" font-size="34" fill="#67E8F9" font-weight="700" letter-spacing="-1">#brandkit + @character = 約束組合。</text>

  <!-- Divider -->
  <line x1="104" y1="254" x2="1100" y2="254" stroke="#222222" stroke-width="1.5"/>

  <!-- Two main feature boxes -->
  <!-- Brand Kit box -->
  <rect x="80" y="274" width="490" height="130" rx="6" fill="#071A1E" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="100" y="302" font-size="12" fill="#06B6D4" font-weight="700" letter-spacing="1">BRAND KIT</text>
  <text x="100" y="326" font-size="16" fill="#FFFFFF" font-weight="600">Logo、字體、顏色的 AI 真相來源</text>
  <text x="100" y="348" font-size="13" fill="#67E8F9">用 #brandkit 綁定 board → 每次生成都讀取</text>
  <text x="100" y="368" font-size="13" fill="#67E8F9">或放入網站 URL → Luma 為你起草</text>
  <text x="100" y="390" font-size="12" fill="#155E75">參考輸入 · research preview beta</text>

  <!-- Plus -->
  <text x="585" y="344" font-size="22" fill="#164E63">+</text>

  <!-- Character Library box -->
  <rect x="612" y="274" width="490" height="130" rx="6" fill="#071A1E" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="632" y="302" font-size="12" fill="#06B6D4" font-weight="700" letter-spacing="1">CHARACTER LIBRARY</text>
  <text x="632" y="326" font-size="16" fill="#FFFFFF" font-weight="600">臉、身體、服裝、表情儲存一次</text>
  <text x="632" y="348" font-size="13" fill="#67E8F9">用 @character 呼叫——模型以此為真相來源</text>
  <text x="632" y="368" font-size="13" fill="#67E8F9">第一個：臉 = 命名品牌素材，不是重新上傳的圖像</text>
  <text x="632" y="390" font-size="12" fill="#155E75">和 logo 同等級的新資源類型</text>

  <!-- Monitor vs enforce -->
  <rect x="80" y="424" width="680" height="62" rx="6" fill="#141414" stroke="#164E63" stroke-width="1.5"/>
  <text x="100" y="450" font-size="14" fill="#06B6D4" font-weight="600">評估 ≠ 執行。</text>
  <text x="184" y="450" font-size="14" fill="#808080">Agent 標記品牌漂移。它不會在架構上阻止它。</text>
  <text x="100" y="474" font-size="13" fill="#606060">監控不是預防。在讓 100 個素材無人監管地跑之前，了解你買的是哪個層面。</text>

  <!-- URL caveat box -->
  <rect x="786" y="424" width="318" height="62" rx="6" fill="#071214" stroke="#164E63" stroke-width="1"/>
  <text x="806" y="446" font-size="12" fill="#155E75" font-weight="600" letter-spacing="1">URL 前提</text>
  <text x="806" y="466" font-size="13" fill="#0E7490">URL 起草讀取已部署狀態。</text>
  <text x="806" y="482" font-size="13" fill="#0E7490">規模跑之前先審計。</text>

  <!-- Bottom reframe -->
  <text x="80" y="528" font-size="19" fill="#FFFFFF" font-weight="600">不是「帶有品牌顏色的 AI」。臉是命名約束。Brief 是資源圖。</text>
  <text x="80" y="556" font-size="16" fill="#606060">參考勝過描述。這是同樣的原則，應用在角色身份上。</text>

  <!-- Attribution -->
  <text x="1120" y="660" font-size="13" fill="#083344" text-anchor="end">Senior UX · AI 工具</text>
</svg>
