<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060614"/>
      <stop offset="100%" stop-color="#09081C"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="regionGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative: region selection frame (top right) -->
  <rect x="930" y="110" width="200" height="200" rx="4" fill="url(#regionGrad)" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Corner marks -->
  <line x1="930" y1="130" x2="930" y2="110" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="930" y1="110" x2="950" y2="110" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="1130" y1="130" x2="1130" y2="110" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="1110" y1="110" x2="1130" y2="110" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="930" y1="290" x2="930" y2="310" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="930" y1="310" x2="950" y2="310" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="1130" y1="290" x2="1130" y2="310" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <line x1="1110" y1="310" x2="1130" y2="310" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2.5"/>
  <!-- Center crosshair -->
  <line x1="1030" y1="185" x2="1030" y2="235" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="1005" y1="210" x2="1055" y2="210" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="1030" cy="210" r="4" fill="#6366F1" fill-opacity="0.8"/>
  <!-- Label on region -->
  <text x="1030" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="middle" letter-spacing="0.5">CONTEXT WINDOW</text>
  <text x="1030" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">edit here only</text>

  <!-- Left accent bar -->
  <rect x="72" y="110" width="4" height="230" rx="2" fill="#6366F1" opacity="0.9"/>

  <!-- Accent line under headline -->
  <rect x="76" y="350" width="500" height="1.5" fill="url(#accentLine)"/>

  <!-- Tool label -->
  <rect x="76" y="96" width="192" height="20" rx="3" fill="url(#tagGrad)"/>
  <text x="172" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="middle" letter-spacing="1.2">IDEOGRAM PRECISE EDIT</text>

  <!-- Main headline -->
  <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">8K. Surgical edit.</text>
  <text x="76" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#6366F1" letter-spacing="-1.5">No downscaling.</text>
  <text x="76" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#9CA3AF" letter-spacing="-0.5">Mark a region. Rest stays untouched.</text>

  <!-- Divider -->
  <rect x="76" y="372" width="1052" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Three key points row -->
  <text x="76" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6366F1" letter-spacing="0.8">CONTEXT WINDOW</text>
  <text x="76" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Auto-detect or set by coords.</text>
  <text x="76" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Edits at original pixel density.</text>

  <text x="440" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6366F1" letter-spacing="0.8">RESOLUTION</text>
  <text x="440" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Up to 8192 × 8192 px.</text>
  <text x="440" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">No seam. No color mismatch.</text>

  <text x="820" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6366F1" letter-spacing="0.8">PRODUCTION</text>
  <text x="820" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Print. Trade show. Packaging.</text>
  <text x="820" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#D1D5DB">Fix one element. Asset holds.</text>

  <!-- Vertical separators -->
  <line x1="414" y1="398" x2="414" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="794" y1="398" x2="794" y2="475" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom bar line -->
  <rect x="0" y="572" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Bottom label left -->
  <text x="76" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6B7280">Ideogram Precise Edit · Nov 1, 2026 · surgical editing at print resolution</text>

  <!-- Bottom label right -->
  <text x="1124" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#F5F5F5" text-anchor="end">still pixels</text>
  <text x="1124" y="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280" text-anchor="end">source stays in Figma</text>

  <!-- Indigo dot accent -->
  <circle cx="1148" cy="548" r="3" fill="#6366F1" opacity="0.6"/>
  <circle cx="1160" cy="548" r="3" fill="#6366F1" opacity="0.3"/>
  <circle cx="1172" cy="548" r="3" fill="#6366F1" opacity="0.15"/>
</svg>
