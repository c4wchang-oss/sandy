<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a"/>
      <stop offset="100%" style="stop-color:#0d1f2d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg4)"/>

  <!-- Left accent bar -->
  <rect x="64" y="64" width="3" height="547" fill="#42b4f5" opacity="0.9"/>

  <!-- Category label -->
  <text x="88" y="108" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#42b4f5" letter-spacing="3" opacity="0.8">AI UX · OCT 22, 2026</text>

  <!-- Main headline -->
  <text x="88" y="196" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">See it before</text>
  <text x="88" y="258" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">it ships.</text>

  <!-- Divider -->
  <rect x="88" y="285" width="80" height="2" fill="#42b4f5" opacity="0.6"/>

  <!-- Sub-headline -->
  <text x="88" y="336" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="23" font-weight="400" fill="#aaaaaa">Ovren Live Preview: describe a website change,</text>
  <text x="88" y="366" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="23" font-weight="400" fill="#aaaaaa">click it like a visitor, then approve.</text>

  <!-- Key insight block -->
  <rect x="88" y="406" width="680" height="120" rx="6" fill="#0a1e30" stroke="#1a3a50" stroke-width="1"/>
  <text x="112" y="443" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#42b4f5" letter-spacing="1">THE REAL INSIGHT</text>
  <text x="112" y="470" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="17" font-weight="400" fill="#e0e0e0">When an agent executes a change,</text>
  <text x="112" y="494" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="17" font-weight="400" fill="#e0e0e0">every ambiguous approval is an instruction.</text>

  <!-- Right: flow diagram -->
  <text x="820" y="180" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" fill="#42b4f5" letter-spacing="2">OVREN APPROVAL LOOP</text>

  <!-- Flow steps -->
  <rect x="820" y="198" width="300" height="38" rx="4" fill="#0a1e30" stroke="#1a3a50" stroke-width="1"/>
  <text x="970" y="222" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#aaaaaa" text-anchor="middle">Describe change in plain words</text>

  <text x="970" y="254" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#42b4f5" text-anchor="middle">“</text>

  <rect x="820" y="264" width="300" height="38" rx="4" fill="#0a1e30" stroke="#1a3a50" stroke-width="1"/>
  <text x="970" y="288" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#aaaaaa" text-anchor="middle">Built on safe copy</text>

  <text x="970" y="320" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#42b4f5" text-anchor="middle">“</text>

  <rect x="820" y="330" width="300" height="38" rx="4" fill="#0a1e30" stroke="#1a3a50" stroke-width="1"/>
  <text x="970" y="354" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#aaaaaa" text-anchor="middle">Click through the real page</text>

  <text x="970" y="386" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#42b4f5" text-anchor="middle">“</text>

  <rect x="820" y="396" width="300" height="38" rx="4" fill="#0d2810" stroke="#1a5020" stroke-width="1"/>
  <text x="970" y="420" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#7ee88a" text-anchor="middle" font-weight="600">Approve or push back</text>

  <!-- Bottom question -->
  <text x="88" y="572" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#666666">Open question: who writes precise</text>
  <text x="88" y="596" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" fill="#42b4f5">change descriptions for AI-executed updates?</text>

  <!-- Footer -->
  <text x="88" y="640" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#444444">Senior UX perspective · ovren.com</text>
  <text x="1136" y="640" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#444444" text-anchor="end">@c4wchang</text>
</svg>
