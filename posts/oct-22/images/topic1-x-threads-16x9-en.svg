<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg1)"/>

  <!-- Left accent bar -->
  <rect x="64" y="64" width="3" height="547" fill="#c8f542" opacity="0.9"/>

  <!-- Category label -->
  <text x="88" y="108" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#c8f542" letter-spacing="3" opacity="0.8">AI UX · OCT 22, 2026</text>

  <!-- Main headline -->
  <text x="88" y="200" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">AI for things</text>
  <text x="88" y="265" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">you can hold.</text>

  <!-- Divider -->
  <rect x="88" y="295" width="80" height="2" fill="#c8f542" opacity="0.6"/>

  <!-- Sub-headline -->
  <text x="88" y="348" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="24" font-weight="400" fill="#aaaaaa">UseIt Studio ships AI for physical design </text>
  <text x="88" y="378" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="24" font-weight="400" fill="#aaaaaa">editable files, real dimensions, dielines.</text>

  <!-- Key insight block -->
  <rect x="88" y="418" width="660" height="110" rx="6" fill="#1e2a14" opacity="0.9"/>
  <text x="112" y="455" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" font-weight="600" fill="#c8f542" letter-spacing="1">KEY INSIGHT</text>
  <text x="112" y="483" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" font-weight="400" fill="#e8e8e8">"The agent works directly in design software</text>
  <text x="112" y="507" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" font-weight="400" fill="#e8e8e8">instead of generating a picture."</text>

  <!-- Convergence arc label (right side) -->
  <text x="820" y="200" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="600" fill="#c8f542" letter-spacing="2" opacity="0.8">EDITABLE OUTPUT ARC</text>
  <text x="820" y="230" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" fill="#777777">Images ···················</text>
  <text x="820" y="258" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" fill="#777777">Animation layers ·········</text>
  <text x="820" y="286" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" fill="#777777">Video timeline ···········</text>
  <text x="820" y="314" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="15" fill="#777777">Brand design structure ···</text>
  <text x="820" y="344" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="18" font-weight="700" fill="#c8f542">Physical design  DONE</text>

  <!-- Bottom tag line -->
  <text x="88" y="612" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#555555">Senior UX perspective · useit.im</text>

  <!-- Watermark / handle area -->
  <text x="1136" y="612" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" fill="#444444" text-anchor="end">@c4wchang</text>
